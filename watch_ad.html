<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>MegaTask - مشاهدة الإعلان</title>
    
    <!-- كود إعلانات Monetag الخاص بك -->
    <script src='https://libtl.com/sdk.js' data-zone='10959333' data-sdk='show_10959333'></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="security.js"></script>

    <style>
        :root {
            --main-green: #00d26a;
            --gold: #ffaa00;
            --crimson: #ff3d57;
            --dark-bg: #0d0f12;
            --card-bg: #1a1d23;
            --text-gray: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--dark-bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .ad-card {
            background: var(--card-bg);
            border: 1.5px solid #2d333d;
            border-radius: 25px;
            padding: 35px 25px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 25px rgba(0, 210, 106, 0.12);
        }
        .icon { font-size: 55px; margin-bottom: 15px; }
        h2 { color: var(--main-green); margin-bottom: 10px; font-size: 22px; }
        p { color: var(--text-gray); font-size: 13px; line-height: 1.6; margin-bottom: 25px; }
        .btn-ad {
            background: linear-gradient(135deg, var(--main-green), #009e4f);
            color: black;
            border: none;
            padding: 16px 25px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0, 210, 106, 0.25);
        }
        .btn-ad:active { transform: scale(0.97); }
        .btn-ad:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 15px; font-size: 13px; color: var(--gold); display: none; line-height: 1.6; font-weight: bold; }
    </style>
</head>
<body>

    <div class="ad-card">
        <div class="icon">🎁</div>
        <h2>فك قفل التحميل</h2>
        <p>شاهد إعلاناً قصيراً لفك تشفير المحتوى ودعم استمرار سيرفرات التحميل المجانية، وسيتم إرسال الملف لشات البوت فوراً بعد انتهاء الإعلان.</p>
        
        <button class="btn-ad" id="adBtn" onclick="triggerAd()">📺 بدء مشاهدة الإعلان الآن</button>
        <div class="status" id="statusMsg">⏳ جاري تشغيل الإعلان...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session') || "";
        const mode = params.get('mode') || "video";
        const FLASK_API_BASE = "https://moustafa011494.pythonanywhere.com";

        let isAdRunning = false;

        function triggerAd() {
            if (isAdRunning) return;

            const statusMsg = document.getElementById('statusMsg');
            const adBtn = document.getElementById('adBtn');
            
            if (typeof show_10959333 !== 'function') {
                statusMsg.style.display = "block";
                statusMsg.style.color = "var(--crimson)";
                statusMsg.innerText = "⚠️ لم يتم تحميل محرك الإعلانات! يرجى إيقاف أي مانع إعلانات (AdBlock / DNS) ثم الضغط مرة أخرى.";
                return;
            }

            isAdRunning = true;
            statusMsg.style.display = "block";
            statusMsg.style.color = "var(--gold)";
            statusMsg.innerText = "⏳ جاري عرض الإعلان... يرجى عدم إغلاقه حتى النهاية.";
            adBtn.disabled = true;

            show_10959333().then(async () => {
                statusMsg.style.color = "var(--main-green)";
                statusMsg.innerText = "✅ تم التحقق من مشاهدة الإعلان بنجاح! جاري إرسال الملف للشات...";

                // إرسال إشارة فك القفل للسيرفر فقط عند اكتمال الإعلان بنجاح
                try {
                    await fetch(`${FLASK_API_BASE}/api/ad_done?session=${encodeURIComponent(sessionId)}&mode=${encodeURIComponent(mode)}`);
                } catch (e) {}

                try {
                    tg.sendData(JSON.stringify({
                        action: "ad_reward_complete",
                        session_id: sessionId,
                        mode: mode
                    }));
                } catch (e) {}

                setTimeout(() => tg.close(), 1000);
            }).catch((err) => {
                console.error("Ad error:", err);
                isAdRunning = false;
                adBtn.disabled = false;
                adBtn.innerText = "🔄 إعادة محاولة مشاهدة الإعلان";
                statusMsg.style.color = "var(--crimson)";
                statusMsg.innerText = "❌ لم تكتمل مشاهدة الإعلان! يجب مشاهدته للنهاية لفك قفل التحميل.";
            });
        }
    </script>
</body>
</html>
