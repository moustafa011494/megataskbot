<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Tasks - MegaTask</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --main-green: #00d26a; --dark-bg: #0d0f12; --card-bg: #1a1d23; --text-gray: #9ca3af; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; padding-bottom: 110px; }
        
        .header { text-align: center; padding: 15px 0 20px; }
        .header h2 { margin: 0; font-size: 22px; color: var(--main-green); }
        .header p { margin: 5px 0 0; font-size: 13px; color: var(--text-gray); }

        .stats-bar { display: flex; justify-content: space-around; background: var(--card-bg); border: 1px solid #2d333d; border-radius: 15px; padding: 12px; margin-bottom: 20px; }
        .stat-item { text-align: center; }
        .stat-item b { display: block; font-size: 18px; color: var(--main-green); }
        .stat-item span { font-size: 11px; color: var(--text-gray); }

        .tasks-container { display: flex; flex-direction: column; gap: 12px; }
        .task-card { background: var(--card-bg); border: 1px solid #2d333d; border-radius: 18px; padding: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; transition: 0.2s; }
        .task-card:active { transform: scale(0.98); }
        
        .task-info { display: flex; align-items: center; gap: 12px; flex: 1; }
        .task-icon { width: 44px; height: 44px; border-radius: 12px; background: #11141a; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
        .task-details b { display: block; font-size: 14px; margin-bottom: 3px; color: white; }
        .task-details span { font-size: 12px; color: var(--main-green); font-weight: bold; }

        .btn-task { background: var(--main-green); color: black; border: none; padding: 10px 18px; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .btn-task:active { transform: scale(0.95); }
        .btn-task.done { background: #252932; color: var(--text-gray); cursor: not-allowed; border: 1px solid #333842; }

        .status-box { text-align: center; padding: 40px 15px; color: var(--text-gray); font-size: 14px; line-height: 1.6; }
        .btn-retry { margin-top: 15px; background: #222; border: 1px solid var(--main-green); color: var(--main-green); padding: 8px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(26, 29, 35, 0.95); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #2d333d; z-index: 1000; }
        .nav-item { text-align: center; color: var(--text-gray); font-size: 11px; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: var(--main-green); }
    </style>
</head>
<body>

    <div class="header">
        <h2>مركز المهام 📋</h2>
        <p>أكمل المهام المتاحة واكسب نقاطاً تُضاف لرصيدك فوراً</p>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <b id="user-points">0</b>
            <span>رصيدي الحالي</span>
        </div>
        <div class="stat-item">
            <b id="user-task-earnings">0</b>
            <span>أرباح المهام</span>
        </div>
        <div class="stat-item">
            <b id="completed-count">0</b>
            <span>المهام المنجزة</span>
        </div>
    </div>

    <div id="tasks-list" class="tasks-container">
        <div class="status-box">⏳ جاري جلب المهام من الخادم...</div>
    </div>

    <nav class="navbar">
        <div onclick="goHome()" class="nav-item">🏠<br>الرئيسية</div>
        <div onclick="goTasks()" class="nav-item active">📋<br>اكسب</div>
        <div onclick="goInvite()" class="nav-item">👥<br>أصدقاء</div>
        <div onclick="goProfile()" class="nav-item">👤<br>أنا</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const S_URL = "https://smukfrwnguvmxvfwqwrv.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWtmcnduZ3V2bXh2Zndxd3J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1MDg1NjgsImV4cCI6MjA4NTA4NDU2OH0.NUr7X5V7K-jarVLNm7Ft0dHo6QkIhhGYrkteRRb9wCM";
        const client = supabase.createClient(S_URL, S_KEY);

        const params = new URLSearchParams(window.location.search);
        const tid = String(params.get('id') || tg.initDataUnsafe.user?.id || "").trim();
        let userData = null;

        async function init() {
            if (!tid) {
                document.getElementById('tasks-list').innerHTML = '<div class="status-box">❌ لم يتم التعرف على حسابك، يرجى فتح الصفحة من داخل البوت.</div>';
                return;
            }

            try {
                const { data: user } = await client.from('users').select('*').eq('telegram_id', tid).maybeSingle();
                if (user) {
                    userData = user;
                    updateUI();
                }
            } catch (e) {
                console.error("User fetch error:", e);
            }

            loadTasks();
        }

        function updateUI() {
            if (!userData) return;
            document.getElementById('user-points').innerText = (userData.points || 0).toLocaleString();
            document.getElementById('user-task-earnings').innerText = (userData.task_earnings || 0).toLocaleString();
        }

        async function loadTasks() {
            const container = document.getElementById('tasks-list');

            try {
                // جلب المهام الحقيقية المضافة من لوحة التحكم من جدول tasks
                const { data: tasks, error } = await client
                    .from('tasks')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) {
                    console.error("Supabase tasks error:", error);
                    container.innerHTML = `
                        <div class="status-box">
                            ⚠️ تعذر تحميل المهام من قاعدة البيانات.<br>
                            <small style="color: #666;">${error.message || ''}</small><br>
                            <button class="btn-retry" onclick="loadTasks()">إعادة المحاولة 🔄</button>
                        </div>`;
                    return;
                }

                if (!tasks || tasks.length === 0) {
                    container.innerHTML = `
                        <div class="status-box">
                            🎯 لا توجد مهام جديدة متاحة حالياً.<br>
                            تابعنا وسيتم إضافة مهام يومية جديدة قريباً!
                        </div>`;
                    document.getElementById('completed-count').innerText = "0/0";
                    return;
                }

                // جلب المهام المنجزة من قاعدة البيانات أو التخزين المحلي
                const completedMap = JSON.parse(localStorage.getItem(`completed_tasks_${tid}`) || "{}");

                container.innerHTML = "";
                let countDone = 0;

                tasks.forEach(task => {
                    const taskId = String(task.id);
                    const taskTitle = task.title || task.name || "مهمة سريعة";
                    const taskReward = Number(task.reward || task.points || 50);
                    const taskUrl = task.url || task.link || "#";
                    const taskIcon = task.icon || "🎯";

                    const isDone = completedMap[taskId] === true;
                    if (isDone) countDone++;

                    const btnHtml = isDone 
                        ? `<button class="btn-task done" disabled>منجز ✅</button>`
                        : `<button class="btn-task" onclick="startTask('${taskId}', '${taskUrl}', ${taskReward}, this)">تنفيذ</button>`;

                    container.innerHTML += `
                        <div class="task-card">
                            <div class="task-info">
                                <div class="task-icon">${taskIcon}</div>
                                <div class="task-details">
                                    <b>${taskTitle}</b>
                                    <span>+${taskReward.toLocaleString()} نقطة</span>
                                </div>
                            </div>
                            ${btnHtml}
                        </div>
                    `;
                });

                document.getElementById('completed-count').innerText = `${countDone}/${tasks.length}`;

            } catch (err) {
                console.error("Tasks load exception:", err);
                container.innerHTML = `
                    <div class="status-box">
                        ❌ حدث خطأ في الاتصال بالخادم.<br>
                        <button class="btn-retry" onclick="loadTasks()">إعادة المحاولة 🔄</button>
                    </div>`;
            }
        }

        // بدء تنفيذ المهمة
        function startTask(taskId, url, reward, btn) {
            btn.disabled = true;
            btn.innerText = "⏳ تحقق...";

            if (url && url !== "#") {
                if (url.startsWith("https://t.me") || url.startsWith("tg://")) {
                    tg.openTelegramLink(url);
                } else {
                    tg.openLink(url);
                }
            }

            // مهلة تحقق ذكية (5 ثوانٍ) لإتاحة الانضمام أو إتمام الخطوة
            setTimeout(() => {
                claimTaskReward(taskId, reward, btn);
            }, 5000);
        }

        // صرف المكافأة وتحديث رصيد المهام task_earnings
        async function claimTaskReward(taskId, reward, btn) {
            try {
                // جلب أحدث رصيد للمستخدم لضمان دقة العمليات الحسابية
                const { data: freshUser } = await client.from('users').select('*').eq('telegram_id', tid).single();
                const user = freshUser || userData;

                const curPoints = Number(user?.points || 0);
                const curTotal = Number(user?.total_earned || 0);
                const curTaskEarnings = Number(user?.task_earnings || 0);
                const curTasksCount = Number(user?.total_tasks || 0);

                const newPoints = curPoints + reward;
                const newTotal = curTotal + reward;
                const newTaskEarnings = curTaskEarnings + reward;
                const newTasksCount = curTasksCount + 1;

                const { data, error } = await client.from('users').update({
                    points: newPoints,
                    total_earned: newTotal,
                    task_earnings: newTaskEarnings,
                    total_tasks: newTasksCount
                }).eq('telegram_id', tid).select().single();

                if (!error && data) {
                    userData = data;
                    updateUI();

                    // حفظ المهمة كـ "منجزة"
                    let completedMap = JSON.parse(localStorage.getItem(`completed_tasks_${tid}`) || "{}");
                    completedMap[taskId] = true;
                    localStorage.setItem(`completed_tasks_${tid}`, JSON.stringify(completedMap));

                    btn.className = "btn-task done";
                    btn.innerText = "منجز ✅";

                    // تحديث عداد المهام المنجزة بالأعلى
                    const totalCards = document.querySelectorAll('.task-card').length;
                    const doneCards = document.querySelectorAll('.btn-task.done').length;
                    document.getElementById('completed-count').innerText = `${doneCards}/${totalCards}`;

                    tg.showAlert(`🎉 كفو! تم إنجاز المهمة وإضافة +${reward.toLocaleString()} نقطة إلى رصيدك بنجاح!`);
                } else {
                    btn.disabled = false;
                    btn.innerText = "تنفيذ";
                    tg.showAlert("❌ تعذر حفظ المكافأة في السيرفر، يرجى المحاولة مرة أخرى.");
                }
            } catch (e) {
                console.error("Claim error:", e);
                btn.disabled = false;
                btn.innerText = "تنفيذ";
                tg.showAlert("❌ حدث خطأ أثناء الاتصال بالخادم.");
            }
        }

        // دوال التنقل
        function goHome() { window.location.href = `index.html?id=${tid}&t=${Date.now()}`; }
        function goTasks() { window.location.href = `tasks.html?id=${tid}&t=${Date.now()}`; }
        function goInvite() { window.location.href = `invite.html?id=${tid}&t=${Date.now()}`; }
        function goProfile() { window.location.href = `profile.html?id=${tid}&t=${Date.now()}`; }

        init();
    </script>
</body>
</html>
