<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Temp Mail - MegaTask</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main-green: #00d26a; --dark-bg: #0d0f12; --card-bg: #1a1d23; --text-gray: #9ca3af; }
        * { box-sizing: border-box; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; padding-bottom: 110px; }
        
        .header { text-align: center; padding: 10px 0 20px; }
        .header h2 { margin: 0; font-size: 22px; color: var(--main-green); }
        .header p { margin: 5px 0 0; font-size: 13px; color: var(--text-gray); }

        /* صندوق الإيميل المولد */
        .email-box { background: var(--card-bg); border: 1px solid #2d333d; border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0, 210, 106, 0.05); }
        .email-display { background: #000; border: 1px solid #333; border-radius: 12px; padding: 12px 10px; font-size: 14px; color: var(--main-green); font-weight: bold; margin: 10px 0 15px; word-break: break-all; user-select: all; }
        
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { background: var(--main-green); color: black; border: none; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:active { transform: scale(0.96); }
        .btn-secondary { background: #252932; color: white; border: 1px solid #333842; }

        /* صندوق الوارد */
        .inbox-header { display: flex; justify-content: space-between; align-items: center; margin: 25px 5px 12px; }
        .inbox-header h3 { margin: 0; font-size: 16px; color: white; }
        .auto-refresh { font-size: 11px; color: var(--text-gray); }

        .messages-list { display: flex; flex-direction: column; gap: 10px; }
        .msg-card { background: var(--card-bg); border: 1px solid #2d333d; border-radius: 15px; padding: 15px; cursor: pointer; transition: 0.2s; text-align: right; }
        .msg-card:active { border-color: var(--main-green); }
        .msg-sender { font-size: 13px; font-weight: bold; color: var(--main-green); margin-bottom: 4px; display: flex; justify-content: space-between; }
        .msg-date { font-size: 10px; color: var(--text-gray); font-weight: normal; }
        .msg-subject { font-size: 13px; color: white; margin-bottom: 4px; }
        .msg-snippet { font-size: 11px; color: var(--text-gray); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .empty-inbox { text-align: center; padding: 40px 15px; color: var(--text-gray); font-size: 13px; line-height: 1.6; }

        /* نافذة قراءة الرسالة */
        #mail-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
        .modal-body { background: var(--card-bg); border: 1px solid #2d333d; border-radius: 20px; padding: 20px; width: 100%; max-height: 80vh; overflow-y: auto; text-align: right; }
        .modal-title { font-size: 16px; color: var(--main-green); margin-bottom: 8px; }
        .modal-meta { font-size: 11px; color: var(--text-gray); border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-content { font-size: 13px; line-height: 1.7; color: #ddd; word-break: break-word; }

        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(26, 29, 35, 0.95); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #2d333d; z-index: 1000; }
        .nav-item { text-align: center; color: var(--text-gray); font-size: 11px; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: var(--main-green); }
    </style>
</head>
<body>

    <div class="header">
        <h2>البريد المؤقت 📧</h2>
        <p>أنشئ بريداً مؤقتاً لاستقبال رسائل وأكواد التفعيل فوراً</p>
    </div>

    <div class="email-box">
        <span style="font-size: 12px; color: var(--text-gray);">عنوان البريد النشط الخاص بك:</span>
        <div class="email-display" id="active-email">⏳ جاري الاتصال وتوليد البريد...</div>
        
        <div class="actions-grid">
            <button class="btn" onclick="copyEmail()">📋 نسخ الإيميل</button>
            <button class="btn btn-secondary" onclick="confirmNewEmail()">🔄 إيميل جديد</button>
        </div>
    </div>

    <div class="inbox-header">
        <h3>صندوق الوارد (الواردات) 📥</h3>
        <span class="auto-refresh" id="refresh-status">تحديث تلقائي مستمر ⚡</span>
    </div>

    <div id="messages-container" class="messages-list">
        <div class="empty-inbox">⏳ بانتظار وصول رسائل أو أكواد التفعيل...</div>
    </div>

    <!-- نافذة قراءة محتوى الرسالة -->
    <div id="mail-modal">
        <div class="modal-body">
            <h4 class="modal-title" id="m-subject">الموضوع</h4>
            <div class="modal-meta" id="m-meta">من: ...</div>
            <div class="modal-content" id="m-body">المحتوى...</div>
            <button class="btn" style="width: 100%; margin-top: 20px;" onclick="closeModal()">إغلاق النافذة</button>
        </div>
    </div>

    <nav class="navbar">
        <div onclick="goHome()" class="nav-item">🏠<br>الرئيسية</div>
        <div onclick="goTasks()" class="nav-item">📋<br>اكسب</div>
        <div onclick="goInvite()" class="nav-item">👥<br>أصدقاء</div>
        <div onclick="goProfile()" class="nav-item">👤<br>أنا</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const tid = String(params.get('id') || tg.initDataUnsafe.user?.id || "").trim();

        let currentAccount = null;
        let pollTimer = null;
        let isFetching = false;
        let inboxCache = [];
        let lastRenderedSignature = "";

        async function initMail() {
            const savedData = localStorage.getItem('temp_mail_stable_v4');
            if (savedData) {
                try {
                    currentAccount = JSON.parse(savedData);
                    document.getElementById('active-email').innerText = currentAccount.address;
                    fetchMessages();
                } catch (e) {
                    await generateNewEmail();
                }
            } else {
                await generateNewEmail();
            }

            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(fetchMessages, 3500);
        }

        // نافذة التأكيد قبل إنشاء بريد جديد
        function confirmNewEmail() {
            const warningMsg = "⚠️ هل أنت متأكد من إنشاء بريد جديد؟\n\nسيتم حذف البريد الحالي وصندوق الرسائل الواردة نهائياً ولن تتمكن من استرجاعهما.";

            if (tg.showConfirm) {
                tg.showConfirm(warningMsg, (confirmed) => {
                    if (confirmed) {
                        generateNewEmail();
                    }
                });
            } else {
                if (confirm(warningMsg)) {
                    generateNewEmail();
                }
            }
        }

        // توليد بريد جديد
        async function generateNewEmail() {
            const display = document.getElementById('active-email');
            display.innerText = "⏳ جاري توليد بريد جديد...";
            inboxCache = [];
            lastRenderedSignature = "";
            document.getElementById('messages-container').innerHTML = 
                '<div class="empty-inbox">⏳ بانتظار وصول رسائل أو أكواد التفعيل...</div>';

            // 1. محرك DropMail GraphQL
            try {
                const res = await fetch("https://dropmail.me/api/graphql/web-test-20140228", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        query: "mutation { introduceSession { id, addresses { address } } }"
                    })
                });

                if (res.ok) {
                    const json = await res.json();
                    const sess = json.data?.introduceSession;
                    if (sess && sess.addresses && sess.addresses.length > 0) {
                        currentAccount = {
                            provider: "dropmail",
                            id: sess.id,
                            address: sess.addresses[0].address
                        };
                        localStorage.setItem('temp_mail_stable_v4', JSON.stringify(currentAccount));
                        display.innerText = currentAccount.address;
                        tg.showAlert("✅ تم إنشاء بريد مؤقت جديد بنجاح!");
                        return;
                    }
                }
            } catch (err1) {
                console.warn("DropMail unavailable, switching to Guerrilla Mail...", err1);
            }

            // 2. محرك Guerrilla Mail REST API
            try {
                const res = await fetch("https://api.guerrillamail.com/ajax.php?f=get_email_address");
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.email_addr) {
                        currentAccount = {
                            provider: "guerrilla",
                            token: data.sid_token,
                            address: data.email_addr
                        };
                        localStorage.setItem('temp_mail_stable_v4', JSON.stringify(currentAccount));
                        display.innerText = currentAccount.address;
                        tg.showAlert("✅ تم إنشاء بريد مؤقت جديد بنجاح!");
                        return;
                    }
                }
            } catch (err2) {
                console.error("Guerrilla Mail error:", err2);
            }

            display.innerText = "❌ تعذر الاتصال، اضغط (إيميل جديد) للمحاولة";
        }

        // فحص صندوق الوارد
        async function fetchMessages() {
            if (!currentAccount || !currentAccount.address || isFetching) return;
            isFetching = true;

            try {
                if (currentAccount.provider === "dropmail") {
                    const res = await fetch("https://dropmail.me/api/graphql/web-test-20140228", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            query: `query { session(id: "${currentAccount.id}") { mails { id, fromAddr, headerSubject, text, html, receivedAt } } }`
                        })
                    });

                    if (res.ok) {
                        const json = await res.json();
                        const mails = json.data?.session?.mails || [];
                        const formatted = mails.map(m => ({
                            id: String(m.id),
                            from: m.fromAddr,
                            subject: m.headerSubject || "(بدون عنوان)",
                            snippet: m.text ? m.text.slice(0, 75) : "اضغط لقراءة الرسالة...",
                            date: new Date(m.receivedAt * 1000 || m.receivedAt).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                            fullDate: new Date(m.receivedAt * 1000 || m.receivedAt).toLocaleString('ar-EG'),
                            html: m.html,
                            text: m.text
                        }));
                        updateInbox(formatted);
                    }
                } else if (currentAccount.provider === "guerrilla") {
                    const res = await fetch(`https://api.guerrillamail.com/ajax.php?f=get_email_list&offset=0&sid_token=${currentAccount.token}`);
                    if (res.ok) {
                        const data = await res.json();
                        const list = (data.list || []).filter(m => !String(m.mail_from).includes("guerrillamail.com"));
                        const formatted = list.map(m => ({
                            id: String(m.mail_id),
                            from: m.mail_from,
                            subject: m.mail_subject || "(بدون عنوان)",
                            snippet: m.mail_excerpt || "اضغط لقراءة الرسالة...",
                            date: m.mail_date ? m.mail_date.split(" ")[1] : "الآن",
                            fullDate: m.mail_date || "الآن",
                            html: null,
                            text: null
                        }));
                        updateInbox(formatted);
                    }
                }
            } catch (e) {
                console.warn("Poll warning:", e);
            } finally {
                isFetching = false;
            }
        }

        // تحديث الصندوق الذكي بدون وميض
        function updateInbox(incomingList) {
            if (incomingList && incomingList.length > 0) {
                incomingList.forEach(incoming => {
                    const idx = inboxCache.findIndex(m => m.id === incoming.id);
                    if (idx === -1) {
                        inboxCache.unshift(incoming);
                    } else {
                        inboxCache[idx] = Object.assign(inboxCache[idx], incoming);
                    }
                });
            }

            const currentSignature = inboxCache.map(m => m.id).join("|");
            if (currentSignature === lastRenderedSignature) {
                return;
            }
            lastRenderedSignature = currentSignature;

            const container = document.getElementById('messages-container');
            if (inboxCache.length === 0) {
                container.innerHTML = '<div class="empty-inbox">⏳ بانتظار وصول رسائل أو أكواد التفعيل...</div>';
                return;
            }

            container.innerHTML = "";
            inboxCache.forEach(msg => {
                container.innerHTML += `
                    <div class="msg-card" onclick="openMessage('${msg.id}')">
                        <div class="msg-sender">
                            <span>${msg.from}</span>
                            <span class="msg-date">${msg.date}</span>
                        </div>
                        <div class="msg-subject">✉️ <b>${msg.subject}</b></div>
                        <div class="msg-snippet">${msg.snippet}</div>
                    </div>
                `;
            });
        }

        // فتح وعرض تفاصيل الرسالة
        async function openMessage(msgId) {
            const msg = inboxCache.find(m => m.id === String(msgId));
            if (!msg) return;

            document.getElementById('m-subject').innerText = msg.subject;
            document.getElementById('m-meta').innerText = `من: ${msg.from} | التاريخ: ${msg.fullDate}`;
            const bodyContainer = document.getElementById('m-body');

            if (msg.html) {
                bodyContainer.innerHTML = msg.html;
            } else if (msg.text) {
                bodyContainer.innerText = msg.text;
            } else if (currentAccount.provider === "guerrilla") {
                bodyContainer.innerText = "⏳ جاري قراءة محتوى الرسالة...";
                document.getElementById('mail-modal').style.display = 'flex';
                try {
                    const res = await fetch(`https://api.guerrillamail.com/ajax.php?f=fetch_email&email_id=${msgId}&sid_token=${currentAccount.token}`);
                    const full = await res.json();
                    bodyContainer.innerHTML = full.mail_body || "الرسالة فارغة";
                } catch (err) {
                    bodyContainer.innerText = "❌ تعذر تحميل نص الرسالة.";
                }
                return;
            } else {
                bodyContainer.innerText = "الرسالة لا تحتوي على نص.";
            }

            document.getElementById('mail-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('mail-modal').style.display = 'none';
        }

        function copyEmail() {
            const email = document.getElementById('active-email').innerText;
            if (!email.includes('@')) return;
            navigator.clipboard.writeText(email);
            tg.showAlert("✅ تم نسخ الإيميل المؤقت للحافظة بنجاح!");
        }

        // دوال التنقل
        function goHome() { window.location.href = `index.html?id=${tid}&t=${Date.now()}`; }
        function goTasks() { window.location.href = `tasks.html?id=${tid}&t=${Date.now()}`; }
        function goInvite() { window.location.href = `invite.html?id=${tid}&t=${Date.now()}`; }
        function goProfile() { window.location.href = `profile.html?id=${tid}&t=${Date.now()}`; }

        initMail();
    </script>
</body>
</html>
