<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaTask - قسم الميثودات</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --main-green: #00d26a; --dark-bg: #0d0f12; --card-bg: #1a1d23; --text-gray: #9ca3af; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; padding-bottom: 90px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: var(--main-green); margin: 0; }
        .methods-container { display: flex; flex-direction: column; gap: 15px; }
        .method-card { background: var(--card-bg); border: 1px solid #2d333d; border-radius: 15px; padding: 15px; }
        .method-title { font-size: 15px; font-weight: bold; color: var(--main-green); margin-bottom: 5px; }
        .method-desc { font-size: 12px; color: var(--text-gray); margin-bottom: 10px; line-height: 1.5; }
        .method-links { background: #11141a; padding: 10px; border-radius: 10px; font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; color: #ddd; max-height: 180px; overflow-y: auto; }
        .notif-badge { background: #ff3b30; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-right: 5px; }
        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(26, 29, 35, 0.95); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #2d333d; z-index: 1000; }
        .nav-item { text-align: center; color: var(--text-gray); font-size: 11px; text-decoration: none; cursor: pointer; }
        .nav-item.active { color: var(--main-green); }
    </style>
</head>
<body>

    <div class="header">
        <h2>🔓 قسم الميثودات والثغرات</h2>
        <p style="font-size: 12px; color: var(--text-gray);">أحدث الطرق والمواقع الحصرية لتفعيل الحسابات</p>
    </div>

    <div id="notifications-area" style="margin-bottom: 15px;"></div>
    <div id="methods-list" class="methods-container">
        <div style="text-align: center; color: var(--text-gray); padding: 30px;">⏳ جاري تحميل الميثودات...</div>
    </div>

    <nav class="navbar">
        <div onclick="goHome()" class="nav-item">🏠<br>الرئيسية</div>
        <div onclick="goTasks()" class="nav-item">📋<br>اكسب</div>
        <div onclick="goInvite()" class="nav-item">👥<br>أجل</div>
        <div onclick="goProfile()" class="nav-item">👤<br>أنا</div>
    </nav>

        <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const S_URL = "https://smukfrwnguvmxvfwqwrv.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWtmcnduZ3V2bXh2Zndxd3J2In0.NUr7X5V7K-jarVLNm7Ft0dHo6QkIhhGYrkteRRb9wCM";
        const client = supabase.createClient(S_URL, S_KEY);

        const params = new URLSearchParams(window.location.search);
        const userId = String(params.get('id') || tg.initDataUnsafe.user?.id || "").trim();

        async function initMethodsPage() {
            const listEl = document.getElementById('methods-list');

            if (userId) {
                try {
                    const { data: notifs } = await client.from('user_notifications').select('*').eq('user_id', userId).eq('is_read', false);
                    if (notifs && notifs.length > 0) {
                        const notifArea = document.getElementById('notifications-area');
                        notifArea.innerHTML = `<div style="background: rgba(0, 210, 106, 0.1); border: 1px solid var(--main-green); padding: 10px; border-radius: 12px; font-size: 12px;">
                            🔔 لديك <span style="color:var(--main-green); font-weight:bold;">${notifs.length}</span> إشعارات جديدة تم اضافتها!
                        </div>`;
                        await client.from('user_notifications').update({ is_read: true }).eq('user_id', userId).eq('is_read', false);
                    }
                } catch (e) {
                    console.log("Notif error:", e);
                }
            }

            try {
                // جلب الميثودات من قاعدة البيانات
                const { data: methods, error } = await client.from('methods').select('*').order('id', { ascending: false });

                if (error) {
                    throw new Error(error.message);
                }

                if (!methods || methods.length === 0) {
                    listEl.innerHTML = `<div style="text-align: center; color: var(--text-gray); padding: 30px;">لا توجد ميثودات مضافة حالياً في قاعدة البيانات.</div>`;
                    return;
                }

                listEl.innerHTML = "";
                methods.forEach(m => {
                    listEl.innerHTML += `
                        <div class="method-card">
                            <div class="method-title">${m.title}</div>
                            <div class="method-desc">${m.description || ''}</div>
                            <div class="method-links">${m.content}</div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Load methods error:", err);
                listEl.innerHTML = `<div style="text-align: center; color: #ff3b30; padding: 30px;">❌ خطأ في تحميل الميثودات: ${err.message}</div>`;
            }
        }

        function goHome() { window.location.href = `index.html?id=${userId}`; }
        function goTasks() { window.location.href = `tasks.html?id=${userId}`; }
        function goInvite() { window.location.href = `invite.html?id=${userId}`; }
        function goProfile() { window.location.href = `profile.html?id=${userId}`; }

        initMethodsPage();
    </script>
</body>
</html>
