<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaTask - قسم الميثودات</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --main-green: #00d26a; --dark-bg: #0d0f12; --card-bg: #1a1d23; --text-gray: #9ca3af; --neon-blue: #00f2ff; }
        * { box-sizing: border-box; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; padding-bottom: 110px; }
        
        .header { text-align: center; padding: 10px 0 15px; }
        .header h2 { margin: 0; font-size: 22px; color: var(--main-green); }
        .header p { margin: 5px 0 0; font-size: 13px; color: var(--text-gray); }

        .btn-submit-method { background: linear-gradient(135deg, #00d26a, #009e4f); color: #000; border: none; width: 100%; padding: 14px; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0, 210, 106, 0.2); }
        .btn-submit-method:active { transform: scale(0.98); }

        .methods-container { display: flex; flex-direction: column; gap: 15px; }
        .method-card { background: var(--card-bg); border: 1px solid #2d333d; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
        .method-title { font-size: 16px; font-weight: bold; color: white; display: flex; justify-content: space-between; align-items: center; }
        
        .method-content { font-size: 13px; color: #ddd; line-height: 1.7; background: #11141a; padding: 12px; border-radius: 12px; border: 1px solid #22262f; white-space: pre-wrap; word-break: break-word; }
        .method-content a { color: var(--neon-blue); text-decoration: underline; }
        
        .locked-box { background: #11141a; border: 1px dashed #444; padding: 15px; border-radius: 12px; text-align: center; color: var(--text-gray); font-size: 13px; }
        .btn-unlock { background: linear-gradient(135deg, #ffaa00, #e67e00); color: black; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 10px; }

        .method-img-container { position: relative; width: 100%; border-radius: 12px; overflow: hidden; max-height: 220px; border: 1px solid #333; cursor: zoom-in; }
        .method-img-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .method-footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-gray); border-top: 1px solid #252932; padding-top: 10px; }
        .reward-badge { background: rgba(0, 210, 106, 0.1); border: 1px solid var(--main-green); color: var(--main-green); padding: 4px 10px; border-radius: 8px; font-weight: bold; }

        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: 9999; align-items: center; justify-content: center; padding: 15px; }
        .modal-body { background: var(--card-bg); border: 1px solid #2d333d; border-radius: 20px; padding: 20px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; text-align: right; }
        .modal-title { font-size: 17px; color: var(--main-green); margin-top: 0; margin-bottom: 15px; text-align: center; }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-gray); margin-bottom: 5px; }
        .input-field { width: 100%; background: #000; border: 1px solid #333; padding: 12px; color: white; border-radius: 10px; outline: none; font-size: 13px; font-family: inherit; box-sizing: border-box; }
        .input-field:focus { border-color: var(--main-green); }

        .preview-box { width: 100%; height: 140px; border-radius: 12px; border: 2px dashed #444; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 10px 0; background: #0b0d10; }
        .preview-box img { width: 100%; height: 100%; object-fit: contain; }

        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; }
        .btn-confirm { background: var(--main-green); color: black; }
        .btn-cancel { background: #252932; color: white; }

        /* Lightbox with zoom */
        #lightbox-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.96); z-index: 100000; flex-direction: column; align-items: center; justify-content: space-between; padding: 15px; }
        .lightbox-toolbar { width: 100%; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .lightbox-controls { display: flex; gap: 10px; }
        .lightbox-btn { background: #22262f; border: 1px solid #444; color: white; font-size: 14px; font-weight: bold; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
        .lightbox-viewport { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; overflow: auto; position: relative; margin: 10px 0; }
        #lightbox-img { max-width: 95vw; max-height: 75vh; object-fit: contain; transition: transform 0.2s ease; transform-origin: center center; }

        .status-box { text-align: center; padding: 40px 15px; color: var(--text-gray); font-size: 13px; line-height: 1.6; }

        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(26, 29, 35, 0.95); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #2d333d; z-index: 1000; }
        .nav-item { text-align: center; color: var(--text-gray); font-size: 11px; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: var(--main-green); }
    </style>
</head>
<body>

    <div class="header">
        <h2>مكتبة الثغرات والميثودات 🔓</h2>
        <p>استكشف الطرق المجربة للربح، أو شاركنا ميثود الخاصتك لكسب النقاط</p>
    </div>

    <button class="btn-submit-method" onclick="openSubmitModal()">
        💡 شاركنا ميثود أو ثغرة ربحية جديدة
    </button>

    <div id="methods-list" class="methods-container">
        <div class="status-box">⏳ جاري جلب الميثودات...</div>
    </div>

    <!-- نافذة إرسال ميثود جديدة -->
    <div id="submit-modal" class="modal-overlay">
        <div class="modal-body">
            <h3 class="modal-title">💡 إضافة ميثود جديدة</h3>
            
            <div class="input-group">
                <label>عنوان الميثود باختصار:</label>
                <input type="text" id="m-title" class="input-field" placeholder="مثلاً: طريقة زيادة أرباح الإحالة">
            </div>

            <div class="input-group">
                <label>شرح الميثود بالتفصيل (يمكنك إضافة روابط):</label>
                <textarea id="m-content" class="input-field" rows="6" placeholder="اكتب التفاصيل والخطوات بوضوح ليتمكن الآخرون من الاستفادة منها..."></textarea>
            </div>

            <div class="input-group">
                <label>صورة توضيحية من هاتفك (اختياري):</label>
                <input type="file" id="m-img-file" class="input-field" accept="image/*" onchange="previewMethodImage(this)">
                <div id="m-img-preview" class="preview-box" style="height: 100px; display: none; margin-top: 8px;">
                    <img id="m-preview-tag" src="" alt="معاينة الصورة">
                </div>
            </div>

            <div class="modal-buttons">
                <button id="btn-submit-m" class="btn-confirm" onclick="submitNewMethod()">تأكيد وإرسال للإدارة 🚀</button>
                <button class="btn-cancel" onclick="closeSubmitModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- عارض الصور المتقدم مع تكبير وتصغير -->
    <div id="lightbox-modal">
        <div class="lightbox-toolbar">
            <div class="lightbox-controls">
                <button class="lightbox-btn" onclick="zoomImage(0.25)">🔍+ تكبير</button>
                <button class="lightbox-btn" onclick="zoomImage(-0.25)">🔍- تصغير</button>
                <button class="lightbox-btn" onclick="resetZoom()">🔄 إعادة ضبط</button>
            </div>
            <button class="lightbox-btn" style="background: #ff3b30;" onclick="closeLightbox()">✖ إغلاق</button>
        </div>
        <div class="lightbox-viewport">
            <img id="lightbox-img" src="" alt="Fullscreen">
        </div>
    </div>

    <nav class="navbar">
        <div onclick="goHome()" class="nav-item">🏠<br>الرئيسية</div>
        <div onclick="goTasks()" class="nav-item">📋<br>اكسب</div>
        <div onclick="goInvite()" class="nav-item">👥<br>أصدقاء</div>
        <div onclick="goProfile()" class="nav-item">👤<br>أنا</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const S_URL = "https://smukfrwnguvmxvfwqwrv.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWtmcnduZ3V2bXh2Zndxd3J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1MDg1NjgsImV4cCI6MjA4NTA4NDU2OH0.NUr7X5V7K-jarVLNm7Ft0dHo6QkIhhGYrkteRRb9wCM"; 
        const client = supabase.createClient(S_URL, S_KEY);

        const params = new URLSearchParams(window.location.search);
        const tid = String(params.get('id') || tg.initDataUnsafe.user?.id || "").trim();
        let methodBase64Image = "";
        let currentZoom = 1;
        let unlockedMethodsSet = new Set();
        let userPoints = 0;

        function escapeHtml(str) {
            return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function linkifyText(text) {
            const escaped = escapeHtml(text);
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return escaped.replace(urlRegex, '<a href="$1" target="_blank">$1</a>');
        }

        async function init() {
            if (tid) {
                try {
                    const { data: uData } = await client.from('users').select('points').eq('telegram_id', tid).maybeSingle();
                    if (uData) userPoints = uData.points || 0;

                    const { data: unlocks } = await client.from('method_unlocks').select('method_id').eq('user_id', tid);
                    if (unlocks) {
                        unlocks.forEach(un => unlockedMethodsSet.add(String(un.method_id)));
                    }
                } catch (e) {}
            }
            loadApprovedMethods();
        }

        async function loadApprovedMethods() {
            const container = document.getElementById('methods-list');
            try {
                const { data: methods, error } = await client
                    .from('methods')
                    .select('*')
                    .eq('status', 'Approved')
                    .order('id', { ascending: false });

                if (error) throw error;

                if (!methods || methods.length === 0) {
                    container.innerHTML = '<div class="status-box">🔓 لا توجد ميثودات منشورة حالياً.<br>كن أول من يشاركنا ميثود أو ثغرة ربحية!</div>';
                    return;
                }

                container.innerHTML = "";
                methods.forEach(m => {
                    const mId = String(m.id);
                    const isOwner = String(m.user_id) === String(tid);
                    const isUnlocked = unlockedMethodsSet.has(mId) || isOwner;
                    const dateStr = new Date(m.created_at).toLocaleDateString('ar-EG');
                    
                    const rewardBadge = (m.points_awarded && m.points_awarded > 0) 
                        ? `<div class="reward-badge">🎁 تم مكافأة المطور بـ ${m.points_awarded.toLocaleString()} نقطة</div>` 
                        : `<div></div>`;

                    let bodyHtml = "";
                    if (isUnlocked) {
                        const imgHtml = m.image_url ? `
                            <div class="method-img-container" onclick="openLightbox('${m.image_url}')">
                                <img src="${m.image_url}" alt="Method Image">
                                <div style="position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.75); color: white; font-size: 11px; padding: 4px 8px; border-radius: 6px;">🔍 اضغط للتكبير</div>
                            </div>
                        ` : '';
                        bodyHtml = `
                            <div class="method-content">${linkifyText(m.content)}</div>
                            ${imgHtml}
                        `;
                    } else {
                        bodyHtml = `
                            <div class="locked-box">
                                🔒 محتوى هذه الميثود مقفل.<br>
                                اضغط على زر الشراء لفك الحجب وعرض الشرح الكامل مقابل <b>50 نقطة</b> فقط.
                                <br>
                                <button class="btn-unlock" onclick="unlockMethod(${m.id})">🔓 شراء وفك الحجب (50 نقطة)</button>
                            </div>
                        `;
                    }

                    container.innerHTML += `
                        <div class="method-card">
                            <div class="method-title">
                                <span>📌 ${escapeHtml(m.title)}</span>
                            </div>
                            ${bodyHtml}
                            <div class="method-footer">
                                <span>🕒 ${dateStr}</span>
                                ${rewardBadge}
                            </div>
                        </div>
                    `;
                });

            } catch (err) {
                console.error("Load methods error:", err);
                container.innerHTML = '<div class="status-box">❌ تعذر تحميل الميثودات حالياً.</div>';
            }
        }

        async function unlockMethod(methodId) {
            const unlockCost = 50;
            if (userPoints < unlockCost) {
                return tg.showAlert(`❌ رصيدك غير كافٍ!\nمطلوب ${unlockCost} نقطة لفتح هذه الميثود.`);
            }

            if (!confirm(`هل تريد خصم ${unlockCost} نقطة لفتح وعرض محتوى هذه الميثود؟`)) return;

            try {
                const newPoints = userPoints - unlockCost;
                const { error: userErr } = await client.from('users').update({ points: newPoints }).eq('telegram_id', tid);
                if (userErr) throw userErr;

                const { error: unlErr } = await client.from('method_unlocks').insert([{
                    user_id: tid,
                    method_id: parseInt(methodId)
                }]);
                if (unlErr) throw unlErr;

                userPoints = newPoints;
                unlockedMethodsSet.add(String(methodId));
                tg.showAlert("🎉 تم شراء الميثود بنجاح وعرض محتواها بالكامل!");
                loadApprovedMethods();
            } catch (e) {
                tg.showAlert("❌ حدث خطأ أثناء إتمام عملية الشراء.");
            }
        }

        function openSubmitModal() {
            if (!tid) return tg.showAlert("❌ يرجى فتح المنصة من داخل البوت.");
            document.getElementById('m-title').value = "";
            document.getElementById('m-content').value = "";
            document.getElementById('m-img-file').value = "";
            methodBase64Image = "";
            document.getElementById('m-img-preview').style.display = 'none';
            document.getElementById('submit-modal').style.display = 'flex';
        }

        function closeSubmitModal() {
            document.getElementById('submit-modal').style.display = 'none';
        }

        function previewMethodImage(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxW = 700;
                    let w = img.width, h = img.height;
                    if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    methodBase64Image = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('m-preview-tag').src = methodBase64Image;
                    document.getElementById('m-img-preview').style.display = 'flex';
                };
            };
            reader.readAsDataURL(file);
        }

        async function submitNewMethod() {
            const btn = document.getElementById('btn-submit-m');
            const title = document.getElementById('m-title').value.trim();
            const content = document.getElementById('m-content').value.trim();

            if (!title) return tg.showAlert("❌ يرجى إدخال عنوان للميثود!");
            if (!content) return tg.showAlert("❌ يرجى كتابة شرح تفصيلي للميثود!");

            btn.disabled = true;
            btn.innerText = "⏳ جاري الإرسال...";

            try {
                const { error } = await client.from('methods').insert([{
                    user_id: tid,
                    title: title,
                    content: content,
                    image_url: methodBase64Image || null,
                    status: 'Pending'
                }]);

                if (!error) {
                    closeSubmitModal();
                    tg.showAlert("✅ تم إرسال الميثود بنجاح!\nسيتم مراجعتها من قِبل الإدارة وصرف النقاط فور اعتمادها.");
                    loadApprovedMethods();
                } else {
                    tg.showAlert("❌ تعذر إرسال الميثود: " + error.message);
                }
            } catch (e) {
                tg.showAlert("❌ حدث خطأ غير متوقع.");
            } finally {
                btn.disabled = false;
                btn.innerText = "تأكيد وإرسال للإدارة 🚀";
            }
        }

        function openLightbox(imgSrc) {
            const img = document.getElementById('lightbox-img');
            img.src = imgSrc;
            currentZoom = 1;
            img.style.transform = `scale(${currentZoom})`;
            document.getElementById('lightbox-modal').style.display = 'flex';
        }

        function zoomImage(delta) {
            currentZoom = Math.max(0.5, Math.min(3.5, currentZoom + delta));
            document.getElementById('lightbox-img').style.transform = `scale(${currentZoom})`;
        }

        function resetZoom() {
            currentZoom = 1;
            document.getElementById('lightbox-img').style.transform = `scale(${currentZoom})`;
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').style.display = 'none';
        }

        function goHome() { window.location.href = `index.html?id=${tid}`; }
        function goTasks() { window.location.href = `tasks.html?id=${tid}`; }
        function goInvite() { window.location.href = `invite.html?id=${tid}`; }
        function goProfile() { window.location.href = `profile.html?id=${tid}`; }

        init();
    </script>
</body>
</html>
