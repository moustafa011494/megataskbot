<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Downloader Pro - MegaTask</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main-green: #00d26a; --dark-bg: #0d0f12; --card-bg: #1a1d23; --text-gray: #9ca3af; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; padding-bottom: 100px; text-align: center; }
        .header { margin-bottom: 25px; }
        .header h2 { color: var(--main-green); margin-bottom: 5px; }
        .input-box { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid #2d333d; }
        .input-box input { width: 90%; background: #000; border: 1px solid #333; padding: 15px; color: white; border-radius: 12px; outline: none; margin-bottom: 20px; text-align: center; }
        .btn-download { background: var(--main-green); color: black; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
        #result-box { display: none; margin-top: 25px; background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--main-green); }
        .loader { display: none; margin: 20px auto; width: 30px; height: 30px; border: 3px solid #333; border-top: 3px solid var(--main-green); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-back { position: fixed; top: 15px; right: 15px; background: none; border: 1px solid #333; color: white; padding: 5px 15px; border-radius: 10px; font-size: 12px; }
    </style>
</head>
<body>

    <button class="btn-back" onclick="goHome()">رجوع ↩️</button>

    <div class="header">
        <h2>تحميل الوسائط 📥</h2>
        <p style="font-size: 12px; color: var(--text-gray);">TikTok & Instagram Downloader</p>
    </div>

    <div class="input-box">
        <input type="text" id="video-url" placeholder="ضع رابط الفيديو هنا..">
        <button class="btn-download" id="fetch-btn" onclick="fetchVideo()">بدء التحميل الآن ⚡</button>
        <div class="loader" id="loader"></div>
    </div>

    <div id="result-box">
        <p style="font-size: 14px; margin-bottom: 15px; color: var(--main-green);">جاهز للتحميل!</p>
        <button class="btn-download" style="background: white;" id="final-link">حفظ الفيديو في الجهاز ⬇️</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('id');

        async function fetchVideo() {
            const urlInput = document.getElementById('video-url').value.trim();
            if (!urlInput) return tg.showAlert("❌ ضع الرابط أولاً");

            document.getElementById('loader').style.display = 'block';
            document.getElementById('fetch-btn').disabled = true;
            document.getElementById('result-box').style.display = 'none';

            try {
                let apiUrl = "";
                
                // لو الرابط تيك توك بنستخدم سيرفر مخصص وسريع جداً
                if (urlInput.includes("tiktok.com")) {
                    apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`;
                    const res = await fetch(apiUrl);
                    const json = await res.json();
                    
                    if (json.data && json.data.play) {
                        showResult(json.data.play);
                    } else {
                        throw new Error();
                    }
                } 
                // لو إنستجرام أو غيره بنستخدم سيرفر تاني
                else {
                    // سيرفر وسيط للتحميل العام
                    apiUrl = `https://api.vkrdown.com/api/index.php?url=${encodeURIComponent(urlInput)}`;
                    const res = await fetch(apiUrl);
                    const json = await res.json();
                    
                    if (json.data && json.data.url) {
                        showResult(json.data.url);
                    } else {
                        tg.showAlert("❌ هذا الرابط غير مدعوم حالياً");
                    }
                }

            } catch (error) {
                tg.showAlert("⚠️ عذراً، السيرفر لا يستجيب حالياً. جرب رابط آخر.");
            } finally {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('fetch-btn').disabled = false;
            }
        }

        function showResult(downloadUrl) {
            document.getElementById('result-box').style.display = 'block';
            document.getElementById('final-link').onclick = function() {
                // فتح الرابط في متصفح خارجي للتحميل
                tg.openLink(downloadUrl);
            };
        }

        function goHome() {
            window.location.href = `index.html?id=${userId}`;
        }
    </script>
</body>
</html>
