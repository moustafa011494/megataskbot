<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaTask - Media Request</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --main-green: #00d26a;
            --dark-bg: #0d0f12;
            --card-bg: #1a1d23;
            --text-gray: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 25px;
            border: 1px solid #2d333d;
            box-shadow: 0 0 20px rgba(0, 210, 106, 0.05);
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 8px;
            color: var(--main-green);
        }

        p.subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-gray);
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="url"] {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 1px solid #333;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            color: white;
            text-align: center;
        }

        input[type="url"]:focus {
            border-color: var(--main-green);
        }

        label {
            font-size: 13px;
            color: var(--text-gray);
            margin-bottom: -5px;
            text-align: right;
            padding-right: 5px;
        }

        select {
            width: 100%;
            padding: 12px;
            background: #11141a;
            border: 1px solid #2d333d;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
            direction: rtl;
        }

        button {
            background-color: var(--main-green);
            color: black;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-back {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            color: white;
            padding: 5px 15px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button class="btn-back" onclick="goHome()">رجوع ↩️</button>

    <div class="container">
        <h1>التحميل السحابي المباشر ⚡</h1>
        <p class="subtitle">أرسل الطلب للبوت واستلم ملفك فوراً في الشات</p>

        <div class="input-group">
            <input type="url" id="videoUrl" placeholder="الصق رابط الفيديو أو الريل هنا..." required>
            
            <label>نوع الملف المطلوب:</label>
            <select id="downloadMode" onchange="toggleQualitySelect()">
                <option value="video" selected>🎥 فيديو شامل (Video)</option>
                <option value="audio">🎵 صوت فقط (Audio MP3)</option>
            </select>

            <div id="qualityGroup">
                <label>الجودة:</label>
                <select id="videoQuality">
                    <option value="max">🔥 أعلى جودة متاحة (Max)</option>
                    <option value="1080">📺 1080p</option>
                    <option value="720" selected>⚡ 720p</option>
                    <option value="480">📱 480p</option>
                </select>
            </div>

            <button id="sendToBotBtn">🚀 إرسال الطلب للبوت وبدء التحميل</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('id');

        function toggleQualitySelect() {
            const mode = document.getElementById('downloadMode').value;
            document.getElementById('qualityGroup').style.display = mode === 'audio' ? 'none' : 'block';
        }

        document.getElementById('sendToBotBtn').addEventListener('click', () => {
            let videoUrl = document.getElementById('videoUrl').value.trim();
            const mode = document.getElementById('downloadMode').value;
            const quality = document.getElementById('videoQuality').value;

            // تنظيف الرابط
            videoUrl = videoUrl.replace(/^\/+/, '').trim();

            if (!videoUrl) {
                tg.showAlert('❌ من فضلك حط رابط صحيح الأول!');
                return;
            }

            // إرسال البيانات كـ JSON للبوت لإشعال حدث web_app_data
            tg.sendData(JSON.stringify({
                action: "download_media",
                url: videoUrl,
                mode: mode,
                quality: quality
            }));

            // قفل الميني أب فوراً عشان اليوزر يشوف الشات
            tg.close();
        });

        function goHome() {
            window.location.href = `index.html?id=${userId}`;
        }
    </script>
</body>
    </html>
