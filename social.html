<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Downloader Pro - MegaTask</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main-green: #00d26a; --dark-bg: #0d0f12; --card-bg: #1a1d23; --text-gray: #9ca3af; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; padding-bottom: 100px; text-align: center; }
        
        .header { margin-bottom: 25px; }
        .header h2 { color: var(--main-green); margin-bottom: 5px; }
        
        .input-box { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid #2d333d; box-shadow: 0 0 15px rgba(0, 210, 106, 0.05); }
        .input-box input { width: 90%; background: #000; border: 1px solid #333; padding: 15px; color: white; border-radius: 12px; outline: none; margin-bottom: 20px; text-align: center; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; text-align: right; }
        .option-item { background: #000; border: 1px solid #333; padding: 10px; border-radius: 10px; }
        .option-item label { display: block; font-size: 11px; color: var(--text-gray); margin-bottom: 5px; }
        .option-item select { width: 100%; background: transparent; color: white; border: none; outline: none; font-size: 13px; }

        .btn-download { background: var(--main-green); color: black; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-download:disabled { opacity: 0.5; cursor: not-allowed; }

        #result-box { display: none; margin-top: 25px; background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--main-green); }
        
        .loader { display: none; margin: 20px auto; width: 30px; height: 30px; border: 3px solid #333; border-top: 3px solid var(--main-green); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn-back { position: fixed; top: 15px; right: 15px; background: none; border: 1px solid #333; color: white; padding: 5px 15px; border-radius: 10px; font-size: 12px; z-index: 100; }
    </style>
</head>
<body>

    <button class="btn-back" onclick="goHome()">رجوع ↩️</button>

    <div class="header">
        <h2>تحميل الوسائط 📥</h2>
        <p style="font-size: 12px; color: var(--text-gray);">TikTok, Instagram, YouTube, Twitter</p>
    </div>

    <div class="input-box">
        <input type="text" id="video-url" placeholder="ضع رابط الفيديو هنا..">
        
        <div class="options-grid">
            <div class="option-item">
                <label>نوع الملف</label>
                <select id="download-mode">
                    <option value="video">فيديو (Video)</option>
                    <option value="audio">صوت (MP3)</option>
                </select>
            </div>
            <div class="option-item">
                <label>الجودة</label>
                <select id="video-quality">
                    <option value="720">720p</option>
                    <option value="1080">1080p</option>
                    <option value="480">480p</option>
                    <option value="max">Max</option>
                </select>
            </div>
        </div>

        <button class="btn-download" id="fetch-btn" onclick="fetchVideo()">بدء المعالجة ⚡</button>
        <div class="loader" id="loader"></div>
    </div>

    <div id="result-box">
        <p style="font-size: 14px; margin-bottom: 15px; color: var(--main-green);">جاهز للتحميل المباشر!</p>
        <button class="btn-download" style="background: white;" id="final-link">تحميل الملف الآن ⬇️</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('id');

        async function fetchVideo() {
            const urlInput = document.getElementById('video-url').value.trim();
            const mode = document.getElementById('download-mode').value;
            const quality = document.getElementById('video-quality').value;

            if (!urlInput) return tg.showAlert("❌ من فضلك ضع الرابط أولاً!");

            document.getElementById('loader').style.display = 'block';
            document.getElementById('fetch-btn').disabled = true;
            document.getElementById('result-box').style.display = 'none';

            try {
                // استخدام سيرفر مستقر ومعالجة الطلب
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        url: urlInput,
                        vQuality: quality,
                        isAudioOnly: (mode === "audio"),
                        filenamePattern: "basic"
                    })
                });

                const data = await response.json();

                if (data.url || data.picker) {
                    const finalUrl = data.url || data.picker[0].url;
                    document.getElementById('result-box').style.display = 'block';
                    document.getElementById('final-link').onclick = function() {
                        window.open(finalUrl, '_blank');
                    };
                } else {
                    tg.showAlert("❌ السيرفر لم يستطع معالجة هذا الرابط حالياً، جرب رابط آخر.");
                }
            } catch (error) {
                tg.showAlert("⚠️ مشكلة في الاتصال بالسيرفر، تأكد من تحديث الصفحة.");
            } finally {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('fetch-btn').disabled = false;
            }
        }

        function goHome() {
            window.location.href = `index.html?id=${userId}`;
        }
    </script>
</body>
</html>
