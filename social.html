<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaTask - Media Downloader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main-green: #00d26a; --dark-bg: #0d0f12; --card-bg: #1a1d23; --text-gray: #9ca3af; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; text-align: center; }
        
        .header { margin-bottom: 25px; }
        .header h2 { color: var(--main-green); text-shadow: 0 0 10px rgba(0, 210, 106, 0.2); }
        
        .input-box { background: var(--card-bg); padding: 20px; border-radius: 25px; border: 1px solid #2d333d; box-shadow: 0 0 15px rgba(0, 210, 106, 0.05); }
        .input-box input { width: 90%; background: #000; border: 1px solid #333; padding: 15px; color: white; border-radius: 12px; outline: none; margin-bottom: 20px; text-align: center; font-size: 14px; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .option-item { background: #000; border: 1px solid #333; padding: 10px; border-radius: 12px; }
        .option-item label { display: block; font-size: 10px; color: var(--text-gray); margin-bottom: 5px; text-align: right; }
        .option-item select { width: 100%; background: transparent; color: white; border: none; outline: none; font-size: 13px; font-weight: bold; }

        .btn-download { background: var(--main-green); color: black; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-download:active { transform: scale(0.95); box-shadow: 0 0 15px rgba(0, 210, 106, 0.3); }
        .btn-download:disabled { opacity: 0.5; cursor: not-allowed; }

        .loader { display: none; margin: 20px auto; width: 30px; height: 30px; border: 3px solid #333; border-top: 3px solid var(--main-green); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn-back { position: fixed; top: 15px; right: 15px; background: rgba(255,255,255,0.05); border: 1px solid #333; color: white; padding: 5px 15px; border-radius: 10px; font-size: 12px; }
        .footer-note { margin-top: 20px; font-size: 11px; color: var(--text-gray); line-height: 1.5; }
    </style>
</head>
<body>

    <button class="btn-back" onclick="goHome()">رجوع ↩️</button>

    <div class="header">
        <h2>تحميل الوسائط 📥</h2>
        <p style="font-size: 12px; color: var(--text-gray);">يوفر التحميل من جميع المنصات بجودة عالية</p>
    </div>

    <div class="input-box">
        <input type="text" id="video-url" placeholder="انسخ رابط الفيديو أو الصوت هنا..">
        
        <div class="options-grid">
            <div class="option-item">
                <label>نوع الملف (Format)</label>
                <select id="download-mode">
                    <option value="video">فيديو (Video)</option>
                    <option value="audio">صوت (MP3)</option>
                </select>
            </div>
            <div class="option-item">
                <label>الجودة (Quality)</label>
                <select id="video-quality">
                    <option value="720">720p (HD)</option>
                    <option value="1080">1080p (Full HD)</option>
                    <option value="480">480p (SD)</option>
                    <option value="max">أعلى جودة متاحة</option>
                </select>
            </div>
        </div>

        <button class="btn-download" id="fetch-btn" onclick="handleDownload()">استخراج وتحميل ⚡</button>
        <div class="loader" id="loader"></div>
    </div>

    <div class="footer-note">
        * يتم التحميل باستخدام تقنيات yt-dlp المتطورة.<br>
        * سيتم فتح ملف التحميل في متصفح خارجي لضمان السرعة.
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('id');

        async function handleDownload() {
            const url = document.getElementById('video-url').value.trim();
            const mode = document.getElementById('download-mode').value;
            const quality = document.getElementById('video-quality').value;

            if (!url) return tg.showAlert("❌ من فضلك ضع الرابط أولاً!");

            // إظهار اللودر وتعطيل الزرار
            document.getElementById('loader').style.display = 'block';
            document.getElementById('fetch-btn').disabled = true;

            try {
                // محاكاة طلب yt-dlp عبر Cobalt API
                const response = await fetch("https://api.cobalt.tools/api/json", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json", 
                        "Accept": "application/json" 
                    },
                    body: JSON.stringify({
                        url: url,
                        vQuality: quality,
                        isAudioOnly: (mode === "audio"),
                        vCodec: "h264", // كودك عالمي يشتغل على كل الموبايلات
                        filenamePattern: "basic"
                    })
                });

                const data = await response.json();

                if (data.url) {
                    // فتح الرابط المباشر في المتصفح الخارجي (أضمن طريقة)
                    tg.openLink(data.url);
                } else if (data.picker) {
                    // في حالة وجود خيارات متعددة (مثل فيديوهات الإنستا المتعددة)
                    tg.openLink(data.picker[0].url);
                } else {
                    tg.showAlert("⚠️ عذراً، السيرفر لا يدعم هذا الرابط حالياً أو مشغول.");
                }
            } catch (err) {
                console.error(err);
                tg.showAlert("❌ فشل الاتصال بالسيرفر، تأكد من جودة الإنترنت.");
            } finally {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('fetch-btn').disabled = false;
            }
        }

        function goHome() {
            window.location.href = `index.html?id=${userId}`;
        }
    </script>
</body>
</html>
