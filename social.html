<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaTask - Media Downloader Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --main-green: #00d26a;
            --dark-bg: #0d0f12;
            --card-bg: #1a1d23;
            --text-gray: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            padding-top: 60px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 25px;
            border: 1px solid #2d333d;
            box-shadow: 0 0 20px rgba(0, 210, 106, 0.05);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--main-green);
            text-shadow: 0 0 10px rgba(0, 210, 106, 0.2);
        }

        p.subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-gray);
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="url"] {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 1px solid #333;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            color: white;
            transition: border-color 0.2s;
            text-align: center;
        }

        input[type="url"]:focus {
            border-color: var(--main-green);
        }

        button {
            background-color: var(--main-green);
            color: black;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
            font-weight: 500;
            color: var(--main-green);
        }

        .result-card {
            display: none;
            margin-top: 24px;
            border-top: 1px solid #2d333d;
            padding-top: 20px;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .thumbnail {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 12px;
            object-fit: cover;
            max-height: 220px;
            border: 1px solid #333;
        }

        .video-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: right;
            color: #eee;
        }

        .download-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dl-btn {
            display: block;
            text-align: center;
            background-color: var(--main-green);
            color: black;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
            cursor: pointer;
        }

        .dl-btn.audio {
            background-color: white;
            color: black;
        }

        .error-msg {
            color: #ef4444;
            text-align: center;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }

        .btn-back {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            color: white;
            padding: 5px 15px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 100;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button class="btn-back" onclick="goHome()">رجوع ↩️</button>

    <div class="container">
        <h1>تحميل الوسائط 📥</h1>
        <p class="subtitle">قم بتحميل الفيديوهات من تيك توك، ريلز والمنصات الأخرى</p>

        <div class="input-group">
            <input type="url" id="videoUrl" placeholder="أدخل أو الصق رابط الفيديو هنا..." required>
            <button id="downloadBtn">جلب روابط التحميل ⚡</button>
        </div>

        <div class="loader" id="loader">جاري المعالجة... يرجى الانتظار.</div>
        <div class="error-msg" id="errorMsg">حدث خطأ ما! يرجى التحقق من الرابط والمحاولة مرة أخرى.</div>

        <div class="result-card" id="resultCard">
            <img src="" alt="Thumbnail" class="thumbnail" id="resThumbnail">
            <div class="video-title" id="resTitle">عنوان الفيديو</div>
            <div class="download-links" id="resLinks"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('id');

        document.getElementById('downloadBtn').addEventListener('click', async () => {
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('errorMsg');
            const resultCard = document.getElementById('resultCard');
            const resLinks = document.getElementById('resLinks');

            if (!videoUrl) {
                tg.showAlert('❌ الرجاء إدخال رابط صحيح أولاً!');
                return;
            }

            // إعادة تعيين الواجهة
            loader.style.display = 'block';
            errorMsg.style.display = 'none';
            resultCard.style.display = 'none';
            resLinks.innerHTML = '';

            // استخدام API السريع المفتوح
            const apiUrl = `https://api.tikwm.com/api/?url=${encodeURIComponent(videoUrl)}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('API Request Failed');
                
                const json = await response.json();

                if (json.code === 0 && json.data) {
                    const data = json.data;
                    
                    // تحديث الواجهة بالبيانات القادمة
                    document.getElementById('resThumbnail').src = data.cover || 'https://via.placeholder.com/150';
                    document.getElementById('resTitle').innerText = data.title || 'فيديو مستخرج';

                    // 1. زرار تحميل الفيديو بدون علامة مائية
                    if (data.play) {
                        const btnVideo = document.createElement('a');
                        btnVideo.className = 'dl-btn';
                        btnVideo.innerText = "🎥 تحميل الفيديو بدون علامة مائية";
                        btnVideo.onclick = function(e) {
                            e.preventDefault();
                            tg.openLink(data.play);
                        };
                        resLinks.appendChild(btnVideo);
                    }

                    // 2. زرار تحميل الصوت MP3 لو متاح
                    if (data.music) {
                        const btnAudio = document.createElement('a');
                        btnAudio.className = 'dl-btn audio';
                        btnAudio.innerText = "🎵 تحميل الصوت (MP3)";
                        btnAudio.onclick = function(e) {
                            e.preventDefault();
                            tg.openLink(data.music);
                        };
                        resLinks.appendChild(btnAudio);
                    }

                    loader.style.display = 'none';
                    resultCard.style.display = 'block';
                } else {
                    throw new Error('No media found from this link');
                }

            } catch (error) {
                console.error(error);
                loader.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        });

        function goHome() {
            window.location.href = `index.html?id=${userId}`;
        }
    </script>
</body>
</html>
