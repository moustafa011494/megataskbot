<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaTask - Coming Soon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main-green: #00d26a; --dark-bg: #0d0f12; --card-bg: #1a1d23; --text-gray: #9ca3af; }
        body { 
            background-color: var(--dark-bg); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* تأثير النيون للتحميل */
        .loader {
            width: 80px;
            height: 80px;
            border: 4px solid #1a1d23;
            border-top: 4px solid var(--main-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px rgba(0, 210, 106, 0.2);
            margin-bottom: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .content h1 { font-size: 28px; margin: 10px 0; color: var(--main-green); text-shadow: 0 0 10px rgba(0, 210, 106, 0.3); }
        .content p { color: var(--text-gray); font-size: 14px; padding: 0 40px; line-height: 1.6; }

        .btn-back {
            margin-top: 30px;
            background: transparent;
            border: 1px solid var(--main-green);
            color: var(--main-green);
            padding: 12px 30px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-back:active { background: var(--main-green); color: black; }
    </style>
</head>
<body>

    <div class="loader"></div>

    <div class="content">
        <h1>Coming Soon..</h1>
        <p>هذه الخدمة قيد التطوير حالياً ضمن تحديثات MegaTask القادمة. سيتم تفعيلها تلقائياً فور انتهاء البرمجة.</p>
    </div>

    <button class="btn-back" onclick="goHome()">العودة للرئيسية</button>

    <script>
        const tg = window.Telegram.WebApp;
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('id');

        function goHome() {
            window.location.href = `index.html?id=${userId}`;
        }
    </script>
</body>
</html>
