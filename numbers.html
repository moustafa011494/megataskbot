    <style>
        :root {
            --emerald: #00e676;
            --emerald-dark: #00994d;
            --cyan: #00e5ff;
            --amber: #ffb300;
            --crimson: #ff3d57;
            --bg-dark: #070a0f;
            --card-bg: #111621;
            --card-border: #222b3d;
            --text-muted: #8b96ab;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 230, 118, 0.07) 0%, transparent 50%),
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 100% 100%, 26px 26px, 26px 26px;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 14px 14px 115px;
            overflow-x: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .btn-back {
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            color: #fff;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .status-pill {
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.35);
            color: var(--emerald);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--emerald);
            box-shadow: 0 0 8px var(--emerald);
            animation: pulse 1.4s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .numbers-hero {
            background: linear-gradient(145deg, #131926, #0d111a);
            border: 1.5px solid var(--card-border);
            border-radius: 20px;
            padding: 16px 15px;
            margin-bottom: 14px;
            box-shadow: 0 6px 0 #05070b;
            text-align: center;
        }
        .numbers-hero h1 { margin: 0 0 5px; font-size: 18px; color: var(--emerald); }
        .numbers-hero p { margin: 0; font-size: 12px; color: var(--text-muted); line-height: 1.5; }

        .country-filters {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 14px;
            scrollbar-width: none;
        }
        .country-filters::-webkit-scrollbar { display: none; }
        .c-chip {
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            color: var(--text-muted);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }
        .c-chip.active {
            background: var(--emerald);
            color: #000;
            border-color: var(--emerald);
        }

        .toolbar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
        }
        .toolbar-row span { font-size: 12px; color: var(--text-muted); font-weight: bold; }
        .btn-reload-list {
            background: rgba(0, 229, 255, 0.12);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 5px 12px;
            border-radius: 9px;
            font-size: 11.5px;
            font-weight: bold;
            cursor: pointer;
        }

        .numbers-grid {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }
        .number-card {
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: 18px;
            padding: 15px;
            box-shadow: 0 5px 0 #05070b;
            transition: transform 0.15s;
        }
        .num-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .country-name { font-size: 14px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 6px; }
        .online-tag {
            font-size: 10.5px;
            padding: 2px 9px;
            border-radius: 12px;
            font-weight: bold;
            background: rgba(0, 230, 118, 0.12);
            color: var(--emerald);
            border: 1px solid rgba(0, 230, 118, 0.3);
        }

        .phone-display-box {
            background: #06080c;
            border: 1.5px solid #253248;
            border-radius: 12px;
            padding: 11px 12px;
            margin: 8px 0 11px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr;
        }
        .phone-number-txt {
            font-family: 'Courier New', monospace;
            font-size: 16.5px;
            font-weight: 900;
            color: var(--cyan);
            letter-spacing: 0.5px;
            user-select: all;
        }
        .btn-copy-num {
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: bold;
            cursor: pointer;
        }

        .num-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 9px;
            border-top: 1px solid #1b2333;
            font-size: 11px;
            color: var(--text-muted);
        }
        .btn-open-inbox {
            background: var(--emerald);
            color: #000;
            border: none;
            padding: 9px 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--emerald-dark);
        }
        .btn-open-inbox:active { transform: translateY(2px); box-shadow: none; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 12, 0.92);
            backdrop-filter: blur(6px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal-body {
            background: var(--card-bg);
            border: 1.5px solid #2d3850;
            border-radius: 22px;
            padding: 18px;
            width: 100%;
            max-width: 450px;
            max-height: 86vh;
            overflow-y: auto;
            text-align: right;
        }
        .sms-item-box {
            background: #06080c;
            border: 1px solid #222d42;
            border-right: 3px solid var(--cyan);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 12.5px;
            line-height: 1.6;
        }
        .otp-detected-pill {
            margin-top: 8px;
            background: rgba(0, 230, 118, 0.14);
            border: 1px dashed var(--emerald);
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .otp-detected-pill b {
            font-family: monospace;
            font-size: 15px;
            color: var(--emerald);
            letter-spacing: 1.5px;
        }

        .status-box {
            text-align: center;
            padding: 30px 15px;
            background: var(--card-bg);
            border: 1.5px dashed var(--card-border);
            border-radius: 18px;
            color: var(--text-muted);
            font-size: 12.5px;
            line-height: 1.7;
        }

        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(17, 22, 33, 0.98);
            display: flex;
            justify-content: space-around;
            padding: 11px 0;
            border-top: 1px solid var(--card-border);
            z-index: 1000;
        }
        .nav-item { text-align: center; color: var(--text-muted); font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none; }
    </style>
</head>

    <div id="sms-modal" class="modal-overlay">
        <div class="modal-body">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <h4 style="margin: 0; color: var(--emerald); font-size: 15px;" id="modal-num-title">صندوق الرسائل الواردة</h4>
                <button onclick="fetchRealMessagesForNumber(activeNumberObj, true)" style="background: rgba(0,230,118,0.14); border: 1px solid var(--emerald); color: var(--emerald); padding: 5px 11px; border-radius: 8px; font-size: 11.5px; font-weight: bold; cursor: pointer;">🔄 تحديث الرسائل</button>
            </div>
            <div style="font-size: 13.5px; color: var(--cyan); font-family: monospace; direction: ltr; text-align: right; margin-bottom: 12px; font-weight: bold;" id="modal-num-subtitle"></div>

            <div id="modal-sms-list"></div>

            <button onclick="closeInboxModal()" style="width: 100%; margin-top: 14px; background: #222b3d; color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer;">إغلاق النافذة</button>
        </div>

    <nav class="navbar">

        <div onclick="goTasks()" class="nav-item">📋<br>المهام</div>
        <div onclick="goStore()" class="nav-item" style="color: var(--cyan);">🛍️<br>المتجر</div>

        <div onclick="goProfile()" class="nav-item">👤<br>حسابي</div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

        const S_URL = "https://smukfrwnguvmxvfwqwrv.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWtmcnduZ3V2bXh2Zndxd3J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1MDg1NjgsImV4cCI6MjA4NTA4NDU2OH0.NUr7X5V7K-jarVLNm7Ft0dHo6QkIhhGYrkteRRb9wCM";
        const client = supabase.createClient(S_URL, S_KEY);

        const params = new URLSearchParams(window.location.search);
        let tid = (typeof MegaSecurity !== 'undefined' && MegaSecurity.getVerifiedUserId)
            ? MegaSecurity.getVerifiedUserId(params.get('id'))
            : String(tg?.initDataUnsafe?.user?.id || params.get('id') || localStorage.getItem('telegram_id') || "").trim();

        const BASE_PUBLIC_NUMBERS = [
            { code: "UK", country: "🇬🇧 بريطانيا", full: "+44 7488 810942", raw: "447488810942", slug: "united-kingdom" },
            { code: "UK", country: "🇬🇧 بريطانيا", full: "+44 7893 932154", raw: "447893932154", slug: "united-kingdom" },
            { code: "US", country: "🇺🇸 الولايات المتحدة", full: "+1 201 857 7757", raw: "12018577757", slug: "usa" },
            { code: "US", country: "🇺🇸 الولايات المتحدة", full: "+1 315 636 4729", raw: "13156364729", slug: "usa" },
            { code: "SE", country: "🇸🇪 السويد", full: "+46 72 641 28 91", raw: "46726412891", slug: "sweden" },
            { code: "SE", country: "🇸🇪 السويد", full: "+46 73 129 84 05", raw: "46731298405", slug: "sweden" },
            { code: "NL", country: "🇳🇱 هولندا", full: "+31 6 4758 2910", raw: "31647582910", slug: "netherlands" },
            { code: "FR", country: "🇫🇷 فرنسا", full: "+33 6 44 62 81 95", raw: "33644628195", slug: "france" },
            { code: "FI", country: "🇫🇮 فنلندا", full: "+358 45 7398 4120", raw: "3584573984120", slug: "finland" },
            { code: "DE", country: "🇩🇪 ألمانيا", full: "+49 1520 7839104", raw: "4915207839104", slug: "germany" },
            { code: "CA", country: "🇨🇦 كندا", full: "+1 438 800 9241", raw: "14388009241", slug: "canada" },
            { code: "ES", country: "🇪🇸 إسبانيا", full: "+34 631 90 48 21", raw: "34631904821", slug: "spain" }
        ];

        let numbersList = [...BASE_PUBLIC_NUMBERS];
        let selectedCountryFilter = "ALL";
        let activeNumberObj = null;
        let inboxTimer = null;

        function notifyUser(txt) {
            if (tg && tg.showAlert) tg.showAlert(txt);
            else alert(txt);
        }

        function escapeHtml(str) {
            return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function extractOtpCode(text) {
            const clean = String(text || "").replace(/<[^>]*>/g, " ");
            const matches = clean.match(/\b(\d{4,8})\b/g);
            if (!matches) return null;
            for (const m of matches) {
                if (!["2023", "2024", "2025", "2026", "2027"].includes(m)) return m;
            }
            return matches[0];
        }

        async function fetchHtmlThroughGateways(targetUrl) {
            try {
                const ctrl1 = new AbortController();
                const t1 = setTimeout(() => ctrl1.abort(), 5000);
                const r1 = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}&disableCache=true`, { signal: ctrl1.signal });
                clearTimeout(t1);
                if (r1.ok) {
                    const data = await r1.json();
                    if (data && data.contents && data.contents.length > 200 && !data.contents.includes("Attention Required! | Cloudflare")) {
                        return data.contents;
                    }
                }
            } catch (e) {}

            try {
                const ctrl2 = new AbortController();
                const t2 = setTimeout(() => ctrl2.abort(), 5000);
                const r2 = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`, { signal: ctrl2.signal });
                clearTimeout(t2);
                if (r2.ok) {
                    const txt = await r2.text();
                    if (txt && txt.length > 200 && !txt.includes("Just a moment...")) {
                        return txt;
                    }
                }
            } catch (e) {}

            return null;
        }

        async function initPage() {
            renderCountryTabs();
            renderNumbersCards();

            if (tid && typeof MegaSecurity !== 'undefined') {
                MegaSecurity.verifyDeviceAndAccount(client, tid).catch(() => {});
            }

            syncLiveNumbersFromGateways(false);
        }

        async function syncLiveNumbersFromGateways(manualClick) {
            if (manualClick) {
                try { if (typeof show_10959333 === 'function') show_10959333().catch(() => {}); } catch (e) {}
            }

            try {
                const html = await fetchHtmlThroughGateways("https://smstome.com/");
                if (html) {
                    const regex = /href="https:\/\/smstome\.com\/([a-z-]+)\/phone\/(\d{8,15})"/gi;
                    let match;
                    const existingRaws = new Set(numbersList.map(n => n.raw));

                    while ((match = regex.exec(html)) !== null) {
                        const slug = match[1];
                        const raw = match[2];
                        if (!existingRaws.has(raw)) {
                            existingRaws.add(raw);
                            const cInfo = detectCountryByPhone(raw, slug);
                            numbersList.unshift({
                                code: cInfo.code,
                                country: cInfo.label,
                                full: "+" + raw,
                                raw: raw,
                                slug: slug
                            });
                        }
                    }
                    renderCountryTabs();
                    renderNumbersCards();
                }
            } catch (e) {}

            if (manualClick) {
                notifyUser("✅ تم تحديث قائمة الأرقام النشطة!");
            }
        }

        function detectCountryByPhone(raw, slug) {
            if (raw.startsWith("44") || slug.includes("kingdom")) return { code: "UK", label: "🇬🇧 بريطانيا" };
            if (raw.startsWith("1") && slug.includes("canada")) return { code: "CA", label: "🇨🇦 كندا" };
            if (raw.startsWith("1")) return { code: "US", label: "🇺🇸 الولايات المتحدة" };
            if (raw.startsWith("33") || slug.includes("france")) return { code: "FR", label: "🇫🇷 فرنسا" };
            if (raw.startsWith("46") || slug.includes("sweden")) return { code: "SE", label: "🇸🇪 السويد" };
            if (raw.startsWith("31") || slug.includes("netherlands")) return { code: "NL", label: "🇳🇱 هولندا" };
            if (raw.startsWith("358") || slug.includes("finland")) return { code: "FI", label: "🇫🇮 فنلندا" };
            if (raw.startsWith("49") || slug.includes("germany")) return { code: "DE", label: "🇩🇪 ألمانيا" };
            if (raw.startsWith("34") || slug.includes("spain")) return { code: "ES", label: "🇪🇸 إسبانيا" };
            return { code: "EU", label: "🇪🇺 دولي" };
        }

        function renderCountryTabs() {
            const tabsEl = document.getElementById('country-tabs');
            const map = {};
            numbersList.forEach(n => { map[n.code] = n.country; });

            let html = `<div class="c-chip ${selectedCountryFilter === 'ALL' ? 'active' : ''}" onclick="filterByCountry('ALL')">🌐 كل الدول (${numbersList.length})</div>`;
            for (const [code, label] of Object.entries(map)) {
                html += `<div class="c-chip ${selectedCountryFilter === code ? 'active' : ''}" onclick="filterByCountry('${code}')">${label}</div>`;
            }
            tabsEl.innerHTML = html;
        }

        function filterByCountry(code) {
            selectedCountryFilter = code;
            renderCountryTabs();
            renderNumbersCards();
        }

        function renderNumbersCards() {
            const container = document.getElementById('free-numbers-list');
            const filtered = selectedCountryFilter === "ALL"
                ? numbersList
                : numbersList.filter(n => n.code === selectedCountryFilter);

            document.getElementById('numbers-count-lbl').innerText = `🌐 الأرقام النشطة المتاحة: ${filtered.length} رقم`;

            container.innerHTML = filtered.map((n, idx) => `
                <div class="number-card">
                    <div class="num-top-row">
                        <span class="country-name">${escapeHtml(n.country)}</span>
                        <span class="online-tag">🟢 متصل ويستقبل SMS</span>
                    </div>
                    <div class="phone-display-box">
                        <span class="phone-number-txt">${escapeHtml(n.full)}</span>
                        <button class="btn-copy-num" onclick="copyPhoneNumber('${escapeHtml(n.full)}')">نسخ الرقم 📋</button>
                    </div>
                    <div class="num-footer-row">
                        <span>⚡ تحديث الرسائل: تلقائي كل 6 ثوانٍ</span>
                        <button class="btn-open-inbox" onclick="openNumberInbox(${idx})">📥 قراءة الرسائل</button>
                    </div>
                </div>
            `).join("");
        }

        function copyPhoneNumber(phoneStr) {
            navigator.clipboard.writeText(phoneStr).then(() => {
                notifyUser(`✅ تم نسخ الرقم:\n${phoneStr}\n\nضع الرقم في الموقع المطلوب ثم اضغط (📥 قراءة الرسائل) لمتابعة وصول الكود!`);
            });
        }

        function copyCodeText(code) {
            navigator.clipboard.writeText(code).then(() => {
                notifyUser(`🔑 تم نسخ كود التفعيل (${code}) بنجاح!`);
            });
        }

        async function openNumberInbox(filteredIdx) {
            const filtered = selectedCountryFilter === "ALL"
                ? numbersList
                : numbersList.filter(n => n.code === selectedCountryFilter);

            const numObj = filtered[filteredIdx];
            if (!numObj) return;

            activeNumberObj = numObj;
            document.getElementById('modal-num-title').innerText = `📥 رسائل الرقم (${numObj.country})`;
            document.getElementById('modal-num-subtitle').innerText = numObj.full;
            document.getElementById('sms-modal').style.display = 'flex';

            await fetchRealMessagesForNumber(numObj, false);

            if (inboxTimer) clearInterval(inboxTimer);
            inboxTimer = setInterval(() => fetchRealMessagesForNumber(activeNumberObj, false), 6500);
        }

        async function fetchRealMessagesForNumber(numObj, isManualRefresh) {
            if (!numObj) return;
            const listEl = document.getElementById('modal-sms-list');

            if (isManualRefresh) {
                listEl.innerHTML = `<div class="status-box">⏳ جاري فحص الشبكة وسحب أحدث رسائل الـ SMS الواردة...</div>`;
                try { if (typeof show_10959333 === 'function') show_10959333().catch(() => {}); } catch (e) {}
            } else if (listEl.innerHTML.trim() === "") {
                listEl.innerHTML = `<div class="status-box">⏳ جاري جلب الرسائل الواردة...</div>`;
            }

            let parsedMessages = [];

            try {
                const url1 = `https://smstome.com/${numObj.slug || 'united-kingdom'}/phone/${numObj.raw}`;
                const html1 = await fetchHtmlThroughGateways(url1);
                if (html1) {
                    const rowRegex = /<tr[^>]*>[\s\S]*?<td[^>]*>([\s\S]*?)<\/td>[\s\S]*?<td[^>]*>([\s\S]*?)<\/td>[\s\S]*?<td[^>]*>([\s\S]*?)<\/td>[\s\S]*?<\/tr>/gi;
                    let m;
                    while ((m = rowRegex.exec(html1)) !== null && parsedMessages.length < 15) {
                        const sender = m[1].replace(/<[^>]*>/g, "").trim();
                        const time = m[2].replace(/<[^>]*>/g, "").trim();
                        const body = m[3].replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
                        if (body.length > 4) {
                            parsedMessages.push({ sender: sender || "Service", time: time || "حديثاً", text: body });
                        }
                    }
                }
            } catch (e) {}

            if (parsedMessages.length === 0) {
                try {
                    const url2 = `https://receive-smss.com/sms/${numObj.raw}/`;
                    const html2 = await fetchHtmlThroughGateways(url2);
                    if (html2) {
                        const msgBlocks = [...html2.matchAll(/<div class="col-md-6 msgg"[^>]*>([\s\S]*?)<\/div>/gi)];
                        msgBlocks.slice(0, 12).forEach(b => {
                            const txt = b[1].replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
                            if (txt.length > 5) {
                                parsedMessages.push({ sender: "SMS-Gateway", time: "منذ لحظات", text: txt });
                            }
                        });
                    }
                } catch (e) {}
            }

            // تم إزالة الأكواد الوهمية (Fake OTP) بالكامل لتأمين صدق البوت مع الأعضاء
            if (parsedMessages.length === 0) {
                listEl.innerHTML = `<div class="status-box">⏳ لا توجد رسائل جديدة وصلت لهذا الرقم في آخر دقيقة.<br><span style="color:var(--gold);">أرسل الكود من الموقع المطلوب ثم اضغط (تحديث الرسائل) بالأعلى.</span></div>`;
                return;
            }

            listEl.innerHTML = parsedMessages.map(msg => {
                const otp = extractOtpCode(msg.text);
                return `
                    <div class="sms-item-box">
                        <div style="display:flex; justify-content:space-between; color:var(--cyan); font-size:11.5px; margin-bottom:4px;">
                            <b>📨 من: ${escapeHtml(msg.sender)}</b>
                            <span style="color:var(--text-muted);">🕒 ${escapeHtml(msg.time)}</span>
                        </div>
                        <div style="direction:ltr; text-align:left; font-family:monospace; color:#e2e8f0;">${escapeHtml(msg.text)}</div>
                        ${otp ? `
                            <div class="otp-detected-pill" onclick="copyCodeText('${otp}')">
                                <span>🔑 الكود المستخرج: <b>${otp}</b></span>
                                <span style="background:var(--emerald); color:#000; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:bold;">نسخ الكود 📋</span>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join("");
        }

        function closeInboxModal() {
            document.getElementById('sms-modal').style.display = 'none';
            if (inboxTimer) clearInterval(inboxTimer);
        }

        function goHome() { window.location.href = `index.html?id=${tid}&t=${Date.now()}`; }
        function goTasks() { window.location.href = `tasks.html?id=${tid}&t=${Date.now()}`; }
        function goStore() { window.location.href = `store.html?id=${tid}&t=${Date.now()}`; }
        function goInvite() { window.location.href = `invite.html?id=${tid}&t=${Date.now()}`; }
        function goProfile() { window.location.href = `profile.html?id=${tid}&t=${Date.now()}`; }

        initPage();
    </script>
</body>
</html>
