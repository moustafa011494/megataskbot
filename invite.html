<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Invite & Earn - MegaTask</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --main-green: #00d26a; --dark-bg: #0d0f12; --card-bg: #1a1d23; --text-gray: #9ca3af; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; padding-bottom: 100px; }
        
        /* القسم العلوي - إجمالي العائد بالأخضر */
        .total-earnings { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid #2d333d; text-align: center; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0, 210, 106, 0.05); }
        .total-earnings h3 { margin: 0; font-size: 14px; color: var(--text-gray); }
        .total-earnings .amount { font-size: 32px; font-weight: bold; color: var(--main-green); margin: 10px 0; text-shadow: 0 0 10px rgba(0, 210, 106, 0.2); }
        
        /* قسم تسجيل الكود أو الرابط */
        #register-section { background: rgba(0, 210, 106, 0.05); border: 1px dashed var(--main-green); padding: 15px; border-radius: 15px; margin-bottom: 15px; display: none; text-align: center; }
        .input-ref { width: 90%; background: #000; border: 1px solid #333; padding: 12px; color: var(--main-green); border-radius: 10px; text-align: center; margin-bottom: 10px; outline: none; font-size: 13px; font-weight: bold; }

        /* صندوق الدعوة */
        .invite-card { background: var(--card-bg); border-radius: 20px; padding: 15px; border: 1px solid #2d333d; margin-bottom: 15px; }
        .link-box { background: #000; border-radius: 10px; padding: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #333; margin-top: 10px; }
        .link-box span { font-size: 11px; color: var(--text-gray); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }
        .btn-green { background: var(--main-green); color: black; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-green:active { transform: scale(0.95); }

        /* زر جمع أرباح المهام */
        .btn-claim {
            background: var(--main-green);
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 210, 106, 0.2);
        }
        .btn-claim:active { transform: scale(0.95); }
        .btn-claim.claimed {
            background: #252932;
            color: var(--text-gray);
            cursor: not-allowed;
            border: 1px solid #333842;
            box-shadow: none;
        }

        /* شبكة الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-box { background: var(--card-bg); padding: 12px; border-radius: 15px; text-align: center; border: 1px solid #2d333d; }
        .stat-box b { display: block; font-size: 18px; color: var(--main-green); }
        .stat-box span { font-size: 10px; color: var(--text-gray); }

        /* التبويبات */
        .tabs { display: flex; background: #000; border-radius: 12px; padding: 5px; margin-bottom: 15px; border: 1px solid #222; }
        .tab { flex: 1; text-align: center; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 13px; color: var(--text-gray); }
        .tab.active { background: var(--main-green); color: black; font-weight: bold; }

        /* الجداول */
        .list-container { display: none; }
        .list-container.active { display: block; }
        .item-row { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 12px 15px; border-radius: 15px; margin-bottom: 8px; border: 1px solid #2d333d; }
        .rank-circle { width: 30px; height: 30px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; border: 1px solid var(--main-green); color: var(--main-green); }
        .user-info { flex: 1; text-align: right; padding-right: 15px; }
        .user-info b { font-size: 14px; }
        .user-info small { color: var(--text-gray); display: block; font-size: 10px; }

        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(26, 29, 35, 0.95); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #2d333d; z-index: 1000; }
        .nav-item { text-align: center; color: var(--text-gray); font-size: 11px; cursor: pointer; }
        .nav-item.active { color: var(--main-green); }
    </style>
</head>
<body>

    <div class="total-earnings">
        <h3>إجمالي العائد من المهام 💎</h3>
        <div class="amount" id="total-comm">0</div>
        <small style="color: var(--text-gray);">10% عمولة من مهام الأصدقاء فقط</small>
    </div>

    <div id="register-section">
        <input type="text" id="input-promo" class="input-ref" placeholder="الصق كود الدعوة أو رابط الصديق هنا">
        <button class="btn-green" style="width: 90%;" onclick="submitInvite()">تفعيل الكود ✅</button>
    </div>

    <div class="stats-grid">
        <div class="stat-box"><b id="my-rank">#--</b><span>تصنيفي</span></div>
        <div class="stat-box"><b id="total-ref">0</b><span>المدعوين</span></div>
        <div class="stat-box"><b id="valid-ref">0</b><span>صالحين</span></div>
    </div>

    <div class="invite-card">
        <span style="font-size: 12px; color: var(--text-gray);">رابط الدعوة الخاص بك</span>
        <div class="link-box">
            <span id="ref-url">https://t.me/MegaTask1Bot?start=...</span>
            <button class="btn-green" style="padding: 5px 12px; font-size: 12px;" onclick="copyLink()">نسخ</button>
        </div>
        <button class="btn-green" style="width: 100%; margin-top: 10px; background: none; border: 1px solid var(--main-green); color: var(--main-green);" onclick="shareLink()">مشاركة الرابط 📤</button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('history', this)">دعواتي 👥</div>
        <div class="tab" onclick="switchTab('leaderboard', this)">المتصدرين 🏆</div>
    </div>

    <div id="history" class="list-container active"></div>
    <div id="leaderboard" class="list-container"></div>

    <nav class="navbar">
        <div onclick="goHome()" class="nav-item">🏠<br>الرئيسية</div>
        <div onclick="goTasks()" class="nav-item">📋<br>اكسب</div>
        <div onclick="goInvite()" class="nav-item active">👥<br>أصدقاء</div>
        <div onclick="goProfile()" class="nav-item">👤<br>أنا</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const S_URL = "https://smukfrwnguvmxvfwqwrv.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWtmcnduZ3V2bXh2Zndxd3J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1MDg1NjgsImV4cCI6MjA4NTA4NDU2OH0.NUr7X5V7K-jarVLNm7Ft0dHo6QkIhhGYrkteRRb9wCM";
        const BOT_TOKEN = "8487785406:AAHLd5lakTZH1xv1Kbc5-BktFNEHNV8AYck";
        const client = supabase.createClient(S_URL, S_KEY);

        const params = new URLSearchParams(window.location.search);
        const tid = String(params.get('id') || tg.initDataUnsafe.user?.id || "").trim();
        const botUser = "MegaTask1Bot";
        let myData = null;

        // دالة إرسال إشعار مباشر في شات تيليجرام
        async function sendTelegramMessage(chatId, text) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: text,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (err) {
                console.error("Telegram notify error:", err);
            }
        }

        // دالة استخراج الآيدي الذكي من الروابط أو الأكواد المباشرة
        function extractRefCode(raw) {
            if (!raw) return "";
            raw = String(raw).trim();
            // لو تم لصق رابط يحتوي على start= أو id=
            const matchParam = raw.match(/(?:start|id)=([a-zA-Z0-9_-]+)/i);
            if (matchParam && matchParam[1]) return matchParam[1].trim();
            // استخراج الأرقام الطويلة (Telegram ID)
            const matchDigits = raw.match(/\d{5,16}/);
            if (matchDigits) return matchDigits[0];
            return raw.replace(/[^\w-]/g, "");
        }

        async function init() {
            const url = `https://t.me/${botUser}?start=${tid}`;
            document.getElementById('ref-url').innerText = url;

            let { data: user } = await client.from('users').select('*').eq('telegram_id', tid).maybeSingle();
            if (user) {
                myData = user;
                document.getElementById('total-comm').innerText = (user.total_ref_commission || 0).toLocaleString();
                document.getElementById('valid-ref').innerText = user.invited_count || 0;
                if (!user.referred_by) document.getElementById('register-section').style.display = 'block';
                loadMyInvites();
                loadLeaderboard();
                calculateRank();
            }
        }

        async function loadMyInvites() {
            const { data, error } = await client
                .from('users')
                .select('*')
                .eq('referred_by', tid);

            const container = document.getElementById('history');
            let totalCommissionSum = 0;

            if (error) return console.error(error);

            container.innerHTML = (data && data.length) ? '' : '<p style="text-align:center; font-size:12px; color:gray; margin-top:20px;">لا يوجد مدعوين حتى الآن</p>';

            const claimedMap = JSON.parse(localStorage.getItem(`claimed_refs_${tid}`) || "{}");

            data?.forEach(u => {
                const taskEarnings = Number(u.task_earnings || 0);
                const commissionFromThisFriend = Math.floor(taskEarnings * 0.1); 
                totalCommissionSum += commissionFromThisFriend;

                const friendId = String(u.telegram_id || u.name);
                const alreadyClaimed = claimedMap[friendId] || 0;
                const claimable = Math.max(0, commissionFromThisFriend - alreadyClaimed);

                let actionButtonHtml = '';
                if (commissionFromThisFriend === 0) {
                    actionButtonHtml = `<button class="btn-claim" style="opacity: 0.7; background: #2d333d; color: #aaa;" onclick="alertNoPoints('${u.name}')">جمع (0)</button>`;
                } else if (claimable > 0) {
                    actionButtonHtml = `<button class="btn-claim" onclick="claimFromFriend('${friendId}', '${u.name}', ${claimable}, this)">📥 جمع +${claimable}</button>`;
                } else {
                    actionButtonHtml = `<button class="btn-claim claimed" disabled>تم الجمع ✅</button>`;
                }

                container.innerHTML += `
                    <div class="item-row" style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="color: var(--main-green); font-weight: bold; font-size: 15px;">+${commissionFromThisFriend.toLocaleString()}</span>
                            ${actionButtonHtml}
                        </div>
                        
                        <div class="user-info" style="text-align: right; flex: 1;">
                            <b style="color: white; font-size: 14px;">${u.name}</b>
                            <small style="color: var(--text-gray);">أرباح مهامه: ${taskEarnings.toLocaleString()} (عمولتك 10%) 💎</small>
                        </div>
                    </div>`;
            });

            document.getElementById('total-comm').innerText = totalCommissionSum.toLocaleString();
            document.getElementById('total-ref').innerText = data?.length || 0;
        }

        function alertNoPoints(friendName) {
            tg.showAlert(`ℹ️ صديقك (${friendName}) لم ينجز أي مهام بعد.\nعمولتك 10% تُحتسب فقط من النقاط التي يكتسبها من تنفيذ المهام.`);
        }

        async function claimFromFriend(friendId, friendName, amount, btn) {
            if (!myData || amount <= 0) return;

            btn.disabled = true;
            btn.innerText = "⏳...";

            const newPoints = (myData.points || 0) + amount;
            const newTotalEarned = (myData.total_earned || 0) + amount;
            const newTotalComm = (myData.total_ref_commission || 0) + amount;

            const { data, error } = await client.from('users').update({
                points: newPoints,
                total_earned: newTotalEarned,
                total_ref_commission: newTotalComm
            }).eq('telegram_id', tid).select().single();

            if (!error && data) {
                myData = data;

                let claimedMap = JSON.parse(localStorage.getItem(`claimed_refs_${tid}`) || "{}");
                claimedMap[friendId] = (claimedMap[friendId] || 0) + amount;
                localStorage.setItem(`claimed_refs_${tid}`, JSON.stringify(claimedMap));

                btn.className = "btn-claim claimed";
                btn.innerText = "تم الجمع ✅";

                tg.showAlert(`🎉 مبروك! تم جمع +${amount} نقطة من مهام صديقك (${friendName}) وإضافتها لرصيدك الرئيسي!`);
            } else {
                btn.disabled = false;
                btn.innerText = `📥 جمع +${amount}`;
                tg.showAlert("❌ حدث خطأ أثناء إضافة النقاط، يرجى المحاولة مرة أخرى.");
            }
        }

        async function loadLeaderboard() {
            const { data } = await client.from('users').select('name, invited_count').order('invited_count', { ascending: false }).limit(10);
            const container = document.getElementById('leaderboard');
            container.innerHTML = '';
            data?.forEach((u, i) => {
                container.innerHTML += `
                    <div class="item-row">
                        <div class="rank-circle">${i+1}</div>
                        <div class="user-info">
                            <b>${u.name}</b>
                            <small>دعا ${u.invited_count || 0} صديق</small>
                        </div>
                    </div>`;
            });
        }

        async function calculateRank() {
            const { count } = await client.from('users').select('*', { count: 'exact', head: true }).gt('invited_count', myData.invited_count || 0);
            document.getElementById('my-rank').innerText = `#${(count || 0) + 1}`;
        }

        function switchTab(id, el) {
            document.querySelectorAll('.list-container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        // تفعيل الكود مع استخراج الآيدي الذكي وإرسال الإشعارات للطرفين
        async function submitInvite() {
            const rawValue = document.getElementById('input-promo').value.trim();
            const refCode = extractRefCode(rawValue);

            if (!refCode || refCode === tid) return tg.showAlert("❌ كود أو رابط غير صالح!");

            let { data: inviter } = await client.from('users').select('*').eq('telegram_id', refCode).maybeSingle();
            if (!inviter) return tg.showAlert("❌ هذا الكود / المستخدم غير مسجل بالنظام!");

            const newPointsForMe = (myData.points || 0) + 100;
            const newTotalForMe = (myData.total_earned || 0) + 100;

            const { error } = await client.from('users').update({ 
                referred_by: refCode, 
                points: newPointsForMe,
                total_earned: newTotalForMe
            }).eq('telegram_id', tid);

            if (!error) {
                // تحديث بيانات صاحب الدعوة
                const inviterPoints = (inviter.points || 0) + 200;
                const inviterTotal = (inviter.total_earned || 0) + 200;
                const inviterCount = (inviter.invited_count || 0) + 1;
                const inviterComm = (inviter.total_ref_commission || 0) + 200;

                await client.from('users').update({ 
                    points: inviterPoints, 
                    total_earned: inviterTotal,
                    invited_count: inviterCount, 
                    total_ref_commission: inviterComm 
                }).eq('telegram_id', refCode);

                const myName = myData.name || "مستخدم جديد";
                const inviterName = inviter.name || "صديقك";

                // 1. إرسال إشعار لصاحب الدعوة في شات البوت
                const msgForInviter = 
                    `🎉 *مستخدم جديد انضم من خلالك!*\n` +
                    `━━━━━━━━━━━━━━━\n` +
                    `👤 *الصديق:* ${myName}\n` +
                    `🎁 *المكافأة:* +200 نقطة تمت إضافتها لرصيدك الآن!\n` +
                    `💎 *العمولة:* ستحصل تلقائياً على 10% من جميع أرباح مهامه مستقبلاً.`;
                sendTelegramMessage(refCode, msgForInviter);

                // 2. إرسال إشعار للمستخدم الجديد في شات البوت
                const msgForNewUser = 
                    `🎉 *تم تفعيل كود الدعوة بنجاح!*\n` +
                    `━━━━━━━━━━━━━━━\n` +
                    `👤 *تمت دعوتك بواسطة:* ${inviterName}\n` +
                    `🎁 *هدية التسجيل:* مبروك! حصلت على +100 نقطة في رصيدك الرئيسي.`;
                sendTelegramMessage(tid, msgForNewUser);

                tg.showAlert("✅ تم تفعيل الدعوة بنجاح وحصلت على +100 نقطة!");
                location.reload();
            } else {
                tg.showAlert("❌ حدث خطأ أثناء تفعيل الكود، يرجى المحاولة لاحقاً.");
            }
        }

        function copyLink() { navigator.clipboard.writeText(document.getElementById('ref-url').innerText); tg.showAlert("✅ تم نسخ الرابط!"); }
        function shareLink() {
            const url = document.getElementById('ref-url').innerText;
            window.open(`https://t.me/share/url?url=${url}&text=${encodeURIComponent("سجل في MegaTask واكسب نقاط حقيقية! 🚀")}`);
        }

        function goHome() { window.location.href = `index.html?id=${tid}&t=${Date.now()}`; }
        function goTasks() { window.location.href = `tasks.html?id=${tid}&t=${Date.now()}`; }
        function goProfile() { window.location.href = `profile.html?id=${tid}&t=${Date.now()}`; }
        function goInvite() { window.location.href = `invite.html?id=${tid}&t=${Date.now()}`; }

        init();
    </script>
</body>
</html>
