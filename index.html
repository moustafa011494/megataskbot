<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MegaTask - الرئيسية</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --main-green: #00d26a;
            --dark-bg: #0b0d10;
            --card-bg: #16191f;
            --card-border: #232730;
            --text-gray: #8e95a5;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 95px;
            user-select: none;
            -webkit-user-select: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .welcome-text { font-size: 11px; color: var(--text-gray); letter-spacing: 1px; font-weight: bold; }
        .level-badge {
            background: #1c2027;
            border: 1px solid var(--card-border);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #ccc;
            font-weight: bold;
        }

        .balance-section {
            text-align: center;
            margin: 15px 0 20px;
        }
        .balance-title { font-size: 12px; color: var(--text-gray); letter-spacing: 1px; margin-bottom: 4px; }
        .balance-amount {
            font-size: 42px;
            font-weight: 800;
            color: white;
            margin: 0 0 10px;
            letter-spacing: -0.5px;
        }
        .btn-withdraw {
            background: var(--main-green);
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }
        .btn-withdraw:active { transform: scale(0.96); }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px 6px;
            text-align: center;
        }
        .stat-val { font-size: 16px; font-weight: bold; color: var(--main-green); margin-bottom: 3px; }
        .stat-lbl { font-size: 11px; color: var(--text-gray); }

        .cpa-banner {
            border: 1px dashed #ff3b5c;
            background: rgba(255, 59, 92, 0.05);
            border-radius: 14px;
            padding: 13px;
            text-align: center;
            font-size: 12px;
            color: #ff3b5c;
            font-weight: bold;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            margin-bottom: 14px;
            border-right: 3px solid var(--main-green);
            padding-right: 8px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .service-card:active {
            transform: scale(0.97);
            border-color: var(--main-green);
        }
        .service-icon { font-size: 26px; }
        .service-name { font-size: 13px; font-weight: bold; color: #eee; }

        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(22, 25, 31, 0.96);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid var(--card-border);
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: var(--text-gray);
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .nav-item.active { color: var(--main-green); }
        .nav-item span { display: block; font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span class="welcome-text">WELCOME BACK</span>
        <span class="level-badge" id="user-level">LEVEL 1</span>
    </div>

    <div class="balance-section">
        <div class="balance-title">BALANCE</div>
        <div class="balance-amount" id="user-points">0</div>
        <button class="btn-withdraw" onclick="handleWithdraw()">Withdraw ↗</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-val" id="stat-tasks">0</div>
            <div class="stat-lbl">Tasks</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="stat-streak">1d</div>
            <div class="stat-lbl">Streak</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="stat-balance-short">0</div>
            <div class="stat-lbl">Balance</div>
        </div>
    </div>

    <div class="cpa-banner" onclick="tg.showAlert('🎯 عروض CPA قادمة قريباً بمكافآت ضخمة!')">
        🎯 عروض CPA (قريباً..)
    </div>

    <div class="section-header">
        الخدمات الذكية 🛠️
    </div>

    <div class="services-grid">
        <div class="service-card" onclick="goMediaDownloader()">
            <div class="service-icon">📥</div>
            <div class="service-name">تحميل الوسائط</div>
        </div>

        <div class="service-card" onclick="goMethods()">
            <div class="service-icon">🔒</div>
            <div class="service-name">قسم الميتودات</div>
        </div>

        <div class="service-card" onclick="goDevTools()">
            <div class="service-icon">👨‍💻</div>
            <div class="service-name">أدوات المطور</div>
        </div>

        <div class="service-card" onclick="goTempMail()">
            <div class="service-icon">📧</div>
            <div class="service-name">بريد مؤقت</div>
        </div>

        <div class="service-card" onclick="goNumbers()">
            <div class="service-icon">📱</div>
            <div class="service-name">أرقام وهمية</div>
        </div>

        <div class="service-card" onclick="tg.showAlert('🚀 ميزة جديدة قيد التطوير وستنزل في التحديث القادم!')">
            <div class="service-icon">🎯</div>
            <div class="service-name">قريباً..</div>
        </div>
    </div>

    <nav class="navbar">
        <div onclick="goHome()" class="nav-item active">
            <span>🏠</span>الرئيسية
        </div>
        <div onclick="goTasks()" class="nav-item">
            <span>📋</span>اكسب
        </div>
        <div onclick="goInvite()" class="nav-item">
            <span>👥</span>أصدقاء
        </div>
        <div onclick="goProfile()" class="nav-item">
            <span>👤</span>أنا
        </div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const S_URL = "https://smukfrwnguvmxvfwqwrv.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWtmcnduZ3V2bXh2Zndxd3J2In0.NUr7X5V7K-jarVLNm7Ft0dHo6QkIhhGYrkteRRb9wCM";
        const client = supabase.createClient(S_URL, S_KEY);

        const params = new URLSearchParams(window.location.search);
        let tid = String(params.get('id') || tg.initDataUnsafe?.user?.id || "").trim();
        
        if (!tid || tid === "undefined" || tid === "null") {
            tid = localStorage.getItem('mega_task_tid') || "123456789";
        } else {
            localStorage.setItem('mega_task_tid', tid);
        }

        let userData = null;

        async function init() {
            try {
                // محاولة البحث بالـ ID سواء نص أو رقم لتجنب خطأ نوع البيانات في Supabase
                let user = null;
                let { data: u1 } = await client.from('users').select('*').eq('telegram_id', tid).maybeSingle();
                if (u1) {
                    user = u1;
                } else {
                    let { data: u2 } = await client.from('users').select('*').eq('telegram_id', parseInt(tid) || 0).maybeSingle();
                    if (u2) user = u2;
                }

                if (!user) {
                    // لو مش موجود، أنشئه فوراً برصيد 0
                    const { data: newUser } = await client
                        .from('users')
                        .insert([{ telegram_id: isNaN(tid) ? tid : parseInt(tid), points: 0, streak: 1, total_tasks: 0 }])
                        .select()
                        .single();
                    if (newUser) user = newUser;
                }

                if (user) {
                    userData = user;
                    updateUI();
                }
            } catch (err) {
                console.error("Error loading user:", err);
            }
        }

        function formatNumberShort(num) {
            if (!num) return "0";
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return num.toLocaleString();
        }

        function updateUI() {
            if (!userData) return;
            const pts = userData.points || 0;
            document.getElementById('user-points').innerText = pts.toLocaleString();
            document.getElementById('stat-balance-short').innerText = formatNumberShort(pts);
            document.getElementById('stat-tasks').innerText = (userData.total_tasks || 0).toString();
            document.getElementById('stat-streak').innerText = (userData.streak || 1) + 'd';
        }

        function handleWithdraw() {
            tg.showAlert("💳 قسم السحب متاح! انتقل إلى صفحة (أنا) لتقديم طلب سحب أرباحك.");
        }

        function goHome() { window.location.href = `index.html?id=${tid}&t=${Date.now()}`; }
        function goTasks() { window.location.href = `tasks.html?id=${tid}&t=${Date.now()}`; }
        function goInvite() { window.location.href = `invite.html?id=${tid}&t=${Date.now()}`; }
        function goProfile() { window.location.href = `profile.html?id=${tid}&t=${Date.now()}`; }

        function goTempMail() { window.location.href = `tempmail.html?id=${tid}&t=${Date.now()}`; }
        function goNumbers() { tg.showAlert("📱 قسم الأرقام الوهمية قيد التجهيز وسيتم تفعيله قريباً!"); }
        function goMediaDownloader() { tg.showAlert("📥 أرسل أي رابط فيديو للبوت في الشات ليقوم بتحميله لك فوراً وبأعلى جودة!"); }
        function goMethods() { tg.showAlert("🔒 قسم الميتودات والثغرات الحصرية متاح قريباً للأعضاء النشطين!"); }
        function goDevTools() { tg.showAlert("👨‍💻 أدوات المطورين قيد الإضافة قريباً!"); }

        init();
    </script>
</body>
</html>
