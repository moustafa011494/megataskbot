<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - MegaTask</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --main-green: #00d26a; --dark-bg: #0d0f12; --card-bg: #1a1d23; --text-gray: #9ca3af; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; padding-bottom: 100px; }
        .balance-card { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid #2d333d; text-align: center; margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .balance-card h2 { color: var(--main-green); font-size: 32px; margin: 10px 0; }
        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-gray); }
        select, input { width: 100%; background: #000; border: 1px solid #2d333d; padding: 15px; border-radius: 12px; color: white; box-sizing: border-box; outline: none; transition: 0.3s; }
        select:focus, input:focus { border-color: var(--main-green); }
        .withdraw-btn { background: var(--main-green); color: black; border: none; width: 100%; padding: 18px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 5px 15px rgba(0, 210, 106, 0.3); }
        .withdraw-btn:disabled { background: #333; color: #666; box-shadow: none; }
        .info-box { background: rgba(0, 210, 106, 0.1); border: 1px dashed var(--main-green); padding: 10px; border-radius: 10px; font-size: 12px; margin-bottom: 20px; color: #00d26a; text-align: center; }
        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(26, 29, 35, 0.95); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #2d333d; z-index: 1000; }
        .nav-item { text-align: center; color: var(--text-gray); font-size: 11px; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

    <h2 style="text-align: right;">💰 سحب الأرباح</h2>

    <div class="balance-card">
        <span>رصيدك الحالي</span>
        <h2 id="current-points">جاري التحميل...</h2>
        <div class="info-box">سحب سريع وآمن لأرباحك 💳</div>
        <small style="color: var(--text-gray);">الحد الأدنى للسحب: 1,000 نقطة</small>
    </div>

    <div class="input-group">
        <label>وسيلة السحب</label>
        <select id="method">
            <option value="Vodafone Cash">فودافون كاش (مصر) 🇪🇬</option>
            <option value="Etisalat Cash">اتصالات كاش (مصر) 🟢</option>
            <option value="Orange Cash">اورانج كاش (مصر) 🟠</option>
            <option value="InstaPay">InstaPay (Egypt) 🏦</option>
            <option value="Binance Pay">Binance Pay (USDT) 🌐</option>
        </select>
    </div>

    <div class="input-group">
        <label>المبلغ المطلوب سحبه (بالنقاط أو بالجنيه)</label>
        <input type="number" id="amountInput" placeholder="مثلاً: 1000 أو 10" oninput="convertCurrency()">
        <small id="conversion-hint" style="color: var(--main-green); display: block; margin-top: 5px; font-size: 11px;"></small>
    </div>

    <div class="input-group">
        <label>بيانات الاستلام (رقم الهاتف أو الـ ID)</label>
        <input type="text" id="wallet" placeholder="010xxxxxxx / ID">
    </div>

    <button class="withdraw-btn" id="withdrawBtn" onclick="processWithdraw()">تأكيد طلب السحب ↗</button>

    <nav class="navbar">
        <div onclick="goHome()" class="nav-item">🏠<br>الرئيسية</div>
        <div onclick="goTasks()" class="nav-item">📋<br>اكسب</div>
        <div onclick="goInvite()" class="nav-item">👥<br>أصدقاء</div>
        <div onclick="goProfile()" class="nav-item">👤<br>أنا</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const S_URL = "https://smukfrwnguvmxvfwqwrv.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWtmcnduZ3V2bXh2Zndxd3J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1MDg1NjgsImV4cCI6MjA4NTA4NDU2OH0.NUr7X5V7K-jarVLNm7Ft0dHo6QkIhhGYrkteRRb9wCM";
        const client = supabase.createClient(S_URL, S_KEY);

        const params = new URLSearchParams(window.location.search);
        let tid = String(params.get('id') || tg.initDataUnsafe.user?.id || "").trim();
        
        if (!tid || tid === "undefined" || tid === "null") {
            tid = localStorage.getItem('mega_task_tid') || "123456789";
        } else {
            localStorage.setItem('mega_task_tid', tid);
        }

        let userBalance = 0;

        async function init() {
            try {
                let { data, error } = await client.from('users').select('*').eq('telegram_id', tid).maybeSingle();
                
                if (!data) {
                    const { data: newUser } = await client.from('users').insert([{
                        telegram_id: tid, points: 0, total_earned: 0, streak: 1
                    }]).select().single();
                    if (newUser) data = newUser;
                }

                if (data) {
                    userBalance = data.points || 0;
                    document.getElementById('current-points').innerText = userBalance.toLocaleString() + " نقطة";
                } else {
                    document.getElementById('current-points').innerText = "0 نقطة";
                }
            } catch (err) {
                console.error("Init withdraw error:", err);
                document.getElementById('current-points').innerText = "0 نقطة";
            }
        }

        function convertCurrency() {
            const val = parseFloat(document.getElementById('amountInput').value);
            const hint = document.getElementById('conversion-hint');
            
            if (isNaN(val) || val <= 0) {
                hint.innerText = "";
                return;
            }

            // لو الرقم أقل من 100 معناه كتب بالجنيه، ولو أكبر معناه كتب بالنقاط
            if (val < 100) {
                const calculatedPoints = val * 100;
                hint.innerText = `💡 يعادل بالنقاط: ${calculatedPoints.toLocaleString()} نقطة`;
            } else {
                const calculatedEgp = (val / 100).toFixed(2);
                hint.innerText = `💡 يعادل بالمصري: ${calculatedEgp} جنيه`;
            }
        }

        async function processWithdraw() {
            let inputVal = parseFloat(document.getElementById('amountInput').value);
            const method = document.getElementById('method').value;
            const wallet = document.getElementById('wallet').value;
            const btn = document.getElementById('withdrawBtn');

            if (isNaN(inputVal) || inputVal <= 0) return tg.showAlert("❌ يرجى إدخال مبلغ صحيح للسحب");

            // توحيد الحساب إلى نقاط نهائية
            let finalPoints = inputVal < 100 ? inputVal * 100 : inputVal;

            if (finalPoints < 1000) return tg.showAlert("❌ الحد الأدنى للسحب هو 1,000 نقطة");
            if (finalPoints > userBalance) return tg.showAlert("❌ عذراً، رصيدك غير كافٍ لهذا المبلغ");
            if (!wallet) return tg.showAlert("⚠️ يرجى إدخال بيانات الاستلام (رقم الهاتف أو الـ ID)");

            btn.disabled = true;
            btn.innerText = "جاري المعالجة...";

            const { error: err1 } = await client.from('withdrawals').insert([{
                telegram_id: tid, amount: finalPoints, method: method, wallet_info: wallet, status: 'Pending'
            }]);

            if (!err1) {
                await client.from('users').update({ points: userBalance - finalPoints }).eq('telegram_id', tid);
                tg.showAlert("✅ تم إرسال طلبك بنجاح! سيتم التحقق والدفع خلال 24 ساعة.");
                goHome();
            } else {
                tg.showAlert("❌ فشل الطلب: " + err1.message);
                btn.disabled = false;
                btn.innerText = "تأكيد طلب السحب ↗";
            }
        }

        function goHome() { window.location.href = `index.html?id=${tid}`; }
        function goTasks() { window.location.href = `tasks.html?id=${tid}`; }
        function goInvite() { window.location.href = `invite.html?id=${tid}`; }
        function goProfile() { window.location.href = `profile.html?id=${tid}`; }

        init();
    </script>
</body>
</html>
