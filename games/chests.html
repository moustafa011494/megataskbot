<script>
const URLS="https://smukfrwnguvmxvfwqwrv.supabase.co",
KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWtmcnduZ3V2bXh2Zndxd3J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1MDg1NjgsImV4cCI6MjA4NTA4NDU2OH0.NUr7X5V7K-jarVLNm7Ft0dHo6QkIhhGYrkteRRb9wCM";

const tg=window.Telegram?.WebApp||null,
db=supabase.createClient(URLS,KEY);

tg?.ready();
tg?.expand();

const $=id=>document.getElementById(id),
canvas=$("game"),
ctx=canvas.getContext("2d"),
overlay=$("overlay"),
panel=$("panel"),
startBtn=$("startBtn"),
backBtn=$("backBtn"),
scoreEl=$("score"),
levelEl=$("level"),
timeEl=$("time"),
diamondsEl=$("diamonds"),
toastEl=$("toast");

let uid=null,user=null,diamondField=null,W=360,H=640,dpr=1,
running=false,saving=false,score=0,level=1,gameTime=0,
startTime=0,lastTime=0,animationId=null,
completedRounds=+localStorage.getItem("frost_breakout_rounds")||0,
particles=[],stars=[],screenShake=0,flash=0;

const paddle={x:180,y:590,w:82,h:9,targetX:180},
ball={x:180,y:520,r:7,vx:3.8,vy:-5.4,speed:5.4},
brickSettings={cols:5,w:52,h:19,gap:5,top:88};

let bricks=[];

for(let i=0;i<100;i++)
 stars.push({
  x:Math.random(),
  y:Math.random(),
  size:Math.random()*1.7+.2,
  alpha:Math.random()*.8+.15
 });

function resizeCanvas(){
 const r=canvas.getBoundingClientRect();
 dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=r.width*dpr;
 canvas.height=r.height*dpr;
 W=r.width;
 H=r.height;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 paddle.y=H-56;

 if(!running){
  paddle.x=paddle.targetX=W/2;
  ball.x=W/2;
  ball.y=H-95;
 }
}

addEventListener("resize",resizeCanvas);
resizeCanvas();

let toastTimer;

function showToast(m){
 toastEl.textContent=m;
 toastEl.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>toastEl.classList.remove("show"),1800);
}


/* ===== إصلاح جلب الحساب ===== */

async function initUser(){
 try{
  let id=
   new URLSearchParams(location.search).get("id")||
   tg?.initDataUnsafe?.user?.id||
   localStorage.getItem("telegram_id")||"";

  id=String(id).trim();

  if(!id||id==="undefined"||id==="null"){
   let {data:latest}=await db
    .from("users")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(1)
    .maybeSingle();

   if(latest){
    user=latest;
    id=String(latest.telegram_id);
   }
  }

  if(!user){
   let {data:u}=await db
    .from("users")
    .select("*")
    .eq("telegram_id",String(id))
    .maybeSingle();

   if(u){
    user=u;
   }else{
    let n=Number(id);

    if(Number.isFinite(n)){
     let {data:uNum}=await db
      .from("users")
      .select("*")
      .eq("telegram_id",n)
      .maybeSingle();

     if(uNum)user=uNum;
    }
   }
  }

  if(!user){
   let {data:fallback}=await db
    .from("users")
    .select("*")
    .limit(1)
    .maybeSingle();

   if(fallback)user=fallback;
  }

  if(!user)return false;

  uid=String(user.telegram_id);
  localStorage.setItem("telegram_id",uid);

  diamondField=
   user.gamepoints!==undefined?"gamepoints":
   user.diamonds!==undefined?"diamonds":null;

  if(!diamondField)return false;

  updateDiamondUI();

  console.log(
   "MegaTask:",
   uid,
   diamondField,
   user[diamondField]
  );

  return true;

 }catch(e){
  console.error("INIT USER:",e);
  return false;
}

}

function updateDiamondUI(){
 diamondsEl.textContent="💎 "+Number(user?.[diamondField]||0);
}

async function changeDiamonds(amount,title){
 try{
  if(!user||!diamondField)return false;

  const old=Number(user[diamondField]||0),
  next=Math.max(0,old+amount);

  let r=await db
   .from("users")
   .update({[diamondField]:next})
   .eq("telegram_id",user.telegram_id)
   .select("*")
   .maybeSingle();

  if(r.error){
   const n=Number(user.telegram_id);

   if(Number.isFinite(n)){
    r=await db
     .from("users")
     .update({[diamondField]:next})
     .eq("telegram_id",n)
     .select("*")
     .maybeSingle();
   }
  }

  if(r.error){
   console.error("BALANCE:",r.error);
   return false;
  }

  user=r.data||{...user,[diamondField]:next};
  updateDiamondUI();

  await db.from("transactions").insert({
   telegram_id:String(user.telegram_id),
   type:"points",
   title,
   amount:(amount>0?"+":"")+amount+" 💎",
   status:"مكتمل"
  });

  return true;

 }catch(e){
  console.error("CHANGE:",e);
  return false;
 }
}

let adBusy=false;

async function showAd(){
 if(adBusy)return;

 adBusy=true;

 try{
  if(typeof show_10959333==="function"){
   await Promise.race([
    show_10959333(),
    new Promise(r=>setTimeout(r,8000))
   ]);
  }
 }catch(e){
  console.warn("AD:",e);
 }finally{
  adBusy=false;
 }
}

function getBallSpeed(){
 return Math.min(12,5.4+Math.floor(score/100)*.28);
}

function updateDifficulty(){
 const nl=1+Math.floor(score/300);

 if(nl!==level){
  level=nl;
  levelEl.textContent=level;
  buildBricks();
  resetBall();
  flash=1;
  showToast("❄️ LEVEL "+level+" — السرعة زادت!");
 }

 const s=getBallSpeed(),
 cs=Math.hypot(ball.vx,ball.vy);

 if(cs){
  const f=s/cs;
  ball.vx*=f;
  ball.vy*=f;
 }

 paddle.w=Math.max(55,82-Math.floor(score/250)*3);
}

function buildBricks(){
 bricks=[];

 const cols=5,
 rows=Math.min(4+Math.floor((level-1)/2),8),
 total=cols*brickSettings.w+(cols-1)*brickSettings.gap,
 startX=(W-total)/2;

 for(let row=0;row<rows;row++){
  for(let col=0;col<cols;col++){

   let exists=true;

   if(level>=3&&(row+col+level)%5===0&&row>0)
    exists=false;

   if(level>=5&&(col===0||col===cols-1))
    exists=row%2===0;

   if(!exists)continue;

   const strong=level>=5&&(row+col)%4===0;

   bricks.push({
    x:startX+col*(brickSettings.w+brickSettings.gap),
    y:brickSettings.top+row*(brickSettings.h+brickSettings.gap),
    w:brickSettings.w,
    h:brickSettings.h,
    hp:strong?2:1,
    maxHp:strong?2:1,
    alive:true
   });
  }
 }
}

function resetBall(){
 ball.x=W/2;
 ball.y=H-95;

 const a=-Math.PI/2+(Math.random()-.5)*.8,
 s=getBallSpeed();

 ball.speed=s;
 ball.vx=Math.cos(a)*s;
 ball.vy=Math.sin(a)*s;
}

function addScore(n){
 score+=n;
 scoreEl.textContent=String(score).padStart(6,"0");
 updateDifficulty();
}

function createBurst(x,y,count=12){
 for(let i=0;i<count;i++){
  const a=Math.random()*Math.PI*2,
  s=Math.random()*3+1;

  particles.push({
   x,y,
   vx:Math.cos(a)*s,
   vy:Math.sin(a)*s,
   life:1,
   size:Math.random()*3+1
  });
 }
}

function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];

  p.x+=p.vx;
  p.y+=p.vy;
  p.vy+=.04;
  p.life-=dt*2;

  if(p.life<=0)
   particles.splice(i,1);
 }
}

function movePaddle(x){
 const r=canvas.getBoundingClientRect();

 paddle.targetX=Math.max(
  paddle.w/2,
  Math.min(W-paddle.w/2,x-r.left)
 );
}

canvas.onpointermove=e=>running&&movePaddle(e.clientX);
canvas.onpointerdown=e=>running&&movePaddle(e.clientX);

canvas.ontouchmove=e=>{
 if(running&&e.touches[0])
  movePaddle(e.touches[0].clientX);

 e.preventDefault();
};

onkeydown=e=>{
 if(!running)return;

 if(e.key==="ArrowLeft")
  paddle.targetX-=45;

 if(e.key==="ArrowRight")
  paddle.targetX+=45;

 paddle.targetX=Math.max(
  paddle.w/2,
  Math.min(W-paddle.w/2,paddle.targetX)
 );
};

function circleRect(c,r){
 const x=Math.max(r.x,Math.min(c.x,r.x+r.w)),
 y=Math.max(r.y,Math.min(c.y,r.y+r.h)),
 dx=c.x-x,
 dy=c.y-y;

 return dx*dx+dy*dy<=c.r*c.r;
}

function updateBall(dt){
 const ox=ball.x,oy=ball.y;

 ball.x+=ball.vx*dt*60;
 ball.y+=ball.vy*dt*60;

 if(ball.x-ball.r<=0){
  ball.x=ball.r;
  ball.vx=Math.abs(ball.vx);
  createBurst(ball.x,ball.y,5);
 }

 if(ball.x+ball.r>=W){
  ball.x=W-ball.r;
  ball.vx=-Math.abs(ball.vx);
  createBurst(ball.x,ball.y,5);
 }

 if(ball.y-ball.r<=64){
  ball.y=64+ball.r;
  ball.vy=Math.abs(ball.vy);
  createBurst(ball.x,ball.y,5);
 }

 const pr={
  x:paddle.x-paddle.w/2,
  y:paddle.y,
  w:paddle.w,
  h:paddle.h
 };

 if(ball.vy>0&&circleRect(ball,pr)){
  ball.y=paddle.y-ball.r;

  const hit=(ball.x-paddle.x)/(paddle.w/2),
  a=hit*Math.PI*.43-Math.PI/2,
  s=getBallSpeed();

  ball.vx=Math.cos(a)*s;
  ball.vy=Math.sin(a)*s;

  createBurst(ball.x,paddle.y,10);
 }

 for(const b of bricks){
  if(!b.alive||!circleRect(ball,b))
   continue;

  if(oy+ball.r<=b.y){
   ball.y=b.y-ball.r;
   ball.vy=-Math.abs(ball.vy);
  }else if(oy-ball.r>=b.y+b.h){
   ball.y=b.y+b.h+ball.r;
   ball.vy=Math.abs(ball.vy);
  }else if(ox+ball.r<=b.x){
   ball.x=b.x-ball.r;
   ball.vx=-Math.abs(ball.vx);
  }else{
   ball.x=b.x+b.w+ball.r;
   ball.vx=Math.abs(ball.vx);
  }

  addScore(10);
  b.hp--;

  createBurst(ball.x,ball.y,18);
  screenShake=Math.min(7,screenShake+2);
  flash=.35;

  if(b.hp<=0){
   b.alive=false;
   addScore(10);
  }

  break;
 }

 if(ball.y-ball.r>H)
  endGame("سقطت الكرة");
}

function update(dt){
 if(!running)return;

 gameTime=(performance.now()-startTime)/1000;
 timeEl.textContent=gameTime.toFixed(1)+"s";

 paddle.x+=(paddle.targetX-paddle.x)*Math.min(1,dt*18);

 updateBall(dt);
 updateParticles(dt);

 if(screenShake>0)
  screenShake-=dt*18;

 if(flash>0)
  flash-=dt*2;

 if(bricks.length&&bricks.every(b=>!b.alive)){
  level++;
  levelEl.textContent=level;
  buildBricks();
  resetBall();
  showToast("❄️ Level "+level+" بدأ!");
  flash=1;
 }
}

function drawBackground(){
 ctx.fillStyle="#010817";
 ctx.fillRect(0,0,W,H);

 for(const s of stars){
  ctx.globalAlpha=
   s.alpha*(.5+.5*Math.sin(performance.now()/1000+s.x*10));

  ctx.fillStyle="#78ddff";
  ctx.beginPath();
  ctx.arc(s.x*W,s.y*H,s.size,0,Math.PI*2);
  ctx.fill();
 }

 ctx.globalAlpha=1;

 const g=ctx.createRadialGradient(
  W/2,H*.48,10,
  W/2,H*.48,H*.72
 );

 g.addColorStop(0,"#006eff1a");
 g.addColorStop(1,"#00000000");

 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);
}

function drawBorder(){
 ctx.save();

 ctx.shadowColor="#008cff";
 ctx.shadowBlur=16;
 ctx.strokeStyle="#008cff";
 ctx.lineWidth=2;
 ctx.strokeRect(7,7,W-14,H-14);

 ctx.shadowBlur=5;
 ctx.strokeStyle="#00dcffa6";
 ctx.lineWidth=1;
 ctx.strokeRect(11,11,W-22,H-22);

 ctx.restore();
}

function drawBricks(){
 for(const b of bricks){
  if(!b.alive)continue;

  const h=b.hp/b.maxHp,
  g=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);

  g.addColorStop(0,h>=1?"#54f4ff":"#1595ff");
  g.addColorStop(.5,"#087bff");
  g.addColorStop(1,"#0739b9");

  ctx.save();
  ctx.shadowColor="#008cff";
  ctx.shadowBlur=12;
  ctx.fillStyle=g;

  ctx.beginPath();
  ctx.roundRect(b.x,b.y,b.w,b.h,3);
  ctx.fill();

  ctx.restore();

  ctx.fillStyle="#ffffff40";
  ctx.fillRect(b.x+3,b.y+2,b.w-6,2);

  if(b.hp>1){
   ctx.fillStyle="#ffffffcc";
   ctx.font="10px Arial";
   ctx.textAlign="center";
   ctx.fillText("❄",b.x+b.w/2,b.y+14);
  }
 }
}

function drawPaddle(){
 const x=paddle.x-paddle.w/2,
 g=ctx.createLinearGradient(
  x,paddle.y,
  x,paddle.y+paddle.h
 );

 g.addColorStop(0,"#e0ffff");
 g.addColorStop(.35,"#36eaff");
 g.addColorStop(1,"#0078ff");

 ctx.save();
 ctx.shadowColor="#00cfff";
 ctx.shadowBlur=18;
 ctx.fillStyle=g;

 ctx.beginPath();
 ctx.roundRect(x,paddle.y,paddle.w,paddle.h,4);
 ctx.fill();

 ctx.restore();
}

function drawBall(){
 const g=ctx.createRadialGradient(
  ball.x,ball.y,1,
  ball.x,ball.y,25
 );

 g.addColorStop(0,"#64f5fff2");
 g.addColorStop(.25,"#00b4ffa6");
 g.addColorStop(1,"#0064ff00");

 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.arc(ball.x,ball.y,25,0,Math.PI*2);
 ctx.fill();

 ctx.save();
 ctx.shadowColor="#00eaff";
 ctx.shadowBlur=18;
 ctx.fillStyle="#e5ffff";

 ctx.beginPath();
 ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
 ctx.fill();

 ctx.restore();
}

function drawParticles(){
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle="#70eaff";
  ctx.shadowColor="#00cfff";
  ctx.shadowBlur=8;

  ctx.beginPath();
  ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
  ctx.fill();
 }

 ctx.globalAlpha=1;
}

function render(){
 ctx.save();

 let sx=0,sy=0;

 if(screenShake>0){
  sx=(Math.random()-.5)*screenShake;
  sy=(Math.random()-.5)*screenShake;
 }

 ctx.translate(sx,sy);

 drawBackground();
 drawBorder();
 drawBricks();
 drawPaddle();
 drawBall();
 drawParticles();

 if(flash>0){
  ctx.globalAlpha=Math.min(.2,flash*.2);
  ctx.fillStyle="#cfffff";
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;
 }

 ctx.restore();
}

function gameLoop(now){
 if(!running)return;

 const dt=Math.min(.033,(now-lastTime)/1000);
 lastTime=now;

 update(dt);
 render();

 animationId=requestAnimationFrame(gameLoop);
}

function beginRound(){
 score=0;
 level=1;
 gameTime=0;

 scoreEl.textContent="000000";
 levelEl.textContent="1";
 timeEl.textContent="0.0s";

 paddle.w=82;
 paddle.x=paddle.targetX=W/2;

 particles=[];
 buildBricks();
 resetBall();

 overlay.classList.add("hidden");
 running=true;

 startTime=lastTime=performance.now();

 if(animationId)
  cancelAnimationFrame(animationId);

 animationId=requestAnimationFrame(gameLoop);
}


/* ===== بداية الجولة المصححة ===== */

async function startGameRequest(){
 if(running||saving)return;

 saving=true;
 startBtn.disabled=true;
 startBtn.textContent="⏳ جاري تجهيز الجولة...";

 try{

  if(!user||!diamondField){
   const ok=await initUser();

   if(!ok){
    showToast("⚠️ لم يتم العثور على حسابك");
    return;
   }
  }

  const balance=Number(user[diamondField]||0);

  if(balance<1){
   const m=
    "⚠️ ليس لديك ألماسات كافية!\n\nيلزمك 1 💎 لبدء الجولة.";

   tg?.showAlert?
    tg.showAlert(m):
    showToast("⚠️ يلزمك 1 💎 لبدء الجولة");

   return;
  }

  if(completedRounds>0&&completedRounds%3===0){

   startBtn.textContent="📺 جاري تحميل الإعلان...";

   await showAd();

   completedRounds=0;
   localStorage.setItem("frost_breakout_rounds","0");
  }

  if(!await changeDiamonds(-1,"بدء جولة Frost Breakout")){
   showToast("⚠️ تعذر خصم الألماسة");
   return;
  }

  beginRound();

 }catch(e){

  console.error("START:",e);

  tg?.showAlert?
   tg.showAlert("⚠️ حصل خطأ أثناء بدء الجولة.\nحاول مرة أخرى."):
   showToast("⚠️ حصل خطأ أثناء بدء الجولة");

 }finally{

  saving=false;

  if(!running){
   startBtn.disabled=false;
   startBtn.textContent="🎮 ابدأ الجولة — 1 💎";
  }
 }
}

async function endGame(reason){
 if(!running)return;

 running=false;

 if(animationId){
  cancelAnimationFrame(animationId);
  animationId=null;
 }

 const earned=Math.floor(score/100);

 completedRounds++;
 localStorage.setItem(
  "frost_breakout_rounds",
  completedRounds
 );

 saving=true;

 try{

  let rewardText="لم تحقق 100 Score بعد.";

  if(earned){
   rewardText=
    await changeDiamonds(
     earned,
     "مكافأة Frost Breakout"
    )
    ?"🎉 حصلت على "+earned+" 💎"
    :"⚠️ تعذر حفظ المكافأة";
  }

  showGameOver(
   reason,
   earned,
   rewardText
  );

 }catch(e){

  showGameOver(
   reason,
   earned,
   "⚠️ تعذر حفظ المكافأة"
  );

 }finally{
  saving=false;
 }
}

function showGameOver(reason,earned,rewardText){

 overlay.classList.remove("hidden");

 const nextAd=
  completedRounds>0&&completedRounds%3===0;

 panel.innerHTML=`
 <div class="logo">❄️</div>
 <h1>انتهت الجولة</h1>
 <div class="subtitle">${reason}</div>

 <div class="infoGrid">
  <div class="infoBox">SCORE<b>${score}</b></div>
  <div class="infoBox">LEVEL<b>${level}</b></div>
  <div class="infoBox">الوقت<b>${gameTime.toFixed(1)}s</b></div>
  <div class="infoBox">المكافأة<b>+${earned} 💎</b></div>
 </div>

 <div style="color:#8eeaff;font-size:13px;margin-bottom:12px">
  ${rewardText}
 </div>

 ${nextAd?
 `<div style="color:#ffd36a;font-size:12px;margin-bottom:12px">
  📺 سيتم عرض إعلان قبل الجولة التالية
 </div>`:""}

 <button class="gameBtn" id="retryBtn">
  🔄 جولة جديدة — 1 💎
 </button>

 <button class="gameBtn secondaryBtn" id="gameBackBtn">
  ← العودة للألعاب
 </button>`;

 $("retryBtn").onclick=startGameRequest;
 $("gameBackBtn").onclick=goBack;

 updateDiamondUI();
}

function goBack(){

 let id=
  uid||
  new URLSearchParams(location.search).get("id")||
  localStorage.getItem("telegram_id");

 location.href=
  "../games.html"+
  (id?"?id="+encodeURIComponent(id):"");
}

startBtn.onclick=startGameRequest;
backBtn.onclick=goBack;


/* ===== تحميل الحساب عند فتح اللعبة ===== */

(async()=>{
 const ok=await initUser();

 startBtn.disabled=false;
 startBtn.textContent="🎮 ابدأ الجولة — 1 💎";

 if(!ok)
  console.warn("User will be loaded on start");
})();
</script>
