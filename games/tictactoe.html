<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MegaTask - Tic Tac Toe</title>
<script src="https://libtl.com/sdk.js" data-zone="10959333" data-sdk="show_10959333"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{--g:#00d26a;--bg:#0d0f12;--card:#1a1d23;--gray:#9ca3af}
html,body{background:var(--bg);color:#fff;font-family:'Segoe UI',sans-serif;margin:0;padding:0 0 50px;width:100%;max-width:100vw;overflow-x:hidden;text-align:center}
.header{padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2d333d}
.back-link{background:#252932;color:#fff;border:0;padding:8px 15px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:12px;text-decoration:none}
.game-title{margin:20px 0 5px;color:var(--g);font-size:20px}.game-desc{font-size:12px;color:var(--gray);margin-bottom:15px}
.stat-badge{font-size:13px;color:#00f2ff;font-weight:bold;margin-bottom:15px;display:inline-block;background:#00f2ff1a;padding:6px 15px;border-radius:10px;border:1px solid #00f2ff}
.tictactoe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto 20px;padding:0 15px}
.cell{aspect-ratio:1;background:var(--card);border:2px solid #2d333d;border-radius:16px;font-size:40px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;user-select:none}
.cell:active{background:#252932}.cell.x{color:#00f2ff}.cell.o{color:#ff3b30}
.btn-action{background:var(--g);color:#000;border:0;padding:12px 25px;border-radius:12px;font-weight:bold;font-size:13px;cursor:pointer;box-shadow:0 4px 15px #00d26a33}
#restart-btn{display:none}
</style>
</head>
<body>

<div class="header">
<a id="back-link" href="#" class="back-link">⬅ العودة للألعاب</a>
<span style="font-size:13px;font-weight:bold;color:var(--g)">❌ إكس أو الذكية ⭕</span>
<div style="width:60px"></div>
</div>

<h2 class="game-title">تحدي الذكاء (Tic Tac Toe)</h2>
<p class="game-desc">الفوز يمنحك +5 ألماسات 💎 | الخسارة تخصم منك 5 ألماسات!</p>
<div class="stat-badge">ألماسات حسابك: <span id="user-diamonds-counter">0</span> 💎</div>
<div id="status-msg" style="font-size:13px;color:#ffaa00;font-weight:bold;margin-bottom:15px">جاري تحميل الجولة...</div>

<div class="tictactoe-grid" id="board">
<div class="cell" onclick="makeMove(0)"></div><div class="cell" onclick="makeMove(1)"></div><div class="cell" onclick="makeMove(2)"></div>
<div class="cell" onclick="makeMove(3)"></div><div class="cell" onclick="makeMove(4)"></div><div class="cell" onclick="makeMove(5)"></div>
<div class="cell" onclick="makeMove(6)"></div><div class="cell" onclick="makeMove(7)"></div><div class="cell" onclick="makeMove(8)"></div>
</div>

<button id="restart-btn" class="btn-action" onclick="nextRound()">🔄 جولة جديدة</button>

<script>
const tg=window.Telegram.WebApp;tg.expand();

const client=supabase.createClient(
"https://smukfrwnguvmxvfwqwrv.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWtmcnduZ3V2bXh2Zndxd3J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1MDg1NjgsImV4cCI6MjA4NTA4NDU2OH0.NUr7X5V7K-jarVLNm7Ft0dHo6QkIhhGYrkteRRb9wCM"
);

const p=new URLSearchParams(location.search);
let tid=String(p.get("id")||tg.initDataUnsafe.user?.id||localStorage.getItem("telegram_id")||"").trim();

document.getElementById("back-link").href=`../games.html?id=${tid}`;

const roundKey=`tictactoe_rounds_${tid}`;
const lockKey=`tictactoe_lock_${tid}`;

let userData=null,board=["","","","","","","","",""],active=false,currentPlayer="X";
let rounds=Number(localStorage.getItem(roundKey)||0),timer=null,dailyUsed=0;

const wins=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

function cairoDate(){
return new Intl.DateTimeFormat("en-CA",{
timeZone:"Africa/Cairo",year:"numeric",month:"2-digit",day:"2-digit"
}).format(new Date());
}

function setStatus(t){
document.getElementById("status-msg").innerText=t;
}

/* نفس طريقة ربط Lucky Chests بالضبط */
async function initUser(){
if(!tid||tid==="undefined"||tid==="null"){
try{
let{data:x}=await client.from("users")
.select("*").order("created_at",{ascending:false}).limit(1).maybeSingle();

if(x){
userData=x;
tid=String(x.telegram_id);
}
}catch(e){}
}

try{
let{data:u}=await client.from("users")
.select("*").eq("telegram_id",String(tid)).maybeSingle();

if(u)userData=u;
else{
let{data:n}=await client.from("users")
.select("*").eq("telegram_id",Number(tid)).maybeSingle();

if(n)userData=n;
else{
let{data:f}=await client.from("users")
.select("*").limit(1).maybeSingle();

if(f)userData=f;
}
}

if(!userData)
return tg.showAlert("❌ لم يتم العثور على حسابك في قاعدة البيانات.");

tid=String(userData.telegram_id);
localStorage.setItem("telegram_id",tid);

updateUI();
await prepareDaily();

if(dailyUsed>=30){
setStatus("🚫 وصلت للحد الأقصى اليومي: 30 جولة.");
return;
}

/* مهم: قراءة الحالة فقط — لا تبدأ الجولة تلقائياً */
checkSavedState();

}catch(e){
console.error(e);
tg.showAlert("❌ حدث خطأ أثناء جلب بيانات المستخدم.");
}
}

function updateUI(){
if(!userData)return;
let d=Number(userData.gamepoints!==undefined?userData.gamepoints:userData.diamonds||0);
document.getElementById("user-diamonds-counter").innerText=d.toLocaleString();
}

async function prepareDaily(){
try{
const today=cairoDate();
let used=Number(userData.daily_game_rounds||0);

if(userData.daily_game_date!==today){

const patch={daily_game_rounds:0,daily_game_date:today};

let r=await client.from("users").update(patch)
.eq("telegram_id",String(tid)).select("*").maybeSingle();

if(!r.data){
r=await client.from("users").update(patch)
.eq("telegram_id",Number(tid)).select("*").maybeSingle();
}

if(r.data)userData=r.data;
used=0;
}

dailyUsed=Number(userData.daily_game_rounds||used);

}catch(e){
console.error("daily:",e);
dailyUsed=0;
}
}

async function consumeDailyRound(){
try{
const today=cairoDate();

let r=await client.from("users")
.select("daily_game_rounds,daily_game_date")
.eq("telegram_id",String(tid)).maybeSingle();

if(!r.data){
r=await client.from("users")
.select("daily_game_rounds,daily_game_date")
.eq("telegram_id",Number(tid)).maybeSingle();
}

if(!r.data)return true;

let used=Number(r.data.daily_game_rounds||0);

if(r.data.daily_game_date!==today)used=0;

if(used>=30){
dailyUsed=30;
setStatus("🚫 وصلت للحد الأقصى اليومي: 30 جولة.");
return false;
}

const next=used+1;
const patch={daily_game_rounds:next,daily_game_date:today};

r=await client.from("users").update(patch)
.eq("telegram_id",String(tid)).select("*").maybeSingle();

if(!r.data){
r=await client.from("users").update(patch)
.eq("telegram_id",Number(tid)).select("*").maybeSingle();
}

if(r.data){
userData=r.data;
dailyUsed=next;
return true;
}

return true;

}catch(e){
console.error("consume:",e);
return true;
}
}

function checkSavedState(){

rounds=Number(localStorage.getItem(roundKey)||0);

const lockUntil=Number(localStorage.getItem(lockKey)||0);

if(lockUntil>0){

if(Date.now()<lockUntil){
showSavedTimer(lockUntil);
return;
}

localStorage.removeItem(lockKey);
rounds=0;
localStorage.setItem(roundKey,"0");
}

if(rounds>=3){
document.getElementById("restart-btn").style.display="inline-block";
document.getElementById("restart-btn").innerText="📺 مشاهدة الإعلان";
setStatus("📺 لازم تشاهد الإعلان قبل بدء الـ3 جولات الجديدة.");
return;
}

if(dailyUsed>=30){
setStatus("🚫 انتهت كل جولاتك اليوم (30/30).");
document.getElementById("restart-btn").style.display="none";
return;
}

/* لا تبدأ الجولة عند فتح اللعبة */
document.getElementById("restart-btn").style.display="inline-block";
document.getElementById("restart-btn").innerText="🔄 بدء الجولة";
setStatus(`جاهز للجولة ${rounds+1} من 3`);
}

async function startRound(){

if(timer||active)return;

rounds=Number(localStorage.getItem(roundKey)||0);

if(rounds>=3){
document.getElementById("restart-btn").style.display="inline-block";
document.getElementById("restart-btn").innerText="📺 مشاهدة الإعلان";
setStatus("📺 لازم تشاهد الإعلان قبل الجولة القادمة.");
return;
}

if(dailyUsed>=30){
setStatus("🚫 انتهت كل جولاتك اليوم (30/30).");
document.getElementById("restart-btn").style.display="none";
return;
}

const allowed=await consumeDailyRound();

if(!allowed)return;

document.getElementById("restart-btn").style.display="none";

reset();
active=true;
setStatus("دورك (X)");
}

async function nextRound(){

if(timer||active)return;

rounds=Number(localStorage.getItem(roundKey)||0);

if(dailyUsed>=30){
setStatus("🚫 انتهت كل جولاتك اليوم (30/30).");
document.getElementById("restart-btn").style.display="none";
return;
}

if(rounds>=3){
showAd();
return;
}

startRound();
}

async function showAd(){

document.getElementById("restart-btn").style.display="none";
setStatus("⏳ جاري تحميل الإعلان...");

try{

if(typeof show_10959333!=="function")
throw new Error("Ad unavailable");

await show_10959333();

rounds=0;
localStorage.setItem(roundKey,"0");

const lockUntil=Date.now()+300000;
localStorage.setItem(lockKey,String(lockUntil));

startTimer(lockUntil);

}catch(e){

console.error(e);

tg.showAlert("❌ يجب مشاهدة الإعلان كاملاً.");
setStatus("⚠️ لم يتم إكمال الإعلان.");
document.getElementById("restart-btn").style.display="inline-block";
document.getElementById("restart-btn").innerText="📺 مشاهدة الإعلان";
}
}

function showSavedTimer(end){

timer=setInterval(()=>{

const left=Math.max(0,end-Date.now());
const s=Math.ceil(left/1000);
const m=Math.floor(s/60);
const sec=s%60;

setStatus(
`⏱️ متاح اللعب بعد ${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
);

if(left<=0){

clearInterval(timer);
timer=null;

localStorage.removeItem(lockKey);
rounds=0;
localStorage.setItem(roundKey,"0");

if(dailyUsed>=30){
setStatus("🚫 انتهت كل جولاتك اليوم (30/30).");
document.getElementById("restart-btn").style.display="none";
return;
}

const leftRounds=Math.min(3,30-dailyUsed);

setStatus(`✅ انتهى وقت الانتظار، يمكنك لعب ${leftRounds} جولات جديدة.`);
document.getElementById("restart-btn").style.display="inline-block";
document.getElementById("restart-btn").innerText="🔄 بدء الجولة";
}

},250);
}

function startTimer(end){
showSavedTimer(end);
}

function makeMove(i){

if(board[i]||!active||currentPlayer!=="X")return;

board[i]="X";
draw();

if(check("X"))
return finish("🎉 مبروك! فزت على الخصم وحصلت على +5 ألماسات 💎",5);

if(board.every(Boolean))
return finish("🤝 تعادل! لا تغيير في رصيد الألماس.");

currentPlayer="O";
setStatus("دور الكمبيوتر (O)...");
setTimeout(computer,500);
}

function computer(){

if(!active)return;

let move=best();

if(move<0){

let e=board.map((v,i)=>v===""?i:null).filter(v=>v!==null);

if(!e.length)return;

move=e[Math.floor(Math.random()*e.length)];
}

board[move]="O";
draw();

if(check("O"))
return finish("❌ فاز الكمبيوتر! تم خصم 5 ألماسات من رصيدك.",-5);

if(board.every(Boolean))
return finish("🤝 تعادل! لا تغيير في رصيد الألماس.");

currentPlayer="X";
setStatus("دورك (X)");
}

function best(){

for(const c of wins){

let l=c.map(i=>board[i]);

if(l.filter(v=>v==="O").length===2&&l.includes(""))
return c[l.indexOf("")];

if(l.filter(v=>v==="X").length===2&&l.includes(""))
return c[l.indexOf("")];

}

return -1;
}

function check(x){
return wins.some(c=>c.every(i=>board[i]===x));
}

function draw(){

document.querySelectorAll(".cell").forEach((e,i)=>{
e.innerText=board[i];
e.className=`cell ${board[i].toLowerCase()}`;
});

}

async function updateDiamonds(a){

if(!userData)return;

const field=userData.gamepoints!==undefined?"gamepoints":
userData.diamonds!==undefined?"diamonds":"gamepoints";

const n=Math.max(0,Number(userData[field]||0)+a);

try{

let obj={[field]:n};

let r=await client.from("users")
.update(obj)
.eq("telegram_id",String(tid))
.select("*").single();

if(!r.data){

r=await client.from("users")
.update(obj)
.eq("telegram_id",Number(tid))
.select("*").single();

}

if(r.data){
userData=r.data;
updateUI();
}

}catch(e){
console.error("Update diamonds:",e);
}
}

function finish(text,reward=0){

active=false;

rounds++;
localStorage.setItem(roundKey,String(rounds));

setStatus(text);

if(reward)
updateDiamonds(reward);

if(dailyUsed>=30){

document.getElementById("restart-btn").style.display="none";
return;
}

document.getElementById("restart-btn").style.display="inline-block";

document.getElementById("restart-btn").innerText=
rounds>=3
?"📺 مشاهدة الإعلان"
:"🔄 جولة جديدة";
}

function reset(){

board=["","","","","","","","",""];
currentPlayer="X";
draw();

}

initUser();
</script>
</body>
  </html>
