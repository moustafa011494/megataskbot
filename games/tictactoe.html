<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MegaTask - Tic Tac Toe</title>
    
    <!-- إعلانات Monetag -->
    <script src="//libtl.com/sdk.js" data-zone="10959333" data-sdk="show_10959333"></script>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --main-green: #00d26a; --dark-bg: #0d0f12; --card-bg: #1a1d23; --text-gray: #9ca3af; }
        html, body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; padding-bottom: 50px; width: 100%; max-width: 100vw; overflow-x: hidden; text-align: center; }
        
        .header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d333d; }
        .back-link { background: #252932; color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 12px; text-decoration: none; }
        
        .game-title { margin: 20px 0 5px; color: var(--main-green); font-size: 20px; }
        .game-desc { font-size: 12px; color: var(--text-gray); margin-bottom: 15px; }

        .stat-badge { font-size: 13px; color: #00f2ff; font-weight: bold; margin-bottom: 15px; display: inline-block; background: rgba(0,242,255,0.1); padding: 6px 15px; border-radius: 10px; border: 1px solid #00f2ff; }

        /* شبكة الإكس أو */
        .tictactoe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto 20px; padding: 0 15px; }
        .cell { aspect-ratio: 1; background: var(--card-bg); border: 2px solid #2d333d; border-radius: 16px; font-size: 40px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; user-select: none; }
        .cell:active { background: #252932; }
        .cell.x { color: #00f2ff; }
        .cell.o { color: #ff3b30; }

        .btn-action { background: var(--main-green); color: black; border: none; padding: 12px 25px; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 210, 106, 0.2); display: none; }
    </style>
</head>
<body>

    <div class="header">
        <a id="back-link" href="#" class="back-link">⬅ العودة للألعاب</a>
        <span style="font-size: 13px; font-weight: bold; color: var(--main-green);">❌ إكس أو الذكية ⭕</span>
        <div style="width: 60px;"></div>
    </div>

    <h2 class="game-title">تحدي الذكاء (Tic Tac Toe)</h2>
    <p class="game-desc">الفوز يمنحك +5 ألماسات 💎 | الخسارة تخصم منك 5 ألماسات!</p>

    <div class="stat-badge">ألماسات حسابك: <span id="user-diamonds-counter">0</span> 💎</div>

    <div id="status-msg" style="font-size: 13px; color: #ffaa00; font-weight: bold; margin-bottom: 15px;">جاري تحميل الجولة...</div>

    <div class="tictactoe-grid" id="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
    </div>

    <button id="restart-btn" class="btn-action" onclick="startNewRoundWithAd()">
        🔄 جولة جديدة (مشاهدة إعلان)
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const S_URL = "https://smukfrwnguvmxvfwqwrv.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWtmcnduZ3V2bXh2Zndxd3J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1MDg1NjgsImV4cCI6MjA4NTA4NDU2OH0.NUr7X5V7K-jarVLNm7Ft0dHo6QkIhhGYrkteRRb9wCM";
        const client = supabase.createClient(S_URL, S_KEY);

        const params = new URLSearchParams(window.location.search);
        let tid = String(params.get('id') || tg.initDataUnsafe.user?.id || localStorage.getItem('telegram_id') || "").trim();

        document.getElementById('back-link').href = `../games.html?id=${tid}`;

        let userData = null;
        let board = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = false;
        let currentPlayer = "X";

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        async function initUser() {
            if (!tid) {
                tg.showAlert("❌ لم يتم العثور على معرف المستخدم.");
                return;
            }

            try {
                const { data: user, error } = await client
                    .from('users')
                    .select('*')
                    .eq('telegram_id', String(tid))
                    .maybeSingle();

                if (error || !user) {
                    tg.showAlert("❌ حدث خطأ أثناء جلب بيانات المستخدم.");
                    return;
                }

                userData = user;
                updateUI();
                
                // بدء أول جولة بإعلان إلزامي عند فتح اللعبة
                startNewRoundWithAd();

            } catch (e) {
                console.error("Init error:", e);
            }
        }

        function updateUI() {
            if (!userData) return;
            const diamonds = Number(userData.gamepoints || 0);
            document.getElementById('user-diamonds-counter').innerText = diamonds.toLocaleString();
        }

        async function startNewRoundWithAd() {
            document.getElementById('status-msg').innerText = "⏳ جاري تحميل إعلان الجولة الجديدة...";
            document.getElementById('restart-btn').style.display = 'none';

            try {
                if (typeof show_10959333 === 'function') {
                    await show_10959333();
                } else {
                    console.warn("Monetag SDK not found, bypassing ad for testing.");
                }

                // بدء اللعبة بعد مشاهدة الإعلان بنجاح
                resetBoard();
                isGameActive = true;
                document.getElementById('status-msg').innerText = "دورك (X)";

            } catch (err) {
                console.error("Ad error:", err);
                tg.showAlert("❌ يجب مشاهدة الإعلان كاملاً لبدء الجولة الجديدة.");
                document.getElementById('status-msg').innerText = "⚠️ لم يتم إكمال الإعلان.";
                document.getElementById('restart-btn').style.display = 'inline-block';
            }
        }

        function makeMove(index) {
            if (board[index] !== "" || !isGameActive || currentPlayer !== "X") return;

            board[index] = "X";
            updateBoardUI();
            
            if (checkWin("X")) {
                endGame("🎉 مبروك! فزت على الخصم وحصلت على +5 ألماسات 💎");
                updateUserDiamonds(5);
                return;
            }

            if (board.every(cell => cell !== "")) {
                endGame("🤝 تعادل! لا تغيير في رصيد الألماس.");
                document.getElementById('restart-btn').style.display = 'inline-block';
                return;
            }

            currentPlayer = "O";
            document.getElementById('status-msg').innerText = "دور الكمبيوتر (O)...";
            setTimeout(computerMove, 500);
        }

        function computerMove() {
            if (!isGameActive) return;

            let move = findBestMove();
            if (move === -1) {
                let emptyCells = board.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
                if (emptyCells.length === 0) return;
                move = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }

            board[move] = "O";
            updateBoardUI();

            if (checkWin("O")) {
                endGame("❌ فاز الكمبيوتر! تم خصم 5 ألماسات من رصيدك.");
                updateUserDiamonds(-5);
                return;
            }

            if (board.every(cell => cell !== "")) {
                endGame("🤝 تعادل! لا تغيير في رصيد الألماس.");
                document.getElementById('restart-btn').style.display = 'inline-block';
                return;
            }

            currentPlayer = "X";
            document.getElementById('status-msg').innerText = "دورك (X)";
        }

        function findBestMove() {
            for (let condition of winningConditions) {
                let [a, b, c] = condition;
                let line = [board[a], board[b], board[c]];
                if (line.filter(v => v === "O").length === 2 && line.includes("")) {
                    return condition[line.indexOf("")];
                }
                if (line.filter(v => v === "X").length === 2 && line.includes("")) {
                    return condition[line.indexOf("")];
                }
            }
            return -1;
        }

        function checkWin(player) {
            return winningConditions.some(condition => {
                return condition.every(index => board[index] === player);
            });
        }

        function updateBoardUI() {
            const cells = document.querySelectorAll('.cell');
            board.forEach((val, idx) => {
                cells[idx].innerText = val;
                cells[idx].className = `cell ${val.toLowerCase()}`;
            });
        }

        async function updateUserDiamonds(amount) {
            if (!userData) return;

            let currentDiamonds = Number(userData.gamepoints || 0);
            let newDiamonds = currentDiamonds + amount;
            if (newDiamonds < 0) newDiamonds = 0; // عدم النزول تحت الصفر

            try {
                const { data: updated, error } = await client
                    .from('users')
                    .update({ gamepoints: newDiamonds })
                    .eq('telegram_id', String(tid))
                    .select('*')
                    .single();

                if (!error && updated) {
                    userData = updated;
                    updateUI();
                }
            } catch (e) {
                console.error("Update diamonds error:", e);
            }

            document.getElementById('restart-btn').style.display = 'inline-block';
        }

        function endGame(message) {
            isGameActive = false;
            document.getElementById('status-msg').innerText = message;
        }

        function resetBoard() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            updateBoardUI();
        }

        initUser();
    </script>
</body>
</html>
