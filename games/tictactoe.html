<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MegaTask - Tic Tac Toe</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --main-green: #00d26a; --dark-bg: #0d0f12; --card-bg: #1a1d23; --text-gray: #9ca3af; }
        html, body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; padding-bottom: 50px; width: 100%; max-width: 100vw; overflow-x: hidden; text-align: center; }
        
        .header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d333d; }
        .back-link { background: #252932; color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 12px; text-decoration: none; }
        
        .game-title { margin: 20px 0 5px; color: var(--main-green); font-size: 20px; }
        .game-desc { font-size: 12px; color: var(--text-gray); margin-bottom: 15px; }

        .stat-badge { font-size: 13px; color: var(--main-green); font-weight: bold; margin-bottom: 15px; display: inline-block; background: rgba(0,210,106,0.1); padding: 6px 15px; border-radius: 10px; border: 1px solid var(--main-green); }

        /* شبكة الإكس أو */
        .tictactoe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto 20px; padding: 0 15px; }
        .cell { aspect-ratio: 1; background: var(--card-bg); border: 2px solid #2d333d; border-radius: 16px; font-size: 40px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; user-select: none; }
        .cell:active { background: #252932; }
        .cell.x { color: #00f2ff; }
        .cell.o { color: #ff3b30; }

        .btn-action { background: var(--main-green); color: black; border: none; padding: 12px 25px; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 210, 106, 0.2); display: none; }
    </style>
</head>
<body>

    <div class="header">
        <a id="back-link" href="#" class="back-link">⬅ العودة للألعاب</a>
        <span style="font-size: 13px; font-weight: bold; color: var(--main-green);">❌ إكس أو الذكية ⭕</span>
        <div style="width: 60px;"></div>
    </div>

    <h2 class="game-title">تحدي الذكاء (Tic Tac Toe)</h2>
    <p class="game-desc">اهزم الخصم واكسب ألماسات الولاء والتفوق!</p>

    <div class="stat-badge">ألماسات الجلسة: <span id="tictactoe-score">0</span> 💎</div>

    <div id="status-msg" style="font-size: 13px; color: #ffaa00; font-weight: bold; margin-bottom: 15px;">دورك (X)</div>

    <div class="tictactoe-grid" id="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
    </div>

    <button id="restart-btn" class="btn-action" onclick="resetBoard()">
        🔄 جولة جديدة
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const userId = String(params.get('id') || tg.initDataUnsafe.user?.id || "").trim();

        document.getElementById('back-link').href = `../games.html?id=${userId}`;

        let board = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;
        let sessionDiamonds = 0;
        let currentPlayer = "X"; // X للمستخدم، O للكمبيوتر

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function makeMove(index) {
            if (board[index] !== "" || !isGameActive || currentPlayer !== "X") return;

            board[index] = "X";
            updateBoardUI();
            
            if (checkWin("X")) {
                endGame("🎉 مبروك! فزت على الخصم وحصلت على +5 ألماسات 💎");
                sessionDiamonds += 5;
                document.getElementById('tictactoe-score').innerText = sessionDiamonds;
                saveDiamonds(5);
                return;
            }

            if (board.every(cell => cell !== "")) {
                endGame("🤝 تعادل! حاول مجدداً.");
                return;
            }

            currentPlayer = "O";
            document.getElementById('status-msg').innerText = "دور الكمبيوتر (O)...";
            setTimeout(computerMove, 500);
        }

        function computerMove() {
            if (!isGameActive) return;

            // محاولة الفوز أو منع اللاعب
            let move = findBestMove();
            if (move === -1) {
                let emptyCells = board.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
                if (emptyCells.length === 0) return;
                move = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }

            board[move] = "O";
            updateBoardUI();

            if (checkWin("O")) {
                endGame("❌ فاز الكمبيوتر! حظ أوفر في المرة القادمة.");
                return;
            }

            if (board.every(cell => cell !== "")) {
                endGame("🤝 تعادل! حاول مجدداً.");
                return;
            }

            currentPlayer = "X";
            document.getElementById('status-msg').innerText = "دورك (X)";
        }

        function findBestMove() {
            // ذكاء اصطناعي بسيط لمنع الفوز أو تحقيق الفوز
            for (let condition of winningConditions) {
                let [a, b, c] = condition;
                let line = [board[a], board[b], board[c]];
                if (line.filter(v => v === "O").length === 2 && line.includes("")) {
                    return condition[line.indexOf("")];
                }
                if (line.filter(v => v === "X").length === 2 && line.includes("")) {
                    return condition[line.indexOf("")];
                }
            }
            return -1;
        }

        function checkWin(player) {
            return winningConditions.some(condition => {
                return condition.every(index => board[index] === player);
            });
        }

        function updateBoardUI() {
            const cells = document.querySelectorAll('.cell');
            board.forEach((val, idx) => {
                cells[idx].innerText = val;
                cells[idx].className = `cell ${val.toLowerCase()}`;
            });
        }

        function endGame(message) {
            isGameActive = false;
            document.getElementById('status-msg').innerText = message;
            document.getElementById('restart-btn').style.display = 'inline-block';
        }

        function resetBoard() {
            board = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            currentPlayer = "X";
            document.getElementById('status-msg').innerText = "دورك (X)";
            document.getElementById('restart-btn').style.display = 'none';
            updateBoardUI();
        }

        function saveDiamonds(amount) {
            let current = parseInt(localStorage.getItem(`megatask_diamonds_${userId}`) || '0');
            localStorage.setItem(`megatask_diamonds_${userId}`, current + amount);
        }
    </script>
</body>
</html>
