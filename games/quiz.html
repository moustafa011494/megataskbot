<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MegaTask - Quiz Game</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --main-green: #00d26a; --dark-bg: #0d0f12; --card-bg: #1a1d23; --text-gray: #9ca3af; }
        html, body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; padding-bottom: 50px; width: 100%; max-width: 100vw; overflow-x: hidden; text-align: center; }
        
        .header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d333d; }
        .back-link { background: #252932; color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 12px; text-decoration: none; }
        
        .game-title { margin: 20px 0 5px; color: var(--main-green); font-size: 20px; }
        .game-desc { font-size: 12px; color: var(--text-gray); margin-bottom: 20px; }

        .quiz-card { background: var(--card-bg); border: 1px solid #2d333d; border-radius: 20px; padding: 20px; max-width: 350px; margin: 0 auto 20px; text-align: right; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .question-text { font-size: 15px; font-weight: bold; margin-bottom: 15px; color: white; line-height: 1.6; text-align: center; }
        
        .option-btn { background: #16191e; border: 1px solid #2d333d; color: white; width: 100%; padding: 12px 15px; border-radius: 12px; font-size: 13px; font-weight: bold; margin-bottom: 10px; cursor: pointer; text-align: right; transition: 0.2s; }
        .option-btn:active { transform: scale(0.98); border-color: var(--main-green); }
        .option-btn.correct { background: rgba(0, 210, 106, 0.2); border-color: var(--main-green); color: #00d26a; }
        .option-btn.wrong { background: rgba(255, 59, 48, 0.2); border-color: #ff3b30; color: #ff6b6b; }

        .stat-badge { font-size: 13px; color: #ffaa00; font-weight: bold; margin-bottom: 15px; display: inline-block; background: rgba(255,170,0,0.1); padding: 6px 15px; border-radius: 10px; border: 1px solid #ffaa00; }
    </style>
</head>
<body>

    <div class="header">
        <a id="back-link" href="#" class="back-link">⬅ العودة للألعاب</a>
        <span style="font-size: 13px; font-weight: bold; color: var(--main-green);">❓ كويز الذكاء</span>
        <div style="width: 60px;"></div>
    </div>

    <h2 class="game-title">تحدي المعلومات العامة</h2>
    <p class="game-desc">أجب عن الأسئلة الصحيحة واكسب نقاط لعبة إضافية!</p>

    <div class="stat-badge">نقاط الجلسة: <span id="quiz-score">0</span></div>

    <div class="quiz-card" id="quiz-container">
        <div class="question-text" id="question-box">جاري تحميل السؤال...</div>
        <div id="options-box"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const userId = String(params.get('id') || tg.initDataUnsafe.user?.id || "").trim();

        document.getElementById('back-link').href = `../games.html?id=${userId}`;

        const questions = [
            { q: "ما هو عاصمة دولة إيطاليا؟", options: ["مدريد", "روما", "باريس", "برلين"], correct: 1 },
            { q: "كم عدد سور القرآن الكريم؟", options: ["112 سورة", "114 سورة", "120 سورة", "100 سورة"], correct: 1 },
            { q: "أي كوكب يلقب بالكوكب الأحمر؟", options: ["المشتري", "المريخ", "زحل", "الزهرة"], correct: 1 },
            { q: "من هو واضع علم الجبر؟", options: ["الخوارزمي", "ابن سينا", "الزهراوي", "البيروني"], correct: 0 },
            { q: "ما هو أسرع حيوان بري في العالم؟", options: ["الأسد", "الفهد", "الغزال", "الحصان"], correct: 1 }
        ];

        let currentQIndex = 0;
        let sessionQuizPoints = 0;

        function loadQuestion() {
            if (currentQIndex >= questions.length) {
                document.getElementById('quiz-container').innerHTML = `
                    <div style="text-align: center; padding: 20px;">
                        <h3>🏆 انتهى الكويز بنجاح!</h3>
                        <p style="color: var(--text-gray); font-size: 13px;">جمعْتَ إجمالاً +${sessionQuizPoints} نقاط لعبة في هذه الجلسة.</p>
                        <button class="option-btn" style="text-align: center; background: var(--main-green); color: black;" onclick="resetQuiz()">إعادة التحدي 🔄</button>
                    </div>
                `;
                return;
            }

            const qObj = questions[currentQIndex];
            document.getElementById('question-box').innerText = qObj.q;
            
            const optBox = document.getElementById('options-box');
            optBox.innerHTML = '';

            qObj.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx, qObj.correct, btn);
                optBox.appendChild(btn);
            });
        }

        function selectOption(selected, correct, btn) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add('correct');
                sessionQuizPoints += 2; // منح نقطتي لعبة لكل إجابة صحيحة
                document.getElementById('quiz-score').innerText = sessionQuizPoints;
                
                // حفظ النقاط محلياً لتضاف لمركز الألعاب الرئيسي
                let savedGamePoints = parseInt(localStorage.getItem(`clicker_game_${userId}_points`) || '0');
                localStorage.setItem(`clicker_game_${userId}_points`, savedGamePoints + 2);

                setTimeout(() => {
                    currentQIndex++;
                    loadQuestion();
                }, 1000);
            } else {
                btn.classList.add('wrong');
                allBtns[correct].classList.add('correct');
                
                setTimeout(() => {
                    currentQIndex++;
                    loadQuestion();
                }, 1400);
            }
        }

        function resetQuiz() {
            currentQIndex = 0;
            sessionQuizPoints = 0;
            document.getElementById('quiz-score').innerText = 0;
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
