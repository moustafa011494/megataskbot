<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frost Seahorse - MegaTask</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --main-green: #00d26a; --dark-bg: #05070a; }
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--dark-bg); color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; user-select: none; -webkit-user-select: none;
        }

        /* شريط العلوي (السكور في المنتصف) */
        .game-top-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; justify-content: center; align-items: center;
            padding: 15px 20px; z-index: 10; pointer-events: none;
        }
        .top-info-box { 
            background: rgba(20, 23, 31, 0.85); border: 1px solid rgba(0,242,255,0.3); 
            padding: 8px 25px; border-radius: 25px; font-size: 16px; font-weight: bold; color: #00f2ff;
            box-shadow: 0 4px 15px rgba(0,242,255,0.2);
        }
        .top-info-box span { color: #ffaa00; }

        /* ساحة اللعبة بملء الشاشة */
        canvas { display: block; width: 100vw; height: 100vh; background: linear-gradient(180deg, #070c14 0%, #0d1626 100%); }

        /* شاشة البداية والنهاية المنبثقة */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 10, 0.92); z-index: 30;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 25px; text-align: center;
        }
        .overlay-screen h1 { color: #00d26a; font-size: 28px; margin-bottom: 5px; text-shadow: 0 0 15px rgba(0,210,106,0.3); }
        .overlay-screen p { color: #9ca3af; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        
        .btn-action-game {
            background: linear-gradient(135deg, #00d26a, #009e4f); color: #000;
            border: none; width: 100%; max-width: 260px; padding: 15px; border-radius: 20px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 210, 106, 0.35); transition: 0.2s;
        }
        .btn-action-game:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="game-top-bar">
        <div class="top-info-box">💎 الألماسات المكتسبة: <span id="current-score">0</span></div>
    </div>

    <div id="start-screen" class="overlay-screen">
        <div style="font-size: 60px; margin-bottom: 10px;">🌊🐴</div>
        <h1>حصان البحر السريع</h1>
        <p>انقر في أي مكان لسباحة حصان البحر وتجنب العقبات الجليدية. كل عائق تتخطاه يمنحك ألماسة مباشرة وتزداد اللعبة سرعة وصعوبة!</p>
        <button class="btn-action-game" onclick="startGame()">🎮 ابدأ التحدي الآن</button>
    </div>

    <div id="gameover-screen" class="overlay-screen" style="display: none;">
        <div style="font-size: 60px; margin-bottom: 10px;">💥</div>
        <h1>انتهت الجولة!</h1>
        <p id="final-score-text" style="color: white; font-size: 16px; font-weight: bold; margin-bottom: 20px;">الألماسات المجمعة: 0 💎</p>
        <button class="btn-action-game" onclick="startGame()">🔄 اللعب مرة أخرى</button>
        <button class="btn-action-game" style="background: #222630; color: #fff; margin-top: 12px;" onclick="exitGame()">🔙 العودة للبوت</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const S_URL = "https://smukfrwnguvmxvfwqwrv.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWtmcnduZ3V2bXh2Zndxd3J2In0.NUr7X5V7K-jarVLNm7Ft0dHo6QkIhhGYrkteRRb9wCM";
        const client = supabase.createClient(S_URL, S_KEY);

        const params = new URLSearchParams(window.location.search);
        let userId = String(params.get('id') || tg.initDataUnsafe.user?.id || localStorage.getItem('telegram_id') || "").trim();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        let score = 0;
        let userData = null;
        let gameRunning = false;
        let gameSpeed = 3; // السرعة الابتدائية

        let player = {
            x: canvas.width * 0.25,
            y: canvas.height / 2,
            radius: 20,
            velocity: 0,
            gravity: 0.38,
            jump: -7.5
        };

        let pipes = [];
        let pipeWidth = 60;
        let pipeGap = 200;
        let frameCount = 0;

        async function init() {
            try {
                const { data: user } = await client.from('users').select('*').eq('telegram_id', userId).maybeSingle();
                if (user) userData = user;
            } catch (e) {}
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            
            gameRunning = true;
            score = 0;
            gameSpeed = 3; // إعادة تعيين السرعة
            document.getElementById('current-score').innerText = score;

            player.y = canvas.height / 2;
            player.velocity = 0;
            pipes = [];
            frameCount = 0;

            loop();
        }

        window.addEventListener('click', () => {
            if (gameRunning) player.velocity = player.jump;
        });
        window.addEventListener('touchstart', (e) => {
            if (gameRunning) {
                e.preventDefault();
                player.velocity = player.jump;
            }
        }, { passive: false });

        function update() {
            player.velocity += player.gravity;
            player.y += player.velocity;

            if (player.y + player.radius > canvas.height - 15 || player.y - player.radius < 0) {
                gameOver();
            }

            // توليد الأنابيب بمسافة تتناسب مع السرعة
            if (frameCount % 100 === 0) {
                let minH = 70;
                let maxH = canvas.height - pipeGap - 130;
                let topH = Math.floor(Math.random() * (maxH - minH + 1)) + minH;

                pipes.push({
                    x: canvas.width,
                    top: topH,
                    bottom: canvas.height - topH - pipeGap,
                    passed: false
                });
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= gameSpeed; // التحرك بالسرعة الحالية المتزايدة

                // احتساب كل عائق يتم تعديه بـ 1 ألماسة
                if (!pipes[i].passed && pipes[i].x + pipeWidth < player.x) {
                    score += 1; // السكور يتحسب بالواحدة
                    document.getElementById('current-score').innerText = score;
                    pipes[i].passed = true;

                    // زيادة السرعة كلما تقدم اللاعب وصعبت اللعبة أكثر
                    gameSpeed += 0.15; 
                    if (pipeGap > 150) pipeGap -= 1; // تقليل الفجوة تدريجياً لزيادة التحدي
                }

                if (
                    player.x + player.radius > pipes[i].x &&
                    player.x - player.radius < pipes[i].x + pipeWidth &&
                    (player.y - player.radius < pipes[i].top || player.y + player.radius > canvas.height - pipes[i].bottom)
                ) {
                    gameOver();
                }

                if (pipes[i].x + pipeWidth < 0) pipes.splice(i, 1);
            }
            frameCount++;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم العقبات الجليدية
            pipes.forEach(p => {
                let grad = ctx.createLinearGradient(p.x, 0, p.x + pipeWidth, 0);
                grad.addColorStop(0, "#00d26a");
                grad.addColorStop(0.5, "#00f2ff");
                grad.addColorStop(1, "#009e4f");

                ctx.fillStyle = grad;
                ctx.fillRect(p.x, 0, pipeWidth, p.top);
                ctx.fillRect(p.x, canvas.height - p.bottom, pipeWidth, p.bottom);
            });

            // رسم شكل حصان البحر بدقة واحترافية عالية داخل الـ Canvas
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // توهج أحيائي مائي
            ctx.shadowBlur = 18;
            ctx.shadowColor = "#00f2ff";

            // رأس وجسم حصان البحر المنحني
            ctx.beginPath();
            ctx.ellipse(0, 0, player.radius * 0.85, player.radius, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#00ffcc";
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();

            // تاج أو رأس حصان البحر المميز
            ctx.beginPath();
            ctx.arc(-6, -player.radius * 0.7, 7, 0, Math.PI * 2);
            ctx.fillStyle = "#00d26a";
            ctx.fill();
            ctx.stroke();

            // العين اللامعة
            ctx.beginPath();
            ctx.arc(-8, -player.radius * 0.75, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = "#000000";
            ctx.fill();

            // الذيل المنحني للخلف
            ctx.beginPath();
            ctx.moveTo(0, player.radius * 0.8);
            ctx.quadraticCurveTo(player.radius, player.radius * 1.5, player.radius * 0.5, player.radius * 1.8);
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#00ffcc";
            ctx.stroke();

            ctx.restore();
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        async function gameOver() {
            gameRunning = false;
            document.getElementById('final-score-text').innerText = `الألماسات المكتسبة: ${score} 💎`;
            document.getElementById('gameover-screen').style.display = 'flex';

            if (score > 0 && userData) {
                try {
                    const gpField = userData.gamepoints !== undefined ? 'gamepoints' : (userData.diamonds !== undefined ? 'diamonds' : 'gamepoints');
                    const currentDiamonds = Number(userData[gpField] || 0);
                    const newDiamonds = currentDiamonds + score;

                    const updateObj = {};
                    updateObj[gpField] = newDiamonds;

                    const { data: updated, error } = await client
                        .from('users')
                        .update(updateObj)
                        .eq('telegram_id', String(userId))
                        .select('*')
                        .single();

                    if (!error && updated) {
                        userData = updated;
                    }

                    // تسجيل المعاملة في الهيستوري
                    await client.from('transactions').insert([{
                        telegram_id: String(userId),
                        type: 'points',
                        title: 'مكافأة لعبة حصان البحر',
                        amount: `+${score} 💎`,
                        status: 'مكتمل'
                    }]);

                } catch (e) {
                    console.error("Save score error:", e);
                }
            }
        }

        function exitGame() {
            window.location.href = `../games.html?id=${userId}`;
        }

        init();
    </script>
</body>
</html>
