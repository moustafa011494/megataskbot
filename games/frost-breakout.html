/* =========================================================

/* =========================================================
   STARS

function createStars(){

            a:Math.random()*.6+.15,

createStars();


/* =========================================================
   USER LOOKUP
========================================================= */

async function initUser(){

    try{

        if(
            !tid ||
            tid === "undefined" ||
            tid === "null"
        ){

            const {
                data:latest,
                error:latestError
            } =
            await db
            .from("users")
            .select("*")
            .order(
                "created_at",
                {ascending:false}
            )
            .limit(1)
            .maybeSingle();

            if(latestError){

                console.error(
                    "LATEST USER ERROR:",
                    latestError
                );
            }

            if(latest){

                user = latest;

                tid =
                String(
                    latest.telegram_id
                );
            }
        }


        if(!user){

            let r =
            await db
            .from("users")
            .select("*")
            .eq(
                "telegram_id",
                String(tid)
            )
            .maybeSingle();

            console.log(
                "STRING USER:",
                r.data,
                r.error
            );

            if(r.data){

                user = r.data;
            }


            if(!user && !r.error){

                const n =
                Number(tid);

                if(
                    Number.isFinite(n)
                ){

                    r =
                    await db
                    .from("users")
                    .select("*")
                    .eq(
                        "telegram_id",
                        n
                    )
                    .maybeSingle();

                    console.log(
                        "NUMBER USER:",
                        r.data,
                        r.error
                    );

                    if(r.data){

                        user = r.data;
                    }
                }
            }
        }


        if(!user){

            const {
                data:firstUser,
                error:firstError
            } =
            await db
            .from("users")
            .select("*")
            .limit(1)
            .maybeSingle();

            console.log(
                "FALLBACK USER:",
                firstUser,
                firstError
            );

            if(firstUser){

                user = firstUser;

                tid =
                String(
                    firstUser.telegram_id
                );
            }
        }


        if(!user){

            loading.textContent =
            "❌ لم يتم العثور على الحساب";

            return false;
        }


        uid =
        String(
            user.telegram_id
        );

        tid = uid;

        localStorage.setItem(
            "telegram_id",
            uid
        );


        diamondField =
        user.gamepoints !== undefined
        ? "gamepoints"
        : user.diamonds !== undefined
        ? "diamonds"
        : null;


        if(!diamondField){

            loading.textContent =
            "❌ لم يتم العثور على رصيد الألماس";

            console.error(
                "No gamepoints/diamonds field",
                user
            );

            return false;
        }


        updateDiamondUI();

        loading.textContent =
        "✅ الحساب جاهز";

        return true;

    }catch(e){

        console.error(
            "INIT USER ERROR:",
            e
        );

        loading.textContent =
        "❌ حدث خطأ في تحميل الحساب";

        return false;
    }
}


/* =========================================================
   BALANCE
========================================================= */

function updateDiamondUI(){

    if(
        !user ||
        !diamondField
    ){

        balanceEl.textContent =
        "0 💎";

        return;
    }

    const value =
    Number(
        user[diamondField] || 0
    );

    balanceEl.textContent =
    `${value} 💎`;
}


/* =========================================================
   CHANGE DIAMONDS
========================================================= */

async function changeDiamonds(amount){

    if(
        !user ||
        !diamondField
    ){

        return false;
    }

    const current =
    Number(
        user[diamondField] || 0
    );

    const next =
    Math.max(
        0,
        current +
        Number(amount)
    );

    const payload = {

        [diamondField]:next

    };

    let r =
    await db
    .from("users")
    .update(payload)
    .eq(
        "telegram_id",
        String(uid)
    )
    .select("*")
    .maybeSingle();


    if(
        !r.data &&
        !r.error
    ){

        const n =
        Number(uid);

        if(
            Number.isFinite(n)
        ){

            r =
            await db
            .from("users")
            .update(payload)
            .eq(
                "telegram_id",
                n
            )
            .select("*")
            .maybeSingle();
        }
    }


    if(r.error){

        console.error(
            "DIAMOND UPDATE:",
            r.error
        );

        return false;
    }


    if(r.data){

        user = r.data;

    }else{

        user[diamondField] =
        next;
    }


    updateDiamondUI();

    return true;
}

/* =========================================================
   RESET GAME
========================================================= */

function resetGame(){

    score = 0;

    level = 1;

    elapsed = 0;

    roundReward = 0;

    particles = [];


    paddle.w = 110;

    paddle.h = 12;

    paddle.x =
    W/2 -
    paddle.w/2;

    /* المضرب أعلى */

    paddle.y =
    H - 125;

    paddle.targetX =
    W/2;


    /* سرعة بداية أعلى بكثير */

    const speed = 7.5;

    const angle =
    Math.random() > .5
    ? 0.55
    : -0.55;


    ball.x =
    W/2;

    /* الكرة أعلى بما يتناسب مع المضرب */

    ball.y =
    H - 158;

    ball.r = 8;


    ball.vx =
    Math.cos(angle) *
    speed *
    (Math.random()>0.5 ? 1 : -1);


    ball.vy =
    -Math.abs(
        Math.sin(angle) *
        speed
    );


    createBricks();

    updateHUD();
}


/* =========================================================
   BRICKS
========================================================= */

function createBricks(){

    bricks = [];

    const cols =
    W < 400 ? 6 : 7;

    const rows =
    Math.min(
        5 +
        Math.floor(level/2),
        8
    );

    const gap = 6;

    const side = 12;

    const bw =
    (
        W -
        side*2 -
        gap*(cols-1)
    ) / cols;

    const bh = 21;

    const top = 125;


    for(
        let r=0;
        r<rows;
        r++
    ){

        for(
            let c=0;
            c<cols;
            c++
        ){

            bricks.push({

                x:
                side +
                c*(bw+gap),

                y:
                top +
                r*(bh+gap),

                w:bw,

                h:bh,

                alive:true,

                hp:
                1 +
                Math.floor(
                    level/5
                )

            });
        }
    }
}


/* =========================================================
   LEVEL
========================================================= */

function calculateLevel(){

    return Math.min(
        15,
        1 +
        Math.floor(
            score/300
        )
    );
}


/* =========================================================
   BALL SPEED
========================================================= */

function getBallSpeed(){

    /*
       سرعة أعلى بكثير:

       البداية = 7.5

       تزيد تدريجياً مع السكور

       الحد الأقصى = 14
    */

    const base = 7.5;

    const bonus =
    Math.min(
        6.5,
        score / 220
    );

    return base + bonus;
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    scoreEl.textContent =
    Math.floor(score);

    levelEl.textContent =
    level;

    /*
       ثواني + أجزاء من الثانية
       مثال: 12.37s
    */

    timeEl.textContent =
    elapsed.toFixed(2) +
    "s";

    updateDiamondUI();
}


/* =========================================================
   PARTICLES
========================================================= */

function burst(
    x,
    y,
    count=8
){

    for(
        let i=0;
        i<count;
        i++
    ){

        const a =
        Math.random() *
        Math.PI*2;

        const speed =
        Math.random()*3+1;


        particles.push({

            x:x,

            y:y,

            vx:
            Math.cos(a) *
            speed,

            vy:
            Math.sin(a) *
            speed,

            life:1,

            size:
            Math.random()*3+1

        });
    }
}


function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
        particles[i];

        p.x += p.vx;

        p.y += p.vy;

        p.vy += .04;

        p.life -=
        dt * 2.5;


        if(p.life<=0){

            particles.splice(
                i,
                1
            );
        }
    }
}


function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha =
        Math.max(
            0,
            p.life
        );

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
        "#72ddff";

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

    const g =
    ctx.createLinearGradient(
        0,
        0,
        0,
        H
    );

    g.addColorStop(
        0,
        "#020a18"
    );

    g.addColorStop(
        .5,
        "#03172a"
    );

    g.addColorStop(
        1,
        "#01060d"
    );

    ctx.fillStyle = g;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    for(
        const s of stars
    ){

        s.y += s.s;

        if(s.y>H){

            s.y=0;

            s.x =
            Math.random()*W;
        }

        ctx.globalAlpha =
        s.a;

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
        "#bcefff";

        ctx.fill();
    }

    ctx.globalAlpha=1;


    const glow =
    ctx.createRadialGradient(
        W/2,
        H*.35,
        10,
        W/2,
        H*.35,
        H*.65
    );

    glow.addColorStop(
        0,
        "rgba(0,170,255,.07)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=glow;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   DRAW BRICKS
========================================================= */

function drawBricks(){

    for(
        const b of bricks
    ){

        if(!b.alive) continue;


        const g =
        ctx.createLinearGradient(
            b.x,
            b.y,
            b.x,
            b.y+b.h
        );

        g.addColorStop(
            0,
            "#8cecff"
        );

        g.addColorStop(
            1,
            "#177db2"
        );

        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.roundRect(
            b.x,
            b.y,
            b.w,
            b.h,
            5
        );

        ctx.fill();


        ctx.strokeStyle =
        "rgba(210,250,255,.45)";

        ctx.stroke();


        ctx.fillStyle =
        "rgba(255,255,255,.28)";

        ctx.fillRect(
            b.x+4,
            b.y+3,
            Math.max(
                5,
                b.w*.35
            ),
            2
        );
    }
}


/* =========================================================
   DRAW PADDLE
========================================================= */

function drawPaddle(){

    const g =
    ctx.createLinearGradient(
        paddle.x,
        paddle.y,
        paddle.x,
        paddle.y+paddle.h
    );

    g.addColorStop(
        0,
        "#d9fbff"
    );

    g.addColorStop(
        .4,
        "#65dcff"
    );

    g.addColorStop(
        1,
        "#1684b5"
    );

    ctx.shadowColor =
    "rgba(50,210,255,.65)";

    ctx.shadowBlur = 14;

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.roundRect(
        paddle.x,
        paddle.y,
        paddle.w,
        paddle.h,
        8
    );

    ctx.fill();

    ctx.shadowBlur=0;
}


/* =========================================================
   DRAW BALL
========================================================= */

function drawBall(){

    const g =
    ctx.createRadialGradient(
        ball.x-2,
        ball.y-2,
        1,
        ball.x,
        ball.y,
        ball.r*2.2
    );

    g.addColorStop(
        0,
        "#ffffff"
    );

    g.addColorStop(
        .35,
        "#baf4ff"
    );

    g.addColorStop(
        1,
        "rgba(30,180,255,0)"
    );

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r*2.2,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#f5fdff";

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   COLLISION
========================================================= */

function circleRectCollision(
    c,
    r
){

    const closestX =
    Math.max(
        r.x,
        Math.min(
            c.x,
            r.x+r.w
        )
    );

    const closestY =
    Math.max(
        r.y,
        Math.min(
            c.y,
            r.y+r.h
        )
    );

    const dx =
    c.x-closestX;

    const dy =
    c.y-closestY;

    return (
        dx*dx +
        dy*dy
    ) <
    c.r*c.r;
}


/* =========================================================
   BALL UPDATE
========================================================= */

function updateBall(dt){

    const speed =
    getBallSpeed();


    const currentSpeed =
    Math.sqrt(
        ball.vx*ball.vx +
        ball.vy*ball.vy
    );


    if(
        currentSpeed <
        speed
    ){

        const mul =
        speed /
        Math.max(
            currentSpeed,
            .001
        );

        ball.vx *= mul;

        ball.vy *= mul;
    }


    ball.x += ball.vx;

    ball.y += ball.vy;


    /* WALLS */

    if(
        ball.x-ball.r<=0
    ){

        ball.x=ball.r;

        ball.vx =
        Math.abs(
            ball.vx
        );

    }else if(
        ball.x+ball.r>=W
    ){

        ball.x =
        W-ball.r;

        ball.vx =
        -Math.abs(
            ball.vx
        );
    }


    if(
        ball.y-ball.r<=85
    ){

        ball.y =
        85+ball.r;

        ball.vy =
        Math.abs(
            ball.vy
        );
    }


    /* PADDLE */

    if(
        ball.vy>0 &&
        circleRectCollision(
            ball,
            paddle
        )
    ){

        ball.y =
        paddle.y -
        ball.r -
        1;


        const hit =
        (
            ball.x -
            (
                paddle.x +
                paddle.w/2
            )
        ) /
        (paddle.w/2);


        const maxAngle =
        Math.PI*.42;


        const angle =
        hit*maxAngle;


        const s =
        getBallSpeed();


        ball.vx =
        Math.sin(angle)*s;

        ball.vy =
        -Math.cos(angle)*s;


        burst(
            ball.x,
            paddle.y,
            7
        );
    }


    /* BRICKS */

    for(
        const b of bricks
    ){

        if(!b.alive) continue;


        if(
            circleRectCollision(
                ball,
                b
            )
        ){

            b.hp--;


            if(
                b.hp<=0
            ){

                b.alive=false;

                /* كل طوبة = 7 Score */

                score += 7;


                burst(
                    ball.x,
                    ball.y,
                    12
                );


                screenFlash();

            }else{

                score += 10;


                burst(
                    ball.x,
                    ball.y,
                    5
                );
            }


            const centerX =
            b.x+b.w/2;

            const centerY =
            b.y+b.h/2;


            const dx =
            ball.x-centerX;

            const dy =
            ball.y-centerY;


            if(
                Math.abs(dx/b.w) >
                Math.abs(dy/b.h)
            ){

                ball.vx *= -1;

            }else{

                ball.vy *= -1;
            }

            break;
        }
    }


    /* CLEAR LEVEL */

    if(
        bricks.every(
            b=>!b.alive
        )
    ){

        level++;

        createBricks();

        ball.vy *= 1.05;

        showToast(
            "❄️ مستوى جديد!"
        );
    }


    /* GAME OVER */

    if(
        ball.y-ball.r>H
    ){

        endGame();

        return;
    }


    const newLevel =
    calculateLevel();


    if(
        newLevel!==level
    ){

        level=newLevel;


        paddle.w =
        Math.max(
            65,
            110 -
            (level-1)*4
        );


        createBricks();


        showToast(
            `🔥 Level ${level}`
        );
    }
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(timestamp){

    if(!gameRunning){

        return;
    }


    if(!lastFrame){

        lastFrame =
        timestamp;
    }


    const dt =
    Math.min(
        .033,
        (timestamp-lastFrame)/1000
    );


    lastFrame =
    timestamp;


    elapsed =
    (
        Date.now() -
        startTime
    ) / 1000;


    paddle.x +=
    (
        paddle.targetX -
        (
            paddle.x +
            paddle.w/2
        )
    ) *
    Math.min(
        1,
        dt*14
    );


    paddle.x =
    Math.max(
        0,
        Math.min(
            W-paddle.w,
            paddle.x
        )
    );


    updateBall(dt);

    updateParticles(dt);

    updateHUD();


    ctx.save();

    drawBackground();

    drawBricks();

    drawPaddle();

    drawBall();

    drawParticles();

    ctx.restore();


    animationId =
    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   START GAME REQUEST
========================================================= */

async function startGameRequest(){

    if(gameRunning){

        return;
    }


    if(
        !user ||
        !diamondField
    ){

        const ok =
        await initUser();


        if(!ok){

            showToast(
                "⚠️ لم يتم العثور على حسابك"
            );

            return;
        }
    }


    const balance =
    Number(
        user[diamondField] || 0
    );


    if(balance<1){

        showToast(
            "💎 تحتاج إلى 1 ألماسة لبدء الجولة"
        );

        return;
    }


    startBtn.disabled=true;


    loading.textContent =
    "جاري بدء الجولة...";


    const paid =
    await changeDiamonds(-1);


    if(!paid){

        startBtn.disabled=false;

        showToast(
            "❌ تعذر خصم الألماسة"
        );

        return;
    }


    completedRounds++;


    if(
        completedRounds % 3 === 0
    ){

        try{

            if(
                typeof show_10959333 ===
                "function"
            ){

                await show_10959333();
            }

        }catch(e){

            console.warn(
                "MONETAG:",
                e
            );
        }
    }


    startRound();
}


/* =========================================================
   START ROUND
========================================================= */

function startRound(){

    resultBox.style.display =
    "none";

    overlay.style.display =
    "none";

    touchHint.style.display =
    "block";

    gameRunning=true;

    startTime =
    Date.now();

    lastFrame=0;


    resetGame();


    animationId =
    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   END GAME
========================================================= */

async function endGame(){

    if(!gameRunning){

        return;
    }


    gameRunning=false;


    cancelAnimationFrame(
        animationId
    );


    roundReward =
    Math.floor(
        score/100
    );


    finalScore.textContent =
    Math.floor(score) +
    " SCORE";


    finalReward.textContent =
    "+" +
    roundReward +
    " 💎";


    resultBox.style.display =
    "block";


    overlay.style.display =
    "flex";


    touchHint.style.display =
    "none";


    if(
        roundReward>0
    ){

        const rewarded =
        await changeDiamonds(
            roundReward
        );


        if(rewarded){

            await addTransaction(
                roundReward,
                "مكافأة لعبة Frost Breakout"
            );


            showToast(
                `🎉 حصلت على ${roundReward} 💎`
            );
        }

    }else{

        showToast(
            "❄️ حاول الوصول إلى 100 Score"
        );
    }


    startBtn.disabled=false;


    startBtn.textContent =
    "🎮 العب مرة أخرى — 1 💎";


    loading.textContent =
    "الجولة انتهت";
}


/* =========================================================
   FLASH
========================================================= */

function screenFlash(){

    flash.style.opacity=".12";


    setTimeout(
        ()=>{
            flash.style.opacity="0";
        },
        70
    );
}


/* =========================================================
   TOUCH / MOUSE
========================================================= */

function movePaddle(
    clientX
){

    paddle.targetX =
    Math.max(
        0,
        Math.min(
            W,
            clientX
        )
    );
}


addEventListener(
    "touchstart",
    e=>{

        if(!gameRunning){

            return;
        }


        if(e.touches[0]){

            movePaddle(
                e.touches[0].clientX
            );
        }

    },
    {passive:true}
);


addEventListener(
    "touchmove",
    e=>{

        if(!gameRunning){

            return;
        }


        if(e.touches[0]){

            movePaddle(
                e.touches[0].clientX
            );
        }

    },
    {passive:true}
);


addEventListener(
    "mousemove",
    e=>{

        if(!gameRunning){

            return;
        }


        movePaddle(
            e.clientX
        );
    }
);


/* =========================================================
   BUTTONS
========================================================= */

startBtn.addEventListener(
    "click",
    startGameRequest
);


function goBack(){

    const id =
    String(
        uid ||
        tid ||
        localStorage.getItem(
            "telegram_id"
        ) ||
        ""
    );


    window.location.href =
    "../games.html?id=" +
    encodeURIComponent(id);
}


backBtn.addEventListener(
    "click",
    goBack
);

        "🔄 حاول مرة أخرى";

        loading.textContent =
        "تعذر تحميل الحساب — اضغط مرة أخرى";
    }

})();
