/* =========================================================
   USER LOOKUP
========================================================= */

async function initUser(){

    try{

        const db =
            getSupabase();

        if(!db){

            console.error(
                "Supabase unavailable"
            );

            return false;
        }


        /*
         * 1 - URL
         */

        let telegramId =
            new URLSearchParams(
                window.location.search
            ).get("id");


        /*
         * 2 - Telegram
         */

        if(
            !telegramId &&
            tg &&
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user &&
            tg.initDataUnsafe.user.id
        ){

            telegramId =
                String(
                    tg.initDataUnsafe.user.id
                );
        }


        /*
         * 3 - LocalStorage
         */

        if(!telegramId){

            telegramId =
                localStorage.getItem(
                    "telegram_id"
                );
        }


        /*
         * 4 - آخر مستخدم
         * فقط لو مفيش ID نهائيًا
         */

        if(!telegramId){

            const result =
                await db
                    .from("users")
                    .select("*")
                    .order(
                        "created_at",
                        {
                            ascending:false
                        }
                    )
                    .limit(1)
                    .maybeSingle();

            if(result.data){

                telegramId =
                    String(
                        result.data.telegram_id
                    );
            }
        }


        if(!telegramId){

            console.error(
                "Telegram ID not found"
            );

            return false;
        }


        /*
         * 5 - String ID
         */

        let result =
            await db
                .from("users")
                .select("*")
                .eq(
                    "telegram_id",
                    String(telegramId)
                )
                .maybeSingle();

        user =
            result.data;


        /*
         * 6 - Numeric ID
         */

        if(!user){

            const numericId =
                Number(
                    telegramId
                );

            if(
                Number.isFinite(
                    numericId
                )
            ){

                result =
                    await db
                        .from("users")
                        .select("*")
                        .eq(
                            "telegram_id",
                            numericId
                        )
                        .maybeSingle();

                user =
                    result.data;
            }
        }


        /*
         * 7 - Final fallback
         */

        if(!user){

            const fallback =
                await db
                    .from("users")
                    .select("*")
                    .limit(1)
                    .maybeSingle();

            user =
                fallback.data;
        }


        if(!user){

            console.error(
                "USER NOT FOUND"
            );

            return false;
        }


        /*
         * حفظ ID
         */

        uid =
            String(
                user.telegram_id
            );

        localStorage.setItem(
            "telegram_id",
            uid
        );


        /*
         * تحديد حقل الألماسات
         */

        if(
            user.gamepoints !== undefined &&
            user.gamepoints !== null
        ){

            diamondField =
                "gamepoints";

        }else if(
            user.diamonds !== undefined &&
            user.diamonds !== null
        ){

            diamondField =
                "diamonds";

        }else{

            console.error(
                "No diamond field"
            );

            return false;
        }


        updateDiamondUI();

        console.log(
            "MegaTask User:",
            uid
        );

        console.log(
            "Diamond field:",
            diamondField
        );

        console.log(
            "Balance:",
            Number(
                user[diamondField] || 0
            )
        );

        return true;

    }catch(error){

        console.error(
            "INIT USER ERROR:",
            error
        );

        return false;
    }
}

/* =========================================================
   CHANGE DIAMONDS
========================================================= */

async function changeDiamonds(
    amount,
    title
){

    try{

        const db =
            getSupabase();

        if(
            !db ||
            !user ||
            !diamondField
        ){

            return false;
        }


        const oldBalance =
            Number(
                user[diamondField] || 0
            );

        const newBalance =
            Math.max(
                0,
                oldBalance + amount
            );


        /*
         * تحديث المستخدم
         */

        const result =
            await db
                .from("users")
                .update({

                    [diamondField]:
                        newBalance

                })
                .eq(
                    "telegram_id",
                    user.telegram_id
                )
                .select("*")
                .maybeSingle();


        if(result.error){

            console.error(
                "BALANCE UPDATE ERROR:",
                result.error
            );

            return false;
        }


        /*
         * تحديث البيانات المحلية
         */

        if(result.data){

            user =
                result.data;

        }else{

            user[diamondField] =
                newBalance;
        }


        updateDiamondUI();


        /*
         * Transaction
         */

        try{

            await db
                .from("transactions")
                .insert({

                    telegram_id:
                        String(
                            user.telegram_id
                        ),

                    type:
                        "points",

                    title:
                        title,

                    amount:
                        (
                            amount > 0
                                ? "+"
                                : ""
                        ) +
                        amount +
                        " 💎",

                    status:
                        "مكتمل"
                });

        }catch(transactionError){

            console.warn(
                "Transaction warning:",
                transactionError
            );
        }


        return true;

    }catch(error){

        console.error(
            "CHANGE DIAMONDS ERROR:",
            error
        );

        return false;
    }
}

/* =========================================================
   DIFFICULTY
========================================================= */

function getBallSpeed(){

    /*
     * كل 100 Score
     * السرعة تزيد شوية
     */

    const increase =
        Math.floor(
            score / 100
        );

    return Math.min(
        12,
        5.4 +
        increase * .28
    );
}


function updateDifficulty(){

    /*
     * Level كل 300 Score
     */

    const newLevel =
        1 +
        Math.floor(
            score / 300
        );


    if(
        newLevel !== level
    ){

        level =
            newLevel;

        levelEl.textContent =
            String(level);

        buildBricks();

        resetBall();

        flash = 1;

        showToast(
            "❄️ LEVEL " +
            level +
            " — السرعة زادت!"
        );
    }


    /*
     * تحديث سرعة الكرة
     */

    const targetSpeed =
        getBallSpeed();

    const currentSpeed =
        Math.hypot(
            ball.vx,
            ball.vy
        );

    if(currentSpeed > 0){

        const factor =
            targetSpeed /
            currentSpeed;

        ball.vx *=
            factor;

        ball.vy *=
            factor;
    }


    /*
     * الـPaddle تضيق تدريجيًا
     */

    paddle.w =
        Math.max(
            55,
            82 -
            Math.floor(
                score / 250
            ) * 3
        );
}


/* =========================================================
   BRICKS
========================================================= */

function buildBricks(){

    bricks = [];

    const cols =
        brickSettings.cols;


    /*
     * الصفوف تزيد مع المستوى
     */

    const rows =
        Math.min(
            4 +
            Math.floor(
                (level-1)/2
            ),
            8
        );


    const totalWidth =
        cols *
        brickSettings.w +

        (cols-1) *
        brickSettings.gap;


    const startX =
        (W-totalWidth)/2;


    for(
        let row=0;
        row<rows;
        row++
    ){

        for(
            let col=0;
            col<cols;
            col++
        ){

            let exists =
                true;


            /*
             * من Level 3
             * تبدأ التشكيلات المختلفة
             */

            if(level >= 3){

                if(
                    (row +
                     col +
                     level) % 5 === 0 &&
                    row > 0
                ){

                    exists =
                        false;
                }
            }


            /*
             * مستويات أعلى
             * تشكيلات أصعب
             */

            if(level >= 5){

                if(
                    col === 0 ||
                    col === cols-1
                ){

                    exists =
                        row % 2 === 0;
                }
            }


            if(!exists){
                continue;
            }


            const strong =
                level >= 5 &&
                (row+col)%4 === 0;


            bricks.push({

                x:
                    startX +
                    col *
                    (
                        brickSettings.w +
                        brickSettings.gap
                    ),

                y:
                    brickSettings.top +
                    row *
                    (
                        brickSettings.h +
                        brickSettings.gap
                    ),

                w:
                    brickSettings.w,

                h:
                    brickSettings.h,

                hp:
                    strong ? 2 : 1,

                maxHp:
                    strong ? 2 : 1,

                alive:true
            });
        }
    }
}


/* =========================================================
   RESET BALL
========================================================= */

function resetBall(){

    ball.x =
        W/2;

    ball.y =
        H-95;


    const angle =
        -Math.PI/2 +
        (Math.random()-.5)*.8;


    const speed =
        getBallSpeed();


    ball.speed =
        speed;


    ball.vx =
        Math.cos(angle) *
        speed;

    ball.vy =
        Math.sin(angle) *
        speed;
}

        String(score)
            .padStart(
                6,
                "0"
            );


    updateDifficulty();
}


/* =========================================================
   PARTICLES
========================================================= */

function createBurst(
    x,
    y,
    count=12
){

    for(
        let i=0;
        i<count;
        i++
    ){

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            Math.random()*3+1;


        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:1,

            size:
                Math.random()*3+1
        });
    }
}


function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vy +=
            .04;


        p.life -=
            dt*2;


        if(
            p.life <= 0
        ){

            particles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   INPUT
========================================================= */

function movePaddle(clientX){

    const rect =
        canvas.getBoundingClientRect();


    const x =
        clientX -
        rect.left;


    paddle.targetX =
        Math.max(
            paddle.w/2,
            Math.min(
                W-paddle.w/2,
                x
            )
        );
}


canvas.addEventListener(
    "pointermove",
    function(event){

        if(running){

            movePaddle(
                event.clientX
            );
        }
    }
);


canvas.addEventListener(
    "pointerdown",
    function(event){

        if(running){

            movePaddle(
                event.clientX
            );
        }
    }
);


canvas.addEventListener(
    "touchmove",
    function(event){

        if(
            running &&
            event.touches &&
            event.touches[0]
        ){

            movePaddle(
                event.touches[0].clientX
            );
        }

        event.preventDefault();

    },
    {
        passive:false
    }
);


window.addEventListener(
    "keydown",
    function(event){

        if(!running){
            return;
        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            paddle.targetX -=
                45;
        }


        if(
            event.key ===
            "ArrowRight"
        ){

            paddle.targetX +=
                45;
        }


        paddle.targetX =
            Math.max(
                paddle.w/2,
                Math.min(
                    W-paddle.w/2,
                    paddle.targetX
                )
            );
    }
);


/* =========================================================
   COLLISION
========================================================= */

function circleRectCollision(
    circle,
    rect
){

    const closestX =
        Math.max(
            rect.x,
            Math.min(
                circle.x,
                rect.x+rect.w
            )
        );


    const closestY =
        Math.max(
            rect.y,
            Math.min(
                circle.y,
                rect.y+rect.h
            )
        );


    const dx =
        circle.x -
        closestX;


    const dy =
        circle.y -
        closestY;


    return (
        dx*dx +
        dy*dy
    ) <=
    circle.r *
    circle.r;
}


/* =========================================================
   BALL UPDATE
========================================================= */

function updateBall(dt){

    const oldX =
        ball.x;

    const oldY =
        ball.y;


    ball.x +=
        ball.vx *
        dt *
        60;


    ball.y +=
        ball.vy *
        dt *
        60;


    /*
     * Left
     */

    if(
        ball.x-ball.r <= 0
    ){

        ball.x =
            ball.r;

        ball.vx =
            Math.abs(
                ball.vx
            );

        createBurst(
            ball.x,
            ball.y,
            5
        );
    }


    /*
     * Right
     */

    if(
        ball.x+ball.r >= W
    ){

        ball.x =
            W-ball.r;

        ball.vx =
            -Math.abs(
                ball.vx
            );

        createBurst(
            ball.x,
            ball.y,
            5
        );
    }


    /*
     * Top
     */

    if(
        ball.y-ball.r <= 64
    ){

        ball.y =
            64+ball.r;

        ball.vy =
            Math.abs(
                ball.vy
            );

        createBurst(
            ball.x,
            ball.y,
            5
        );
    }


    /*
     * Paddle
     */

    const paddleRect = {

        x:
            paddle.x -
            paddle.w/2,

        y:
            paddle.y,

        w:
            paddle.w,

        h:
            paddle.h
    };


    if(
        ball.vy > 0 &&
        circleRectCollision(
            ball,
            paddleRect
        )
    ){

        ball.y =
            paddle.y -
            ball.r;


        /*
         * زاوية الكرة حسب
         * مكان الضربة
         */

        const hit =
            (
                ball.x -
                paddle.x
            ) /
            (paddle.w/2);


        const maxAngle =
            Math.PI*.43;


        const angle =
            hit *
            maxAngle -
            Math.PI/2;


        const speed =
            getBallSpeed();


        ball.vx =
            Math.cos(angle) *
            speed;


        ball.vy =
            Math.sin(angle) *
            speed;


        createBurst(
            ball.x,
            paddle.y,
            10
        );
    }


    /*
     * Bricks
     */

    for(
        const brick of bricks
    ){

        if(!brick.alive){
            continue;
        }


        if(
            circleRectCollision(
                ball,
                brick
            )
        ){

            /*
             * اتجاه الارتداد
             */

            if(
                oldY+ball.r <=
                brick.y
            ){

                ball.y =
                    brick.y -
                    ball.r;

                ball.vy =
                    -Math.abs(
                        ball.vy
                    );

            }else if(
                oldY-ball.r >=
                brick.y +
                brick.h
            ){

                ball.y =
                    brick.y +
                    brick.h +
                    ball.r;

                ball.vy =
                    Math.abs(
                        ball.vy
                    );

            }else if(
                oldX+ball.r <=
                brick.x
            ){

                ball.x =
                    brick.x -
                    ball.r;

                ball.vx =
                    -Math.abs(
                        ball.vx
                    );

            }else{

                ball.x =
                    brick.x +
                    brick.w +
                    ball.r;

                ball.vx =
                    Math.abs(
                        ball.vx
                    );
            }


            /*
             * كل اصطدام = 10
             */

            addScore(10);


            brick.hp--;


            createBurst(
                ball.x,
                ball.y,
                18
            );


            screenShake =
                Math.min(
                    7,
                    screenShake+2
                );


            flash =
                .35;


            /*
             * كسر البلوك
             */

            if(
                brick.hp <= 0
            ){

                brick.alive =
                    false;

                /*
                 * مكافأة كسر كامل
                 */

                addScore(10);
            }


            break;
        }
    }


    /*
     * سقوط الكرة
     */

    if(
        ball.y-ball.r > H
    ){

        endGame(
            "سقطت الكرة"
        );
    }
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(!running){
        return;
    }


    gameTime =
        (
            performance.now() -
            startTime
        ) / 1000;


    timeEl.textContent =
        gameTime.toFixed(1) +
        "s";


    /*
     * حركة Paddle
     */

    paddle.x +=
        (
            paddle.targetX -
            paddle.x
        ) *
        Math.min(
            1,
            dt*18
        );


    updateBall(dt);

    updateParticles(dt);


    if(
        screenShake > 0
    ){

        screenShake -=
            dt*18;
    }


    if(
        flash > 0
    ){

        flash -=
            dt*2;
    }


    /*
     * كل البلوكات خلصت
     */

    if(
        bricks.length > 0 &&
        bricks.every(
            b => !b.alive
        )
    ){

        level++;

        levelEl.textContent =
            String(level);

        buildBricks();

        resetBall();

        showToast(
            "❄️ Level " +
            level +
            " بدأ!"
        );

        flash = 1;
    }
}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

    ctx.fillStyle =
        "#010817";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
     * Stars
     */

    for(
        const star of stars
    ){

        const x =
            star.x * W;

        const y =
            star.y * H;


        ctx.globalAlpha =
            star.alpha *
            (
                .5 +
                .5 *
                Math.sin(
                    performance.now()/1000 +
                    star.x*10
                )
            );


        ctx.fillStyle =
            "#78ddff";


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            star.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    ctx.globalAlpha =
        1;


    /*
     * Blue Frost Glow
     */

    const glow =
        ctx.createRadialGradient(
            W/2,
            H*.48,
            10,
            W/2,
            H*.48,
            H*.72
        );


    glow.addColorStop(
        0,
        "rgba(0,110,255,.10)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        glow;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   BORDER
========================================================= */

function drawBorder(){

    ctx.save();


    ctx.shadowColor =
        "#008cff";

    ctx.shadowBlur =
        16;


    ctx.strokeStyle =
        "#008cff";

    ctx.lineWidth =
        2;


    ctx.strokeRect(
        7,
        7,
        W-14,
        H-14
    );


    ctx.shadowBlur =
        5;


    ctx.strokeStyle =
        "rgba(0,220,255,.65)";

    ctx.lineWidth =
        1;


    ctx.strokeRect(
        11,
        11,
        W-22,
        H-22
    );


    ctx.restore();
}


/* =========================================================
   DRAW BRICKS
========================================================= */

function drawBricks(){

    for(
        const brick of bricks
    ){

        if(!brick.alive){
            continue;
        }


        const health =
            brick.hp /
            brick.maxHp;


        const gradient =
            ctx.createLinearGradient(
                brick.x,
                brick.y,
                brick.x,
                brick.y +
                brick.h
            );


        gradient.addColorStop(
            0,
            health >= 1
                ? "#54f4ff"
                : "#1595ff"
        );


        gradient.addColorStop(
            .5,
            "#087bff"
        );


        gradient.addColorStop(
            1,
            "#0739b9"
        );


        ctx.save();


        ctx.shadowColor =
            "#008cff";

        ctx.shadowBlur =
            12;


        ctx.fillStyle =
            gradient;


        ctx.beginPath();

        ctx.roundRect(
            brick.x,
            brick.y,
            brick.w,
            brick.h,
            3
        );

        ctx.fill();


        ctx.restore();


        /*
         * Highlight
         */

        ctx.fillStyle =
            "rgba(255,255,255,.25)";


        ctx.fillRect(
            brick.x+3,
            brick.y+2,
            brick.w-6,
            2
        );


        /*
         * Strong Brick
         */

        if(
            brick.hp > 1
        ){

            ctx.fillStyle =
                "rgba(255,255,255,.8)";

            ctx.font =
                "10px Arial";

            ctx.textAlign =
                "center";

            ctx.fillText(
                "❄",
                brick.x +
                brick.w/2,
                brick.y+14
            );
        }
    }
}


/* =========================================================
   DRAW PADDLE
========================================================= */

function drawPaddle(){

    const x =
        paddle.x -
        paddle.w/2;


    ctx.save();


    ctx.shadowColor =
        "#00cfff";

    ctx.shadowBlur =
        18;


    const gradient =
        ctx.createLinearGradient(
            x,
            paddle.y,
            x,
            paddle.y +
            paddle.h
        );


    gradient.addColorStop(
        0,
        "#e0ffff"
    );


    gradient.addColorStop(
        .35,
        "#36eaff"
    );


    gradient.addColorStop(
        1,
        "#0078ff"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.roundRect(
        x,
        paddle.y,
        paddle.w,
        paddle.h,
        4
    );

    ctx.fill();


    ctx.restore();
}


/* =========================================================
   DRAW BALL
========================================================= */

function drawBall(){

    /*
     * Glow
     */

    const glow =
        ctx.createRadialGradient(
            ball.x,
            ball.y,
            1,
            ball.x,
            ball.y,
            25
        );


    glow.addColorStop(
        0,
        "rgba(100,245,255,.95)"
    );


    glow.addColorStop(
        .25,
        "rgba(0,180,255,.65)"
    );


    glow.addColorStop(
        1,
        "rgba(0,100,255,0)"
    );


    ctx.fillStyle =
        glow;


    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        25,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
     * الكرة
     */

    ctx.save();


    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur =
        18;


    ctx.fillStyle =
        "#e5ffff";


    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );


        ctx.fillStyle =
            "#70eaff";


        ctx.shadowColor =
            "#00cfff";

        ctx.shadowBlur =
            8;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    ctx.globalAlpha =
        1;
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    ctx.save();


    let shakeX = 0;
    let shakeY = 0;


    if(
        screenShake > 0
    ){

        shakeX =
            (
                Math.random()-.5
            ) *
            screenShake;


        shakeY =
            (
                Math.random()-.5
            ) *
            screenShake;
    }


    ctx.translate(
        shakeX,
        shakeY
    );


    drawBackground();

    drawBorder();

    drawBricks();

    drawPaddle();

    drawBall();

    drawParticles();


    /*
     * Flash
     */

    if(
        flash > 0
    ){

        ctx.globalAlpha =
            Math.min(
                .2,
                flash*.2
            );


        ctx.fillStyle =
            "#cfffff";


        ctx.fillRect(
            0,
            0,
            W,
            H
        );


        ctx.globalAlpha =
            1;
    }


    ctx.restore();
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now){

    if(!running){
        return;
    }


    const dt =
        Math.min(
            .033,
            (
                now -
                lastTime
            ) / 1000
        );


    lastTime =
        now;


    update(dt);

    render();


    animationId =
        requestAnimationFrame(
            gameLoop
        );
}


/* =========================================================
   BEGIN ROUND
========================================================= */

function beginRound(){

    score = 0;

    level = 1;

    gameTime = 0;


    scoreEl.textContent =
        "000000";

    levelEl.textContent =
        "1";

    timeEl.textContent =
        "0.0s";


    paddle.w =
        82;

    paddle.x =
        W/2;

    paddle.targetX =
        W/2;


    particles =
        [];


    buildBricks();

    resetBall();


    overlay.classList.add(
        "hidden"
    );


    running =
        true;


    startTime =
        performance.now();

    lastTime =
        performance.now();


    if(animationId){

        cancelAnimationFrame(
            animationId
        );
    }


    animationId =
        requestAnimationFrame(
            gameLoop
        );
}


/* =========================================================
   START REQUEST
========================================================= */

async function startGameRequest(){

    /*
     * منع الضغط مرتين
     */

    if(
        running ||
        saving
    ){

        return;
    }


    saving =
        true;


    startBtn.disabled =
        true;

    startBtn.textContent =
        "⏳ جاري تجهيز الجولة...";


    try{

        /*
         * لو الحساب مش جاهز
         * نحاول تحميله الآن
         */

        if(
            !user ||
            !diamondField
        ){

            const loaded =
                await initUser();


            if(!loaded){

                showToast(
                    "⚠️ لم يتم العثور على حسابك"
                );

                return;
            }
        }


        /*
         * الرصيد الحالي
         */

        const balance =
            Number(
                user[diamondField] ||
                0
            );


        /*
         * لازم 1 ألماسة
         */

        if(
            balance < 1
        ){

            if(
                tg &&
                typeof tg.showAlert ===
                "function"
            ){

                tg.showAlert(
                    "⚠️ ليس لديك ألماسات كافية!\n\n" +
                    "يلزمك 1 💎 لبدء الجولة."
                );

            }else{

                showToast(
                    "⚠️ يلزمك 1 💎 لبدء الجولة"
                );
            }

            return;
        }


        /*
         * إعلان كل 3 جولات مكتملة
         */

        if(
            completedRounds > 0 &&
            completedRounds % 3 === 0
        ){

            startBtn.textContent =
                "📺 جاري تحميل الإعلان...";


            await showAd();


            completedRounds =
                0;


            localStorage.setItem(
                "frost_breakout_rounds",
                "0"
            );
        }


        /*
         * خصم 1 💎
         */

        const paid =
            await changeDiamonds(
                -1,
                "بدء جولة Frost Breakout"
            );


        if(!paid){

            showToast(
                "⚠️ تعذر خصم الألماسة"
            );

            return;
        }


        /*
         * بداية اللعبة
         */

        beginRound();

    }catch(error){

        console.error(
            "START ERROR:",
            error
        );


        if(
            tg &&
            typeof tg.showAlert ===
            "function"
        ){

            tg.showAlert(
                "⚠️ حصل خطأ أثناء بدء الجولة.\nحاول مرة أخرى."
            );

        }else{

            showToast(
                "⚠️ حصل خطأ أثناء بدء الجولة"
            );
        }

    }finally{

        saving =
            false;


        if(!running){

            startBtn.disabled =
                false;

            startBtn.textContent =
                "🎮 ابدأ الجولة — 1 💎";
        }
    }
}


/* =========================================================
   END GAME
========================================================= */

async function endGame(reason){

    if(!running){
        return;
    }


    running =
        false;


    if(animationId){

        cancelAnimationFrame(
            animationId
        );

        animationId =
            null;
    }


    /*
     * حساب المكافأة
     *
     * كل 100 Score = 1 💎
     *
     * ويتم التحويل مرة واحدة
     * في نهاية الجولة
     */

    const earned =
        Math.floor(
            score / 100
        );


    /*
     * جولة مكتملة
     */

    completedRounds++;


    localStorage.setItem(
        "frost_breakout_rounds",
        String(
            completedRounds
        )
    );


    saving =
        true;


    try{

        let rewardText =
            "لم تحقق 100 Score بعد.";


        if(
            earned > 0
        ){

            const rewarded =
                await changeDiamonds(
                    earned,
                    "مكافأة Frost Breakout"
                );


            if(rewarded){

                rewardText =
                    "🎉 حصلت على " +
                    earned +
                    " 💎";
            }else{

                rewardText =
                    "⚠️ تعذر حفظ المكافأة";
            }
        }


        showGameOver(
            reason,
            earned,
            rewardText
        );

    }catch(error){

        console.error(
            "END GAME ERROR:",
            error
        );


        showGameOver(
            reason,
            earned,
            "⚠️ تعذر حفظ المكافأة"
        );

    }finally{

        saving =
            false;
    }
}

    const retryBtn =
        document.getElementById(
            "retryBtn"
        );


    const gameBackBtn =
        document.getElementById(
            "gameBackBtn"
        );


    if(retryBtn){

        retryBtn.onclick =
            startGameRequest;
    }


    if(gameBackBtn){

        gameBackBtn.onclick =
            goBack;
    }


    updateDiamondUI();
}


/* =========================================================
   GO BACK
========================================================= */

function goBack(){

    /*
     * لا نعتمد على Supabase
     * علشان زر الرجوع يشتغل دائمًا
     */

    let id =
        uid;


    if(!id){

        id =
            new URLSearchParams(
                window.location.search
            ).get("id");
    }


    if(!id){

        id =
            localStorage.getItem(
                "telegram_id"
            );
    }


    /*
     * حتى لو مفيش ID
     * الصفحة هتفتح عادي
     */

    const target =
        "../games.html" +
        (
            id
                ? "?id=" +
                  encodeURIComponent(id)
                : ""
        );


    window.location.href =
        target;
}


/* =========================================================
   BUTTON EVENTS
========================================================= */

/*
 * مهم:
 * ربط الأزرار هنا مباشرة
 * قبل تحميل الحساب
 */

startBtn.onclick =
    function(){

        startGameRequest();
    };


backBtn.onclick =
    function(){

        goBack();
    };


/* =========================================================
   INITIAL LOAD
========================================================= */

/*
 * نحاول تحميل الحساب في الخلفية.
 *
 * حتى لو فشل:
 * الزرار يفضل شغال.
 */

(async function(){

    try{

        const loaded =
            await initUser();


        if(loaded){

            updateDiamondUI();

            startBtn.textContent =
                "🎮 ابدأ الجولة — 1 💎";

        }else{

            /*
             * لا نعطل الزر
             */

            startBtn.disabled =
                false;

            startBtn.textContent =
                "🎮 ابدأ الجولة — 1 💎";

            console.warn(
                "User will be loaded on start"
            );
        }

    }catch(error){

        console.error(
            "INITIALIZATION ERROR:",
            error
        );


        startBtn.disabled =
            false;

        startBtn.textContent =
            "🎮 ابدأ الجولة — 1 💎";
    }

})();

</script>
