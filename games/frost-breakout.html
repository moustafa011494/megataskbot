/* =========================================================
   FX

let particles = [];
let stars = [];

for(let i=0;i<90;i++){

/* =========================================================
   RESIZE
========================================================= */

function resize(){

    const rect = canvas.getBoundingClientRect();

    dpr = Math.min(window.devicePixelRatio || 1,2);

    canvas.width = rect.width*dpr;
    canvas.height = rect.height*dpr;

    W = rect.width;
    H = rect.height;

    ctx.setTransform(dpr,0,0,dpr,0,0);

    paddle.y = H - 55;

    if(!running){
        paddle.x = W/2;
        paddle.targetX = W/2;

        ball.x = W/2;
        ball.y = H - 90;
    }
}

window.addEventListener("resize",resize);
resize();

/* =========================================================
   USER LOOKUP
========================================================= */

async function initUser(){

    try{

        let tid =
            new URLSearchParams(location.search).get("id");

        if(!tid && tg?.initDataUnsafe?.user?.id){
            tid = String(tg.initDataUnsafe.user.id);
        }

        if(!tid){
            tid = localStorage.getItem("telegram_id");
        }

        if(!tid){

            const {data} = await supabase
                .from("users")
                .select("*")
                .order("created_at",{ascending:false})
                .limit(1)
                .maybeSingle();

            if(data){
                tid = String(data.telegram_id);
            }
        }

        if(!tid){
            throw new Error("NO TELEGRAM ID");
        }

        let result =
            await supabase
                .from("users")
                .select("*")
                .eq("telegram_id",String(tid))
                .maybeSingle();

        user = result.data;

        if(!user){

            const numericId = Number(tid);

            if(Number.isFinite(numericId)){

                result =
                    await supabase
                        .from("users")
                        .select("*")
                        .eq("telegram_id",numericId)
                        .maybeSingle();

                user = result.data;
            }
        }

        if(!user){

            const result2 =
                await supabase
                    .from("users")
                    .select("*")
                    .limit(1)
                    .maybeSingle();

            user = result2.data;
        }

        if(!user){
            throw new Error("USER NOT FOUND");
        }

        uid = String(user.telegram_id);

        localStorage.setItem("telegram_id",uid);

        if(
            Object.prototype.hasOwnProperty.call(user,"gamepoints")
        ){
            gp = "gamepoints";
        }
        else if(
            Object.prototype.hasOwnProperty.call(user,"diamonds")
        ){
            gp = "diamonds";
        }
        else{
            throw new Error("DIAMOND FIELD NOT FOUND");
        }

        updateDiamondUI();

        console.log("USER:",uid);
        console.log("DIAMOND FIELD:",gp);
        console.log("DIAMONDS:",Number(user[gp] || 0));

        return true;

    }catch(e){

        console.error("USER INIT ERROR:",e);

        return false;
    }
}

/* =========================================================
   DIAMOND UI
========================================================= */

function updateDiamondUI(){

    const value =
        Number(user?.[gp] || 0);

    diamondsEl.textContent =
        "💎 " + value;
}

/* =========================================================
   CHANGE DIAMONDS
========================================================= */

async function changeDiamonds(amount,title){

    if(!user || !gp){
        return false;
    }

    const oldValue =
        Number(user[gp] || 0);

    const newValue =
        Math.max(0,oldValue + amount);

    try{

        const {data,error} =
            await supabase
                .from("users")
                .update({
                    [gp]:newValue
                })
                .eq("telegram_id",user.telegram_id)
                .select("*")
                .maybeSingle();

        if(error){
            console.error("DIAMOND UPDATE:",error);
            return false;
        }

        if(data){
            user = data;
        }else{
            user[gp] = newValue;
        }

        updateDiamondUI();

        try{

            await supabase
                .from("transactions")
                .insert({
                    telegram_id:String(user.telegram_id),
                    type:"points",
                    title:title,
                    amount:
                        (amount > 0 ? "+" : "") +
                        amount +
                        " 💎",
                    status:"مكتمل"
                });

        }catch(txError){

            console.warn(
                "TRANSACTION ERROR:",
                txError
            );
        }

        return true;

    }catch(e){

        console.error("CHANGE DIAMONDS:",e);
        return false;
    }
}

   TOAST
========================================================= */

function toast(text){

    toastEl.classList.add("show");

    toastTimer =

/* =========================================================
   NEXT AD
========================================================= */

async function checkRoundAd(){

    if(

    ){

/* =========================================================
   BUILD BRICKS
========================================================= */

function buildBricks(){

    bricks = [];

    const cols =
        brickConfig.cols;

    const rows =
        Math.min(
            4 + Math.floor((level-1)/2),
            8
        );

    const totalWidth =
        cols * brickConfig.w +
        (cols-1) * brickConfig.gap;

    const startX =
        (W-totalWidth)/2;

    for(let r=0;r<rows;r++){

        for(let c=0;c<cols;c++){

            /*
             * في المستويات الأعلى نعمل
             * تشكيلات أصعب بدل شبكة ثابتة.
             */

            let exists = true;

            if(level >= 3){

                if(
                    (r+c+level)%5 === 0 &&
                    r > 0
                ){
                    exists = false;
                }
            }

            if(level >= 5){

                if(
                    c === 0 ||
                    c === cols-1
                ){
                    exists = r % 2 === 0;
                }
            }

            if(!exists) continue;

            bricks.push({

                x:
                    startX +
                    c *
                    (brickConfig.w +
                     brickConfig.gap),

                y:
                    brickConfig.top +
                    r *
                    (brickConfig.h +
                     brickConfig.gap),

                w:brickConfig.w,
                h:brickConfig.h,

                hp:
                    level >= 5 &&
                    (r+c)%4===0
                    ? 2
                    : 1,

                maxHp:
                    level >= 5 &&
                    (r+c)%4===0
                    ? 2
                    : 1,

                alive:true

            });
        }
    }
}

/* =========================================================
   RESET BALL
========================================================= */

function resetBall(){

    ball.x = W/2;
    ball.y = H - 90;

    const angle =
        (-Math.PI/2) +
        (Math.random()-.5)*.8;

    const speed =
        getBallSpeed();

    ball.speed = speed;

    ball.vx =
        Math.cos(angle)*speed;

    ball.vy =
        Math.sin(angle)*speed;
}

/* =========================================================
   DIFFICULTY
========================================================= */

function getBallSpeed(){

    /*
     * السرعة تزيد كل 100 نقطة.
     */

    const difficulty =
        Math.floor(score/100);

    return Math.min(
        12,
        5.4 +
        difficulty*.28
    );
}

function updateDifficulty(){

    /*
     * Level كل 300 Score
     */

    const newLevel =
        1 +
        Math.floor(score/300);

    if(newLevel !== level){

        level = newLevel;

        buildBricks();

        toast(
            "❄️ LEVEL " + level +
            " — السرعة زادت!"
        );

        flash = 1;
    }

    const targetSpeed =
        getBallSpeed();

    const currentSpeed =
        Math.hypot(
            ball.vx,
            ball.vy
        );

    if(currentSpeed > 0){

        const factor =
            targetSpeed/currentSpeed;

        ball.vx *= factor;
        ball.vy *= factor;
    }

    /*
     * الـPaddle تضيق تدريجيًا.
     */

    paddle.w =
        Math.max(
            55,
            82 -
            Math.floor(score/250)*3
        );
}

/* =========================================================
   SCORE
========================================================= */

function addScore(points){

    score += points;

    scoreEl.textContent =
        String(score).padStart(6,"0");

    updateDifficulty();
}

/* =========================================================
   PARTICLES
========================================================= */

function burst(x,y,count=12){

    for(let i=0;i<count;i++){

        const a =
            Math.random()*Math.PI*2;

        const speed =
            Math.random()*3+1;

        particles.push({

            x:x,
            y:y,

            vx:Math.cos(a)*speed,
            vy:Math.sin(a)*speed,

            life:1,

            size:
                Math.random()*3+1
        });
    }
}

function updateParticles(dt){

    for(let i=particles.length-1;i>=0;i--){

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vy += .04;

        p.life -= dt*2;

        if(p.life <= 0){
            particles.splice(i,1);
        }
    }
}

/* =========================================================
   INPUT
========================================================= */

function movePaddle(clientX){

    const rect =
        canvas.getBoundingClientRect();

    const x =
        clientX -
        rect.left;

    paddle.targetX =
        Math.max(
            paddle.w/2,
            Math.min(
                W-paddle.w/2,
                x
            )
        );
}

canvas.addEventListener(
    "pointermove",
    e=>{
        movePaddle(e.clientX);
    }
);

canvas.addEventListener(
    "pointerdown",
    e=>{
        movePaddle(e.clientX);
    }
);

canvas.addEventListener(
    "touchmove",
    e=>{

        if(e.touches[0]){
            movePaddle(
                e.touches[0].clientX
            );
        }

        e.preventDefault();

    },
    {passive:false}
);

window.addEventListener(
    "keydown",
    e=>{

        if(!running) return;

        if(e.key === "ArrowLeft"){
            paddle.targetX -= 45;
        }

        if(e.key === "ArrowRight"){
            paddle.targetX += 45;
        }

        paddle.targetX =
            Math.max(
                paddle.w/2,
                Math.min(
                    W-paddle.w/2,
                    paddle.targetX
                )
            );
    }
);

/* =========================================================
   COLLISION
========================================================= */

function circleRectCollision(circle,rect){

    const closestX =
        Math.max(
            rect.x,
            Math.min(
                circle.x,
                rect.x+rect.w
            )
        );

    const closestY =
        Math.max(
            rect.y,
            Math.min(
                circle.y,
                rect.y+rect.h
            )
        );

    const dx =
        circle.x-closestX;

    const dy =
        circle.y-closestY;

    return dx*dx+dy*dy <=
        circle.r*circle.r;
}

/* =========================================================
   BALL UPDATE
========================================================= */

function updateBall(dt){

    const oldX = ball.x;
    const oldY = ball.y;

    ball.x += ball.vx * dt * 60;
    ball.y += ball.vy * dt * 60;

    /*
     * Left / Right walls
     */

    if(ball.x-ball.r <= 0){

        ball.x = ball.r;
        ball.vx = Math.abs(ball.vx);

        burst(ball.x,ball.y,5);
    }

    if(ball.x+ball.r >= W){

        ball.x = W-ball.r;
        ball.vx = -Math.abs(ball.vx);

        burst(ball.x,ball.y,5);
    }

    /*
     * Top
     */

    if(ball.y-ball.r <= 65){

        ball.y = 65+ball.r;
        ball.vy = Math.abs(ball.vy);

        burst(ball.x,ball.y,5);
    }

    /*
     * Paddle
     */

    const paddleRect = {

        x:paddle.x-paddle.w/2,
        y:paddle.y,
        w:paddle.w,
        h:paddle.h

    };

    if(
        ball.vy > 0 &&
        circleRectCollision(
            ball,
            paddleRect
        )
    ){

        ball.y =
            paddle.y-ball.r;

        /*
         * مكان الضربة على الـPaddle
         * يغير زاوية الكرة.
         */

        const hit =
            (ball.x-paddle.x) /
            (paddle.w/2);

        const maxAngle =
            Math.PI*.43;

        const angle =
            hit*maxAngle -
            Math.PI/2;

        const speed =
            getBallSpeed();

        ball.vx =
            Math.cos(angle)*speed;

        ball.vy =
            Math.sin(angle)*speed;

        burst(
            ball.x,
            paddle.y,
            10
        );
    }

    /*
     * Bricks
     */

    for(const brick of bricks){

        if(!brick.alive) continue;

        if(
            circleRectCollision(
                ball,
                brick
            )
        ){

            /*
             * تحديد اتجاه الارتداد
             */

            if(oldY+ball.r <= brick.y){

                ball.y =
                    brick.y-ball.r;

                ball.vy =
                    -Math.abs(ball.vy);

            }
            else if(oldY-ball.r >= brick.y+brick.h){

                ball.y =
                    brick.y+
                    brick.h+
                    ball.r;

                ball.vy =
                    Math.abs(ball.vy);

            }
            else if(oldX+ball.r <= brick.x){

                ball.x =
                    brick.x-ball.r;

                ball.vx =
                    -Math.abs(ball.vx);

            }
            else{

                ball.x =
                    brick.x+
                    brick.w+
                    ball.r;

                ball.vx =
                    Math.abs(ball.vx);
            }

            brick.hp--;

            /*
             * كل ضربة = 10 Score
             */

            addScore(10);

            burst(
                ball.x,
                ball.y,
                18
            );

            screenShake =
                Math.min(
                    7,
                    screenShake+2
                );

            flash = .35;

            if(brick.hp <= 0){

                brick.alive = false;

                addScore(10);

            }

            break;
        }
    }

    /*
     * سقوط الكرة
     */

    if(ball.y-ball.r > H){

        endGame("سقطت الكرة");
    }
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(!running) return;

    gameTime =
        (performance.now()-startTime)/1000;

    timeEl.textContent =
        gameTime.toFixed(1)+"s";

    /*
     * حركة الـPaddle بسلاسة
     */

    paddle.x +=
        (paddle.targetX-paddle.x) *
        Math.min(1,dt*18);

    updateBall(dt);

    updateParticles(dt);

    if(screenShake > 0){
        screenShake -= dt*18;
    }

    if(flash > 0){
        flash -= dt*2;
    }

    /*
     * لو خلصنا كل البلوكات:
     * مستوى جديد.
     */

    if(
        bricks.length > 0 &&
        bricks.every(b=>!b.alive)
    ){

        level++;

        buildBricks();

        resetBall();

        toast(
            "❄️ مستوى جديد! Level "+level
        );

        flash = 1;
    }
}

/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

    ctx.fillStyle = "#010817";
    ctx.fillRect(0,0,W,H);

    /*
     * Stars
     */

    for(const s of stars){

        const x = s.x*W;
        const y = s.y*H;

        ctx.globalAlpha =
            s.a *
            (.5+
             .5*Math.sin(
                performance.now()/1000+s.x*10
             ));

        ctx.fillStyle="#79dfff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            s.s,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;

    /*
     * Frost glow
     */

    const g =
        ctx.createRadialGradient(
            W/2,
            H*.52,
            10,
            W/2,
            H*.52,
            H*.7
        );

    g.addColorStop(
        0,
        "rgba(0,100,255,.09)"
    );

    g.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=g;

    ctx.fillRect(0,0,W,H);
}

/* =========================================================
   DRAW BORDER
========================================================= */

function drawBorder(){

    ctx.save();

    ctx.shadowColor="#008cff";
    ctx.shadowBlur=16;

    ctx.strokeStyle="#008cff";
    ctx.lineWidth=2;

    ctx.strokeRect(
        7,
        7,
        W-14,
        H-14
    );

    ctx.shadowBlur=5;

    ctx.strokeStyle=
        "rgba(0,220,255,.65)";

    ctx.lineWidth=1;

    ctx.strokeRect(
        11,
        11,
        W-22,
        H-22
    );

    ctx.restore();
}

/* =========================================================
   DRAW BRICKS
========================================================= */

function drawBricks(){

    for(const b of bricks){

        if(!b.alive) continue;

        const ratio =
            b.hp/b.maxHp;

        const grad =
            ctx.createLinearGradient(
                b.x,
                b.y,
                b.x,
                b.y+b.h
            );

        grad.addColorStop(
            0,
            ratio >= 1
                ? "#43efff"
                : "#168fff"
        );

        grad.addColorStop(
            .45,
            "#087cff"
        );

        grad.addColorStop(
            1,
            "#0737bb"
        );

        ctx.save();

        ctx.shadowColor="#008cff";
        ctx.shadowBlur=12;

        ctx.fillStyle=grad;

        ctx.beginPath();

        ctx.roundRect(
            b.x,
            b.y,
            b.w,
            b.h,
            3
        );

        ctx.fill();

        ctx.restore();

        /*
         * Frost highlight
         */

        ctx.fillStyle=
            "rgba(255,255,255,.25)";

        ctx.fillRect(
            b.x+3,
            b.y+2,
            b.w-6,
            2
        );

        if(b.hp > 1){

            ctx.fillStyle=
                "rgba(255,255,255,.75)";

            ctx.font="9px Arial";

            ctx.textAlign="center";

            ctx.fillText(
                "❄",
                b.x+b.w/2,
                b.y+13
            );
        }
    }
}

/* =========================================================
   DRAW PADDLE
========================================================= */

function drawPaddle(){

    const x =
        paddle.x-paddle.w/2;

    ctx.save();

    ctx.shadowColor="#00cfff";
    ctx.shadowBlur=18;

    const grad =
        ctx.createLinearGradient(
            x,
            paddle.y,
            x,
            paddle.y+paddle.h
        );

    grad.addColorStop(
        0,
        "#d9ffff"
    );

    grad.addColorStop(
        .35,
        "#35eaff"
    );

    grad.addColorStop(
        1,
        "#0078ff"
    );

    ctx.fillStyle=grad;

    ctx.beginPath();

    ctx.roundRect(
        x,
        paddle.y,
        paddle.w,
        paddle.h,
        4
    );

    ctx.fill();

    ctx.restore();
}

/* =========================================================
   DRAW BALL
========================================================= */

function drawBall(){

    const glow =
        ctx.createRadialGradient(
            ball.x,
            ball.y,
            1,
            ball.x,
            ball.y,
            24
        );

    glow.addColorStop(
        0,
        "rgba(80,240,255,.95)"
    );

    glow.addColorStop(
        .25,
        "rgba(0,170,255,.65)"
    );

    glow.addColorStop(
        1,
        "rgba(0,100,255,0)"
    );

    ctx.fillStyle=glow;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        24,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.save();

    ctx.shadowColor="#00eaff";
    ctx.shadowBlur=18;

    ctx.fillStyle="#dfffff";

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}

/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha =
            Math.max(0,p.life);

        ctx.fillStyle="#6eeaff";

        ctx.shadowColor="#00cfff";
        ctx.shadowBlur=8;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;
}

/* =========================================================
   DRAW
========================================================= */

function render(){

    ctx.save();

    let shakeX=0;
    let shakeY=0;

    if(screenShake > 0){

        shakeX =
            (Math.random()-.5) *
            screenShake;

        shakeY =
            (Math.random()-.5) *
            screenShake;
    }

    ctx.translate(
        shakeX,
        shakeY
    );

    drawBackground();
    drawBorder();
    drawBricks();
    drawPaddle();
    drawBall();
    drawParticles();

    if(flash > 0){

        ctx.globalAlpha =
            Math.min(.2,flash*.2);

        ctx.fillStyle="#bfffff";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.globalAlpha=1;
    }

    ctx.restore();
}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

    if(!running){
        return;
    }

    const dt =
        Math.min(
            .033,
            (now-lastTime)/1000
        );

    lastTime = now;

    update(dt);
    render();

    animationId =
        requestAnimationFrame(loop);
}

/* =========================================================
   START GAME
========================================================= */

async function startGameRequest(){

    if(running || saving){
        return;
    }

    saving=true;

    startBtn.disabled=true;
    startBtn.textContent=
        "⏳ جاري تجهيز الجولة...";

    try{

        /*
         * تأكد من الحساب
         */

        if(!user){

            const ok =
                await initUser();

            if(!ok){

                throw new Error(
                    "USER NOT FOUND"
                );
            }
        }

        const diamonds =
            Number(user[gp] || 0);

        /*
         * إعلان كل 3 جولات
         */

        if(
            rounds > 0 &&
            rounds % 3 === 0
        ){

            startBtn.textContent=
                "📺 جاري تحميل الإعلان...";

            await showAd();

            /*
             * نصفر العداد بعد الإعلان
             */

            rounds=0;

            localStorage.setItem(
                "frost_breakout_rounds",
                "0"
            );
        }

        /*
         * لازم 1 ألماسة
         */

        if(diamonds < 1){

            if(tg?.showAlert){

                tg.showAlert(
                    "⚠️ ليس لديك ألماسات كافية!\n\n" +
                    "يلزمك 1 💎 لبدء الجولة."
                );

            }else{

                alert(
                    "⚠️ يلزمك 1 💎 لبدء الجولة."
                );
            }

            return;
        }

        /*
         * خصم ألماسة البداية
         */

        const paid =
            await changeDiamonds(
                -1,
                "بدء جولة Frost Breakout"
            );

        if(!paid){

            throw new Error(
                "DIAMOND DEDUCTION FAILED"
            );
        }

        /*
         * بدء الجولة
         */

        beginRound();

    }catch(e){

        console.error(
            "START ERROR:",
            e
        );

        if(tg?.showAlert){

            tg.showAlert(
                "⚠️ تعذر بدء الجولة.\nحاول مرة أخرى."
            );

        }else{

            alert(
                "⚠️ تعذر بدء الجولة."
            );
        }

    }finally{

        saving=false;

        if(!running){

            startBtn.disabled=false;

            startBtn.textContent=
                "🎮 ابدأ الجولة — 1 💎";
        }
    }
}

/* =========================================================
   BEGIN ROUND
========================================================= */

function beginRound(){

    score=0;
    level=1;
    gameTime=0;

    scoreEl.textContent="000000";
    levelEl.textContent="1";
    timeEl.textContent="0.0s";

    paddle.w=82;
    paddle.x=W/2;
    paddle.targetX=W/2;

    particles=[];

    buildBricks();
    resetBall();

    overlay.classList.add("hidden");

    running=true;

    startTime=
        performance.now();

    lastTime=
        performance.now();

    if(animationId){
        cancelAnimationFrame(animationId);
    }

    animationId =
        requestAnimationFrame(loop);
}

/* =========================================================
   END GAME
========================================================= */

async function endGame(reason){

    if(!running){
        return;
    }

    running=false;

    if(animationId){

        cancelAnimationFrame(
            animationId
        );

        animationId=null;
    }

    /*
     * المكافأة:
     *
     * كل 100 Score = 1 💎
     *
     * التحويل في نهاية الجولة فقط.
     */

    const earned =
        Math.floor(score/100);

    rounds++;

    localStorage.setItem(
        "frost_breakout_rounds",
        String(rounds)
    );

    saving=true;

    try{

        let rewardMessage =
            "لا توجد ألماسات مكتسبة هذه الجولة.";

        if(earned > 0){

            const added =
                await changeDiamonds(
                    earned,
                    "مكافأة Frost Breakout"
                );

            if(added){

                rewardMessage =
                    "🎉 حصلت على " +
                    earned +
                    " 💎";
            }
        }

        showGameOver(
            reason,
            earned,
            rewardMessage
        );

    }catch(e){

        console.error(
            "GAME OVER SAVE:",
            e
        );

        showGameOver(
            reason,
            earned,
            "⚠️ تعذر حفظ المكافأة."
        );

    }finally{

        saving=false;
    }
}

/* =========================================================
   GAME OVER UI
========================================================= */

function showGameOver(
    reason,
    earned,
    rewardMessage
){

    overlay.classList.remove("hidden");

    const adNext =
        rounds > 0 &&
        rounds % 3 === 0;

    document.getElementById("panel").innerHTML = `

        <div class="logo">❄️</div>

        <h1>انتهت الجولة</h1>

        <div class="subtitle">
            ${reason}
        </div>

        <div class="info">

            <div>
                SCORE
                <b>${score}</b>
            </div>

            <div>
                LEVEL
                <b>${level}</b>
            </div>

            <div>
                وقت الجولة
                <b>${gameTime.toFixed(1)}s</b>
            </div>

            <div>
                المكافأة
                <b>+${earned} 💎</b>
            </div>

        </div>

        <div style="
            color:#8eeaff;
            font-size:13px;
            margin-bottom:14px;
        ">
            ${rewardMessage}
        </div>

        ${
            adNext
            ?
            `<div style="
                color:#ffc95c;
                font-size:12px;
                margin-bottom:12px;
            ">
                📺 الإعلان التالي سيكون بعد 3 جولات
                مكتملة
            </div>`
            :
            ""
        }

        <button id="retryBtn">
            🔄 جولة جديدة — 1 💎
        </button>

        <button class="secondary" id="backGameBtn">
            ← العودة للألعاب
        </button>
    `;

    document
        .getElementById("retryBtn")
        .onclick =
        startGameRequest;

    document
        .getElementById("backGameBtn")
        .onclick =
        goBack;

    levelEl.textContent =
        String(level);

    updateDiamondUI();
}

/* =========================================================
   BACK
========================================================= */

function goBack(){

    const id =
        uid ||
        new URLSearchParams(
            location.search
        ).get("id") ||
        localStorage.getItem(
            "telegram_id"
        );

    location.href =
        "../games.html?id=" +
        encodeURIComponent(id || "");
}

backBtn.onclick=goBack;

/* =========================================================
   START BUTTON
========================================================= */

startBtn.onclick =
    startGameRequest;

/* =========================================================
   INITIAL LOAD
========================================================= */

(async function(){

    const ok =
        await initUser();

    if(!ok){

        startBtn.textContent =
            "⚠️ تعذر تحميل الحساب";

        startBtn.disabled=true;

        toast(
            "⚠️ لم يتم العثور على حسابك"
        );

        return;
    }

    updateDiamondUI();

})();
</script>
