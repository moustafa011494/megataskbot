<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Space War Pro - MegaTask Arcade</title>

<!-- سكريبت إعلانات Monetag -->
<script src="https://libtl.com/sdk.js" data-zone="10959333" data-sdk="show_10959333"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
:root {
    --g: #00d26a;
    --cyan: #00f2ff;
    --gold: #ffaa00;
    --red: #ff3b30;
    --bg: #030508;
}
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: #fff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    touch-action: none;
}
canvas { display: block; width: 100vw; height: 100vh; background: #030508; }

/* الشريط العلوي أثناء اللعب */
.game-top-bar {
    position: absolute; top: 0; left: 0; width: 100%; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 15px;
    background: linear-gradient(180deg, rgba(3,5,8,0.92), transparent);
    pointer-events: none;
}
.hud-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.info-pill {
    background: rgba(18, 22, 30, 0.9);
    border: 1px solid rgba(0, 210, 106, 0.35);
    padding: 6px 11px; border-radius: 16px;
    font-size: 12px; font-weight: bold;
    box-shadow: 0 0 12px rgba(0, 210, 106, 0.12);
    display: flex; align-items: center; gap: 4px;
}
.info-pill.diamond-pill { border-color: rgba(0, 242, 255, 0.45); }
.info-pill.rounds-pill { border-color: rgba(255, 170, 0, 0.45); }

.exit-btn {
    pointer-events: auto;
    background: rgba(255, 59, 48, 0.18);
    border: 1px solid var(--red); color: #ff8882;
    padding: 6px 13px; border-radius: 14px;
    font-size: 12px; font-weight: bold; cursor: pointer;
}
.exit-btn:active { transform: scale(0.95); }

/* شريط تقدم الـ 10 نيازك لكسب ألماسة */
.meteor-progress-wrap {
    position: absolute; top: 54px; left: 15px; right: 15px; z-index: 10;
    pointer-events: none;
    display: flex; align-items: center; gap: 8px;
}
.meteor-bar-bg {
    flex: 1; height: 6px; background: rgba(255,255,255,0.1);
    border-radius: 10px; overflow: hidden; border: 1px solid rgba(0, 242, 255, 0.25);
}
.meteor-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--g), var(--cyan));
    transition: width 0.2s ease;
}
.meteor-bar-txt { font-size: 10px; color: var(--cyan); font-weight: bold; white-space: nowrap; }

/* إشعار طائر غير معطل للعب عند كسب ألماسة أو درع */
#floating-toast {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    z-index: 15; pointer-events: none;
    background: rgba(0, 210, 106, 0.2); border: 1px solid var(--g);
    color: #fff; padding: 6px 16px; border-radius: 20px;
    font-size: 12px; font-weight: bold;
    opacity: 0; transition: all 0.3s ease;
    box-shadow: 0 0 15px rgba(0, 210, 106, 0.4);
}

/* الواجهات (البداية والنهاية) */
.overlay {
    position: absolute; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 22px; text-align: center;
    background: radial-gradient(circle at center, rgba(10, 22, 34, 0.95), rgba(3, 5, 8, 0.98));
}
.overlay h1 {
    color: var(--g); font-size: 28px; margin: 6px 0;
    text-shadow: 0 0 20px rgba(0, 210, 106, 0.45);
}
.overlay p {
    color: #9ca3af; font-size: 12.5px; line-height: 1.6;
    max-width: 320px; margin: 4px 0 15px;
}

.features-row {
    display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap;
}
.feat-badge {
    background: rgba(255,255,255,0.05); border: 1px solid #2d3442;
    padding: 5px 10px; border-radius: 10px; font-size: 11px; color: #cbd5e1;
}

.lb-box {
    background: rgba(20, 24, 33, 0.85);
    border: 1px solid #2d333f; border-radius: 16px;
    padding: 12px 14px; width: 100%; max-width: 300px;
    margin-bottom: 16px; font-size: 12px;
}
.lb-title { color: var(--gold); font-weight: bold; text-align: center; margin-bottom: 8px; font-size: 13px; }
.lb-row {
    display: flex; justify-content: space-between;
    padding: 5px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    color: #e5e7eb;
}
.lb-row:last-child { border-bottom: none; }

.btn-main {
    width: 100%; max-width: 280px; padding: 14px; border: 0;
    border-radius: 16px; font-size: 15px; font-weight: bold;
    cursor: pointer; background: linear-gradient(135deg, #00d26a, #009e4f);
    color: #001b0d; box-shadow: 0 5px 25px rgba(0, 210, 106, 0.35);
    transition: 0.2s; margin-bottom: 8px;
}
.btn-main:active { transform: scale(0.96); }
.btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-secondary {
    width: 100%; max-width: 280px; padding: 12px; border: 1px solid #333a48;
    border-radius: 14px; font-size: 13px; font-weight: bold;
    cursor: pointer; background: #1a1f29; color: #fff;
}
</style>
</head>

<body>

<!-- الشريط العلوي -->
<div class="game-top-bar">
    <div class="hud-badges">
        <div class="info-pill">🎯 <span id="score">0</span></div>
        <div class="info-pill diamond-pill">💎 <span id="diamonds" style="color: var(--cyan);">0</span></div>
        <div class="info-pill rounds-pill">🎮 <span id="rounds-hud" style="color: var(--gold);">0/30</span></div>
    </div>
    <button class="exit-btn" onclick="exitGame()">✖ خروج</button>
</div>

<!-- شريط تقدم الـ 10 نيازك للحصول على +1 ألماسة -->
<div class="meteor-progress-wrap">
    <span class="meteor-bar-txt" id="meteor-counter-txt">☄️ 0 / 10 للماسة</span>
    <div class="meteor-bar-bg">
        <div class="meteor-bar-fill" id="meteor-bar-fill"></div>
    </div>
</div>

<!-- إشعار طائر أثناء اللعب -->
<div id="floating-toast">☄️ +1 💎 ألماسة جديدة!</div>

<!-- شاشة البداية -->
<div id="start-screen" class="overlay">
    <div style="font-size: 52px;">🚀</div>
    <h1>حرب الفضاء</h1>
    <p>حرّك سفينتك لتفادي وتدمير النيازك بالليزر التلقائي واجمع الألماس 💎 لرصيدك!</p>

    <div class="features-row">
        <span class="feat-badge">🔫 ليزر تلقائي</span>
        <span class="feat-badge">🛡️ دروع حماية</span>
        <span class="feat-badge">☄️ كل 10 نيازك = +1 💎</span>
    </div>

    <div class="lb-box">
        <div class="lb-title">🏆 لوحة شرف أبطال الفضاء</div>
        <div id="lb-list">⏳ جاري تحميل الأبطال...</div>
    </div>

    <button id="startBtn" class="btn-main" onclick="startRequest()">
        🚀 ابدأ الجولة الآن (مجاناً)
    </button>
    <button class="btn-secondary" onclick="exitGame()">🔙 العودة لمركز الألعاب</button>
</div>

<!-- شاشة انتهاء الجولة -->
<div id="over-screen" class="overlay" style="display:none">
    <div style="font-size: 52px;">💥</div>
    <h1 style="color: var(--red);">تحطمت السفينة!</h1>
    <p id="final-score-txt" style="color:#fff; font-size:16px; font-weight:bold; margin-bottom:4px;"></p>
    <p id="final-reward-txt" style="color: var(--cyan); font-size:14px; font-weight:bold; margin-bottom:16px;"></p>

    <button id="retryBtn" class="btn-main" onclick="startRequest()">
        🔄 جولة جديدة
    </button>
    <button class="btn-secondary" onclick="exitGame()">🔙 العودة لمركز الألعاب</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ⭐ المفتاح الصحيح الكامل لقاعدة بيانات Supabase
const SUPABASE_URL = "https://smukfrwnguvmxvfwqwrv.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWtmcnduZ3V2bXh2Zndxd3J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1MDg1NjgsImV4cCI6MjA4NTA4NDU2OH0.NUr7X5V7K-jarVLNm7Ft0dHo6QkIhhGYrkteRRb9wCM";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const cv = document.getElementById("gameCanvas");
const ctx = cv.getContext("2d");
const q = id => document.getElementById(id);

let uid = "";
let user = null;
let running = false;
let busyStarting = false;

let score = 0;
let meteorsCleared = 0;
let sessionDiamondsEarned = 0;
let frame = 0;
let localPlayedSinceAd = 0;

// كائن السفينة والقدرات الخارقة
let ship = {
    x: 0,
    y: 0,
    w: 42,
    h: 46,
    hasShield: false,
    doubleLaserTimer: 0
};

let meteors = [];
let lasers = [];
let powerups = [];
let stars = [];
let particles = [];

function resize() {
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
    ship.x = cv.width / 2;
    ship.y = cv.height - 115;
}
window.addEventListener("resize", resize);
resize();

// إشعار طائر سريع بدون تعطيل اللعب
let toastTimeout = null;
function showToast(msg, color = "#00d26a") {
    const t = q("floating-toast");
    t.textContent = msg;
    t.style.borderColor = color;
    t.style.opacity = "1";
    t.style.transform = "translateX(-50%) translateY(5px)";
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        t.style.opacity = "0";
        t.style.transform = "translateX(-50%) translateY(0px)";
    }, 1800);
}

/* ================= جلب بيانات اللاعب ومزامنة الجولات ================= */

async function initUser() {
    try {
        const params = new URLSearchParams(window.location.search);
        uid = String(
            params.get("id") ||
            tg?.initDataUnsafe?.user?.id ||
            localStorage.getItem("telegram_id") ||
            localStorage.getItem("megatask_uid") ||
            ""
        ).trim();

        if (!uid || uid === "undefined" || uid === "null") {
            if (tg) tg.showAlert("❌ يرجى فتح اللعبة من داخل البوت.");
            return false;
        }

        const { data, error } = await db
            .from("users")
            .select("*")
            .eq("telegram_id", uid)
            .maybeSingle();

        if (error || !data) {
            if (tg) tg.showAlert("⚠️ لم يتم العثور على حسابك في قاعدة البيانات.");
            return false;
        }

        user = data;
        localStorage.setItem("telegram_id", uid);
        localStorage.setItem("megatask_uid", uid);

        // فحص تصفير الجولات ليوم جديد
        const today = new Date().toISOString().slice(0, 10);
        if (user.daily_game_date !== today) {
            const { data: updated } = await db
                .from("users")
                .update({ daily_game_rounds: 0, daily_game_date: today })
                .eq("telegram_id", uid)
                .select()
                .single();
            if (updated) user = updated;
        }

        updateHUD();
        return true;
    } catch (e) {
        console.error("Init user error:", e);
        return false;
    }
}

function updateHUD() {
    const currentDiamonds = Number(user?.gamepoints || 0) + sessionDiamondsEarned;
    const currentRounds = Math.min(30, Number(user?.daily_game_rounds || 0));
    q("diamonds").textContent = currentDiamonds.toLocaleString();
    q("rounds-hud").textContent = `${currentRounds}/30`;

    const progressInTen = meteorsCleared % 10;
    q("meteor-counter-txt").textContent = `☄️ ${progressInTen} / 10 للماسة`;
    q("meteor-bar-fill").style.width = `${(progressInTen / 10) * 100}%`;
}

/* ================= لوحة الشرف ================= */

async function loadLeaderboard() {
    try {
        const { data } = await db
            .from("game_scores")
            .select("*")
            .order("high_score", { ascending: false })
            .limit(3);

        if (data && data.length > 0) {
            const medals = ["🥇", "🥈", "🥉"];
            q("lb-list").innerHTML = data.map((x, i) => `
                <div class="lb-row">
                    <span>${medals[i] || '#'+(i+1)} مقاتل (${String(x.user_id).slice(-4)})</span>
                    <b style="color:var(--g)">${Number(x.high_score).toLocaleString()} نقطة</b>
                </div>
            `).join("");
        } else {
            q("lb-list").innerHTML = '<div style="color:#888; padding:6px;">كن أول بطل يسجل رقماً قياسياً!</div>';
        }
    } catch (e) {
        q("lb-list").textContent = "تعذر تحميل لوحة الشرف";
    }
}

/* ================= بدء الجولة والتحقق من الجولات اليومية والاعلان ================= */

async function startRequest() {
    if (running || busyStarting) return;
    busyStarting = true;

    const btnStart = q("startBtn");
    const btnRetry = q("retryBtn");
    btnStart.disabled = true;
    btnRetry.disabled = true;

    try {
        if (!user && !(await initUser())) return;

        const today = new Date().toISOString().slice(0, 10);
        let roundsUsed = Number(user.daily_game_rounds || 0);
        if (user.daily_game_date !== today) roundsUsed = 0;

        // التحقق من الحد الأقصى (30 جولة يومياً في صفحة الألعاب الرئيسية)
        if (roundsUsed >= 30) {
            if (tg) tg.showAlert("🛑 لقد استنفدت الحد الأقصى للجولات اليومية (30 / 30 جولة)!\n\nتتجدد الجولات تلقائياً عند منتصف الليل.");
            return;
        }

        // عرض إعلان Monetag كل 3 جولات لدعم أرباح البوت
        if (localPlayedSinceAd > 0 && localPlayedSinceAd % 3 === 0) {
            btnRetry.textContent = "📺 جاري عرض إعلان قصير...";
            try {
                if (typeof show_10959333 === "function") {
                    await show_10959333();
                }
            } catch (adErr) {
                console.warn("Ad skipped or failed:", adErr);
            }
        }

        // زيادة عداد الجولات اليومية في قاعدة البيانات
        const newRounds = roundsUsed + 1;
        const { data: updatedUser, error } = await db
            .from("users")
            .update({
                daily_game_rounds: newRounds,
                daily_game_date: today
            })
            .eq("telegram_id", uid)
            .select()
            .single();

        if (!error && updatedUser) {
            user = updatedUser;
        } else {
            user.daily_game_rounds = newRounds;
        }

        startGameSession();
    } finally {
        busyStarting = false;
        btnStart.disabled = false;
        btnRetry.disabled = false;
    }
}

function startGameSession() {
    q("start-screen").style.display = "none";
    q("over-screen").style.display = "none";

    running = true;
    score = 0;
    meteorsCleared = 0;
    sessionDiamondsEarned = 0;
    frame = 0;

    meteors = [];
    lasers = [];
    powerups = [];
    particles = [];

    ship.x = cv.width / 2;
    ship.hasShield = true; // يبدأ اللاعب بدرع مجاني لأول صدمة!
    ship.doubleLaserTimer = 0;

    q("score").textContent = "0";
    updateHUD();
    showToast("🛡️ درع البداية مفعل! انطلق!", "#00f2ff");

    requestAnimationFrame(loop);
}

/* ================= التحكم بالسفينة (لمس + ماوس) ================= */

window.addEventListener("touchmove", e => {
    if (!running || !e.touches[0]) return;
    ship.x = Math.max(26, Math.min(cv.width - 26, e.touches[0].clientX));
}, { passive: true });

window.addEventListener("touchstart", e => {
    if (!running || !e.touches[0]) return;
    ship.x = Math.max(26, Math.min(cv.width - 26, e.touches[0].clientX));
}, { passive: true });

window.addEventListener("mousemove", e => {
    if (!running) return;
    ship.x = Math.max(26, Math.min(cv.width - 26, e.clientX));
});

/* ================= المؤثرات البصرية والنجوم ================= */

function initStars() {
    stars = [];
    for (let i = 0; i < 85; i++) {
        stars.push({
            x: Math.random() * cv.width,
            y: Math.random() * cv.height,
            r: Math.random() * 1.6 + 0.3,
            s: Math.random() * 2.2 + 0.5
        });
    }
}

function burst(x, y, color, count = 16) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 28 + Math.random() * 18,
            color,
            size: Math.random() * 3 + 1
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

/* ================= تحديث منطق اللعبة ================= */

function onMeteorCleared() {
    score += 2;
    meteorsCleared++;
    q("score").textContent = score;

    // كل 10 نيازك يمنح +1 ألماسة فوراً
    if (meteorsCleared % 10 === 0) {
        sessionDiamondsEarned++;
        burst(ship.x, ship.y - 20, "#00f2ff", 22);
        showToast(`💎 +1 ألماسة! (إجمالي الجولة: ${sessionDiamondsEarned} 💎)`, "#00f2ff");
    }
    updateHUD();
}

function update() {
    // تحريك النجوم
    stars.forEach(s => {
        s.y += s.s;
        if (s.y > cv.height) { s.y = 0; s.x = Math.random() * cv.width; }
    });

    updateParticles();

    if (ship.doubleLaserTimer > 0) ship.doubleLaserTimer--;

    // إطلاق الليزر التلقائي من السفينة
    if (frame % 16 === 0) {
        if (ship.doubleLaserTimer > 0) {
            lasers.push({ x: ship.x - 12, y: ship.y - 20, vy: -11, color: "#00f2ff" });
            lasers.push({ x: ship.x + 12, y: ship.y - 20, vy: -11, color: "#00f2ff" });
        } else {
            lasers.push({ x: ship.x, y: ship.y - 24, vy: -10, color: "#00d26a" });
        }
    }

    // تحديث حركة الليزر
    for (let i = lasers.length - 1; i >= 0; i--) {
        lasers[i].y += lasers[i].vy;
        if (lasers[i].y < -20) lasers.splice(i, 1);
    }

    // توليد النيازك
    let spawnRate = Math.max(20, 48 - Math.floor(score / 25));
    if (frame % spawnRate === 0) {
        let radius = Math.random() * 18 + 14;
        meteors.push({
            x: Math.random() * (cv.width - 50) + 25,
            y: -50,
            r: radius,
            hp: radius > 24 ? 3 : 2, // النيازك الكبيرة تحتاج 3 طلقات ليزر لتدميرها
            s: Math.random() * 3.2 + 4.5 + Math.min(4, score / 90),
            rot: Math.random() * 6.28
        });
    }

    // توليد الجواهر والقدرات المساعدة (درع / ليزر مزدوج / جوهرة)
    if (frame > 0 && frame % 170 === 0) {
        const rand = Math.random();
        let pType = "gem"; // جوهرة نقاط
        if (rand < 0.22) pType = "shield";
        else if (rand < 0.45) pType = "double";

        powerups.push({
            x: Math.random() * (cv.width - 40) + 20,
            y: -30,
            r: 14,
            s: 3.2,
            type: pType
        });
    }

    // تحديث النيازك وفحص التصادم مع الليزر أو السفينة
    for (let i = meteors.length - 1; i >= 0; i--) {
        let m = meteors[i];
        m.y += m.s;
        m.rot += 0.04;

        // فحص اصطياد النيزك بالليزر
        let destroyedByLaser = false;
        for (let j = lasers.length - 1; j >= 0; j--) {
            let l = lasers[j];
            if (Math.hypot(l.x - m.x, l.y - m.y) < m.r + 5) {
                lasers.splice(j, 1);
                m.hp--;
                burst(l.x, l.y, "#ffaa00", 5);
                if (m.hp <= 0) {
                    burst(m.x, m.y, "#ff5722", 18);
                    meteors.splice(i, 1);
                    onMeteorCleared();
                    destroyedByLaser = true;
                }
                break;
            }
        }
        if (destroyedByLaser) continue;

        // فحص التصادم مع السفينة
        let dist = Math.hypot(ship.x - m.x, ship.y - m.y);
        if (dist < ship.w / 2 + m.r - 7) {
            if (ship.hasShield) {
                // الدرع يحمي السفينة ويدمر النيزك
                ship.hasShield = false;
                burst(m.x, m.y, "#00f2ff", 30);
                meteors.splice(i, 1);
                showToast("⚠️ تحطم الدرع الواقي وتم إنقاذك!", "#ffaa00");
                continue;
            } else {
                burst(ship.x, ship.y, "#ff3b30", 45);
                return gameOver();
            }
        }

        // إذا مر النيزك بسلام لأسفل الشاشة
        if (m.y > cv.height + 50) {
            meteors.splice(i, 1);
            onMeteorCleared();
        }
    }

    // تحديث الجواهر والقدرات الخارقة
    for (let i = powerups.length - 1; i >= 0; i--) {
        let p = powerups[i];
        p.y += p.s;

        if (Math.hypot(ship.x - p.x, ship.y - p.y) < ship.w / 2 + p.r) {
            if (p.type === "shield") {
                ship.hasShield = true;
                burst(p.x, p.y, "#00f2ff", 20);
                showToast("🛡️ حصلت على درع حماية!", "#00f2ff");
            } else if (p.type === "double") {
                ship.doubleLaserTimer = 420; // حوالي 7 ثوانٍ
                burst(p.x, p.y, "#ffaa00", 20);
                showToast("⚡ الليزر المزدوج مفعل!", "#ffaa00");
            } else {
                score += 5;
                q("score").textContent = score;
                burst(p.x, p.y, "#00d26a", 18);
                showToast("✨ +5 نقاط إضافية!", "#00d26a");
            }
            powerups.splice(i, 1);
        } else if (p.y > cv.height + 30) {
            powerups.splice(i, 1);
        }
    }

    frame++;
}

/* ================= الرسم على الـ Canvas ================= */

function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);

    // خلفية الفضاء المتدرجة
    let bg = ctx.createRadialGradient(cv.width / 2, cv.height * 0.65, 10, cv.width / 2, cv.height * 0.65, cv.height);
    bg.addColorStop(0, "#081826");
    bg.addColorStop(1, "#030508");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, cv.width, cv.height);

    // رسم النجوم
    stars.forEach(s => {
        ctx.globalAlpha = 0.4 + s.r / 2;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    // رسم الانفجارات والجزيئات
    particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / 40);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    // رسم طلقات الليزر
    lasers.forEach(l => {
        ctx.save();
        ctx.fillStyle = l.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = l.color;
        ctx.fillRect(l.x - 2, l.y, 4, 14);
        ctx.restore();
    });

    // رسم الجواهر والقدرات الخارقة
    powerups.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(frame * 0.04);

        let col = "#00d26a";
        if (p.type === "shield") col = "#00f2ff";
        if (p.type === "double") col = "#ffaa00";

        ctx.shadowBlur = 18;
        ctx.shadowColor = col;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(0, -p.r);
        ctx.lineTo(p.r, 0);
        ctx.lineTo(0, p.r);
        ctx.lineTo(-p.r, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });

    // رسم النيازك النارية
    meteors.forEach(m => {
        ctx.save();
        ctx.translate(m.x, m.y);

        let tail = ctx.createLinearGradient(0, -m.r * 2.5, 0, m.r);
        tail.addColorStop(0, "rgba(255,59,48,0)");
        tail.addColorStop(0.5, "rgba(255,100,0,0.35)");
        tail.addColorStop(1, "rgba(255,170,0,0.75)");

        ctx.fillStyle = tail;
        ctx.beginPath();
        ctx.moveTo(-m.r * 0.45, -m.r * 0.5);
        ctx.lineTo(m.r * 0.45, -m.r * 0.5);
        ctx.lineTo(m.r * 0.75, m.r * 2.5);
        ctx.lineTo(-m.r * 0.75, m.r * 2.5);
        ctx.fill();

        ctx.rotate(m.rot);
        let g = ctx.createRadialGradient(-m.r * 0.3, -m.r * 0.3, 2, 0, 0, m.r);
        g.addColorStop(0, "#ffe08a");
        g.addColorStop(0.45, "#ffaa00");
        g.addColorStop(1, "#ff3b30");

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, m.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    // رسم السفينة الفضائية والدرع الواقي
    ctx.save();
    ctx.translate(ship.x, ship.y);

    // هالة الدرع الواقي إن وجد
    if (ship.hasShield) {
        ctx.beginPath();
        ctx.arc(0, 0, ship.w * 0.78, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(0, 242, 255, 0.75)";
        ctx.lineWidth = 2.5;
        ctx.fillStyle = "rgba(0, 242, 255, 0.12)";
        ctx.fill();
        ctx.stroke();
    }

    // لهب المحرك
    let flame = ctx.createLinearGradient(0, 15, 0, 40);
    flame.addColorStop(0, "#fff");
    flame.addColorStop(0.4, ship.doubleLaserTimer > 0 ? "#00f2ff" : "#00d26a");
    flame.addColorStop(1, "rgba(0,210,106,0)");

    ctx.fillStyle = flame;
    ctx.beginPath();
    ctx.moveTo(-8, 12);
    ctx.lineTo(8, 12);
    ctx.lineTo(0, 38 + Math.sin(frame * 0.35) * 7);
    ctx.closePath();
    ctx.fill();

    // جسم السفينة
    ctx.shadowBlur = 18;
    ctx.shadowColor = ship.doubleLaserTimer > 0 ? "#00f2ff" : "#00d26a";
    ctx.beginPath();
    ctx.moveTo(0, -ship.h / 2);
    ctx.lineTo(-ship.w / 2, ship.h / 2);
    ctx.lineTo(0, ship.h / 3);
    ctx.lineTo(ship.w / 2, ship.h / 2);
    ctx.closePath();

    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = ship.doubleLaserTimer > 0 ? "#00f2ff" : "#00d26a";
    ctx.stroke();
    ctx.restore();
}

function loop() {
    if (!running) return;
    update();
    draw();
    requestAnimationFrame(loop);
}

/* ================= نهاية الجولة وحفظ الألماس والسكور ================= */

async function gameOver() {
    if (!running) return;
    running = false;
    localPlayedSinceAd++;

    q("final-score-txt").textContent = `🎯 النقاط المحققة: ${score.toLocaleString()} نقطة`;
    q("final-reward-txt").textContent = sessionDiamondsEarned > 0
        ? `💎 ربحت في هذه الجولة: +${sessionDiamondsEarned} ألماسة!`
        : `💡 دمر أو تفادَ 10 نيازك في الجولة القادمة لكسب الألماس!`;

    q("retryBtn").textContent = (localPlayedSinceAd % 3 === 0)
        ? "📺 شاهد إعلان والعب جولة جديدة"
        : "🔄 جولة جديدة الآن";

    q("over-screen").style.display = "flex";

    try {
        // 1. حفظ الألماس المكتسب في هذه الجولة دفعة واحدة في حساب المستخدم
        if (sessionDiamondsEarned > 0 && user) {
            const newTotalDiamonds = Number(user.gamepoints || 0) + sessionDiamondsEarned;
            const { data: updated } = await db
                .from("users")
                .update({ gamepoints: newTotalDiamonds })
                .eq("telegram_id", uid)
                .select()
                .single();

            if (updated) user = updated;

            await db.from("transactions").insert([{
                telegram_id: String(uid),
                type: "points",
                title: `أرباح لعبة حرب الفضاء (${score} نقطة)`,
                amount: `+${sessionDiamondsEarned} 💎`,
                status: "مكتمل"
            }]);
        }

        // 2. تحديث أعلى سكور في لوحة الشرف
        const { data: oldScore } = await db
            .from("game_scores")
            .select("high_score")
            .eq("user_id", uid)
            .maybeSingle();

        if (score > (oldScore?.high_score || 0)) {
            await db.from("game_scores").upsert(
                { user_id: uid, high_score: score },
                { onConflict: "user_id" }
            );
            await loadLeaderboard();
        }
    } catch (e) {
        console.error("Save game over error:", e);
    }

    sessionDiamondsEarned = 0;
    updateHUD();
}

function exitGame() {
    window.location.href = `../games.html?id=${uid}&t=${Date.now()}`;
}

/* ================= التشغيل المبدئي ================= */
(async () => {
    initStars();
    await initUser();
    await loadLeaderboard();
})();
</script>
