<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Space Dodge - MegaTask Arcade</title>

    <!-- Monetag -->
    <script src="https://libtl.com/sdk.js" data-zone="10959333" data-sdk="show_10959333"></script>

    <!-- Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --main-green: #00d26a;
            --dark-bg: #030508;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(
                180deg,
                rgba(3,5,8,0.9) 0%,
                transparent 100%
            );
        }

        .top-info-box {
            background: rgba(20, 23, 31, 0.9);
            border: 1px solid rgba(0,210,106,0.3);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,210,106,0.1);
        }

        .top-info-box span {
            color: #00d26a;
        }

        .btn-exit {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 20;
            background: rgba(255,59,48,0.2);
            border: 1px solid #ff3b30;
            color: #ff6b6b;
            padding: 7px 15px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #030508;
        }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 8, 0.94);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            text-align: center;
        }

        .overlay-screen h1 {
            color: #00d26a;
            font-size: 30px;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(0,210,106,0.4);
        }

        .overlay-screen p {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.6;
            max-width: 320px;
        }

        .btn-action-game {
            background: linear-gradient(135deg, #00d26a, #009e4f);
            color: #000;
            border: none;
            width: 100%;
            max-width: 260px;
            padding: 15px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(0, 210, 106, 0.4);
            transition: 0.2s;
        }

        .btn-action-game:active {
            transform: scale(0.96);
        }

        .leaderboard-box {
            background: rgba(20, 23, 31, 0.8);
            border: 1px solid #2d333f;
            border-radius: 15px;
            padding: 12px;
            width: 100%;
            max-width: 280px;
            margin-bottom: 20px;
            text-align: right;
            font-size: 12px;
        }

        .leaderboard-title {
            color: #ffaa00;
            font-weight: bold;
            margin-bottom: 6px;
            text-align: center;
        }

        .lb-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #ccc;
        }

        .diamond-info {
            margin-top: 10px;
            color: #00d26a;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="game-top-bar">
        <div class="top-info-box">
            النقاط: <span id="current-score">0</span>
        </div>

        <div class="top-info-box" style="margin-left:auto;margin-right:8px;">
            💎 <span id="diamond-counter">0</span>
        </div>
    </div>

    <button class="btn-exit" onclick="exitGame()">✖ خروج للألعاب</button>

    <!-- Start -->
    <div id="start-screen" class="overlay-screen">

        <div style="font-size:55px;margin-bottom:10px;">🚀</div>

        <h1>SPACE DODGE</h1>

        <p>
            تفادى النيازك السريعة واجمع الألماس الموحد 💎!
        </p>

        <div class="leaderboard-box">

            <div class="leaderboard-title">
                🏆 لوحة الشرف (أعلى السكورات)
            </div>

            <div id="lb-content">
                جاري تحميل التصنيف...
            </div>

            <div class="diamond-info">
                ☄️ كل 10 نيازك = +1 💎
            </div>

        </div>

        <button
            id="start-btn"
            class="btn-action-game"
            onclick="triggerAdAndStart()"
        >
            ⚡ بدء المهمة الفضائية — 1 💎
        </button>

    </div>

    <!-- Game Over -->
    <div id="gameover-screen" class="overlay-screen" style="display:none;">

        <div style="font-size:55px;margin-bottom:10px;">💥</div>

        <h1 style="color:#ff3b30;text-shadow:0 0 20px rgba(255,59,48,0.4);">
            اصطدام مدمر!
        </h1>

        <p
            id="final-score-text"
            style="color:white;font-size:16px;font-weight:bold;margin-bottom:10px;"
        >
            النقاط المحققة: 0
        </p>

        <p
            id="round-reward-text"
            style="color:#00d26a;font-size:14px;font-weight:bold;margin-bottom:20px;"
        >
            مكافأة الجولة: 0 💎
        </p>

        <button
            id="retry-btn"
            class="btn-action-game"
            onclick="triggerAdAndStart()"
        >
            🔄 محاولة أخرى — 1 💎
        </button>

        <button
            class="btn-action-game"
            style="background:#222630;color:#fff;margin-top:10px;"
            onclick="exitGame()"
        >
            🔙 العودة لصفحة الألعاب
        </button>

    </div>

    <canvas id="gameCanvas"></canvas>

    <script>

        /* =========================
           Telegram + Supabase
        ========================= */

        const tg = window.Telegram.WebApp;

        tg.expand();

        const S_URL = "https://smukfrwnguvmxvfwqwrv.supabase.co";

        const S_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWtmcnduZ3V2bXh2Zndxd3J2In0.NUr7X5V7K-jarVLNm7Ft0dHo6QkIhhGYrkteRRb9wCM";

        const client = supabase.createClient(S_URL, S_KEY);


        /* =========================
           User ID
        ========================= */

        const params = new URLSearchParams(window.location.search);

        let userId =
            String(params.get("id") || "").trim();

        let userData = null;
        let diamondField = "gamepoints";


        /* =========================
           Canvas
        ========================= */

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener("resize", () => {

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

        });


        /* =========================
           Game Variables
        ========================= */

        let score = 0;

        let gameRunning = false;

        let meteorCount = 0;

        let roundDiamonds = 0;

        let completedRounds =
            Number(
                localStorage.getItem("space_dodge_completed_rounds") || "0"
            );

        let adLoading = false;

        let isStarting = false;


        let ship = {
            x: canvas.width / 2,
            y: canvas.height - 120,
            width: 40,
            height: 45
        };


        let meteors = [];
        let gems = [];
        let stars = [];

        let frameCount = 0;


        /* =========================
           Stars
        ========================= */

        function initStars() {

            stars = [];

            for (let i = 0; i < 50; i++) {

                stars.push({

                    x: Math.random() * canvas.width,

                    y: Math.random() * canvas.height,

                    radius: Math.random() * 1.5,

                    speed: Math.random() * 1 + 0.3

                });

            }

        }


        /* =========================
           Find User
        ========================= */

        async function initUser() {

            try {

                /* 1 — URL */

                if (!userId) {

                    userId =
                        String(
                            tg.initDataUnsafe?.user?.id || ""
                        ).trim();

                }


                /* 2 — LocalStorage */

                if (!userId) {

                    userId =
                        String(
                            localStorage.getItem("telegram_id") || ""
                        ).trim();

                }


                /* 3 — Search latest user */

                if (!userId) {

                    const { data } =
                        await client
                            .from("users")
                            .select("*")
                            .order("created_at", {
                                ascending: false
                            })
                            .limit(1)
                            .maybeSingle();

                    if (data) {

                        userData = data;

                        userId =
                            String(data.telegram_id);

                        localStorage.setItem(
                            "telegram_id",
                            userId
                        );

                    }

                }


                /* 4 — Search by Telegram ID */

                if (!userData && userId) {

                    const { data } =
                        await client
                            .from("users")
                            .select("*")
                            .eq("telegram_id", userId)
                            .maybeSingle();

                    if (data) {

                        userData = data;

                    }

                }


                /* 5 — Numeric fallback */

                if (!userData && userId) {

                    const numericId =
                        Number(userId);

                    if (!isNaN(numericId)) {

                        const { data } =
                            await client
                                .from("users")
                                .select("*")
                                .eq("telegram_id", numericId)
                                .maybeSingle();

                        if (data) {

                            userData = data;

                        }

                    }

                }


                /* 6 — Final fallback */

                if (!userData) {

                    const { data } =
                        await client
                            .from("users")
                            .select("*")
                            .limit(1)
                            .maybeSingle();

                    if (data) {

                        userData = data;

                        userId =
                            String(data.telegram_id);

                        localStorage.setItem(
                            "telegram_id",
                            userId
                        );

                    }

                }


                if (!userData) {

                    tg.showAlert(
                        "⚠️ لم يتم العثور على حسابك."
                    );

                    return false;

                }


                /* Detect diamond field */

                if (
                    userData.gamepoints !== undefined
                ) {

                    diamondField = "gamepoints";

                } else if (
                    userData.diamonds !== undefined
                ) {

                    diamondField = "diamonds";

                } else {

                    diamondField = "gamepoints";

                }


                updateDiamondUI();

                return true;

            } catch (e) {

                console.error(
                    "User initialization error:",
                    e
                );

                tg.showAlert(
                    "⚠️ حدث خطأ أثناء تحميل حسابك."
                );

                return false;

            }

        }


        /* =========================
           Diamond UI
        ========================= */

        function getDiamonds() {

            if (!userData) return 0;

            return Number(
                userData[diamondField] || 0
            );

        }


        function updateDiamondUI() {

            document.getElementById(
                "diamond-counter"
            ).innerText = getDiamonds();

        }


        /* =========================
           Change Diamonds
        ========================= */

        async function changeDiamonds(amount, title) {

            if (!userData) return false;

            let current =
                Number(
                    userData[diamondField] || 0
                );

            let newAmount =
                Math.max(0, current + amount);


            const { data, error } =
                await client
                    .from("users")
                    .update({
                        [diamondField]: newAmount
                    })
                    .eq("telegram_id", userData.telegram_id)
                    .select()
                    .maybeSingle();


            if (error) {

                console.error(
                    "Diamond update error:",
                    error
                );

                return false;

            }


            if (data) {

                userData = data;

            } else {

                userData[diamondField] = newAmount;

            }


            updateDiamondUI();


            /* Transaction */

            try {

                await client
                    .from("transactions")
                    .insert({

                        telegram_id:
                            String(userData.telegram_id),

                        type: "points",

                        title: title,

                        amount:
                            amount > 0
                                ? `+${amount} 💎`
                                : `${amount} 💎`,

                        status: "مكتمل"

                    });

            } catch (txError) {

                console.error(
                    "Transaction error:",
                    txError
                );

            }


            return true;

        }


        /* =========================
           Monetag
        ========================= */

        async function showAd() {

            if (adLoading) return;

            adLoading = true;

            try {

                if (
                    typeof show_10959333 ===
                    "function"
                ) {

                    await show_10959333();

                } else {

                    console.warn(
                        "Monetag SDK not loaded."
                    );

                }

            } catch (e) {

                console.error(
                    "Monetag error:",
                    e
                );

            } finally {

                adLoading = false;

            }

        }


        /* =========================
           Ad every 3 completed rounds
        ========================= */

        async function checkRoundAd() {

            if (
                completedRounds > 0 &&
                completedRounds % 3 === 0
            ) {

                const retryBtn =
                    document.getElementById(
                        "retry-btn"
                    );

                if (retryBtn) {

                    retryBtn.disabled = true;

                    retryBtn.style.opacity = "0.55";

                    retryBtn.innerText =
                        "📺 جاري تحميل الإعلان...";

                }


                await showAd();


                completedRounds = 0;

                localStorage.setItem(
                    "space_dodge_completed_rounds",
                    "0"
                );


                if (retryBtn) {

                    retryBtn.disabled = false;

                    retryBtn.style.opacity = "1";

                    retryBtn.innerText =
                        "🔄 محاولة أخرى — 1 💎";

                }

            }

        }


        /* =========================
           Leaderboard
        ========================= */

        async function loadLeaderboard() {

            try {

                const {
                    data: topScores
                } =
                    await client
                        .from("game_scores")
                        .select("*")
                        .order(
                            "high_score",
                            {
                                ascending: false
                            }
                        )
                        .limit(3);


                const lbBox =
                    document.getElementById(
                        "lb-content"
                    );


                if (
                    topScores &&
                    topScores.length > 0
                ) {

                    lbBox.innerHTML = "";

                    topScores.forEach(
                        (s, idx) => {

                            const sid =
                                String(
                                    s.user_id || ""
                                );

                            lbBox.innerHTML += `
                                <div class="lb-row">
                                    <span>
                                        #${idx + 1}
                                        لاعب
                                        (${sid.slice(-4)})
                                    </span>

                                    <b style="color:#00d26a">
                                        ${s.high_score} ن
                                    </b>
                                </div>
                            `;

                        }
                    );

                } else {

                    lbBox.innerHTML =
                        "لا توجد سكورات مسجلة بعد.";

                }

            } catch (e) {

                document.getElementById(
                    "lb-content"
                ).innerHTML =
                    "فشل تحميل لوحة الشرف";

            }

        }


        /* =========================
           Start Button
        ========================= */

        async function triggerAdAndStart() {

            if (isStarting || gameRunning) return;

            isStarting = true;


            try {

                /* Load user */

                if (!userData) {

                    const ok =
                        await initUser();

                    if (!ok) return;

                }


                /* Check diamonds */

                const currentDiamonds =
                    getDiamonds();


                if (currentDiamonds < 1) {

                    tg.showAlert(
                        "⚠️ ليس لديك ألماسات كافية!\n\nيلزمك 1 💎 لبدء الجولة."
                    );

                    return;

                }


                /* Advertisement only after 3 completed rounds */

                await checkRoundAd();


                /*
                   خصم ألماسة واحدة
                   عند بداية الجولة
                */

                const deducted =
                    await changeDiamonds(
                        -1,
                        "بدء جولة لعبة Space Dodge"
                    );


                if (!deducted) {

                    tg.showAlert(
                        "⚠️ تعذر خصم الألماسة، حاول مرة أخرى."
                    );

                    return;

                }


                startGame();

            } finally {

                isStarting = false;

            }

        }


        /* =========================
           Start Game
        ========================= */

        function startGame() {

            document.getElementById(
                "start-screen"
            ).style.display = "none";

            document.getElementById(
                "gameover-screen"
            ).style.display = "none";


            gameRunning = true;

            score = 0;

            meteorCount = 0;

            roundDiamonds = 0;

            frameCount = 0;


            document.getElementById(
                "current-score"
            ).innerText = "0";


            ship.x =
                canvas.width / 2;


            meteors = [];

            gems = [];


            loop();

        }


        /* =========================
           Touch Control
        ========================= */

        window.addEventListener(
            "touchmove",
            (e) => {

                if (gameRunning) {

                    ship.x =
                        e.touches[0].clientX;


                    if (ship.x < 30)
                        ship.x = 30;


                    if (
                        ship.x >
                        canvas.width - 30
                    )
                        ship.x =
                            canvas.width - 30;

                }

            },
            {
                passive: true
            }
        );


        /* =========================
           Mouse Control
        ========================= */

        window.addEventListener(
            "mousemove",
            (e) => {

                if (gameRunning) {

                    ship.x = e.clientX;

                }

            }
        );


        /* =========================
           Game Update
        ========================= */

        function update() {

            /* Stars */

            stars.forEach(s => {

                s.y += s.speed;

                if (s.y > canvas.height)
                    s.y = 0;

            });


            /* Meteor spawn */

            let spawnRate =
                Math.max(
                    20,
                    50 -
                    Math.floor(score / 30)
                );


            if (
                frameCount % spawnRate ===
                0
            ) {

                meteors.push({

                    x:
                        Math.random() *
                        (canvas.width - 40) +
                        20,

                    y: -50,

                    radius:
                        Math.random() *
                        20 +
                        15,

                    speed:
                        Math.random() *
                        4 +
                        6 +
                        (score / 100)

                });

            }


            /* Gems */

            if (
                frameCount % 180 ===
                0
            ) {

                gems.push({

                    x:
                        Math.random() *
                        (canvas.width - 30) +
                        15,

                    y: -30,

                    radius: 12,

                    speed: 3

                });

            }


            /* Meteors */

            for (
                let i = meteors.length - 1;
                i >= 0;
                i--
            ) {

                meteors[i].y +=
                    meteors[i].speed;


                let dx =
                    ship.x -
                    meteors[i].x;

                let dy =
                    ship.y -
                    meteors[i].y;

                let distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (
                    distance <
                    ship.width / 2 +
                    meteors[i].radius -
                    8
                ) {

                    gameOver();

                    return;

                }


                /*
                   نيزك تم تفاديه
                */

                if (
                    meteors[i].y >
                    canvas.height + 50
                ) {

                    meteors.splice(i, 1);


                    score += 1;

                    meteorCount++;


                    document.getElementById(
                        "current-score"
                    ).innerText =
                        score;


                    /*
                       كل 10 نيازك = 1 ألماسة
                    */

                    if (
                        meteorCount % 10 ===
                        0
                    ) {

                        awardMeteorDiamond();

                    }

                }

            }


            /* Gems */

            for (
                let i = gems.length - 1;
                i >= 0;
                i--
            ) {

                gems[i].y +=
                    gems[i].speed;


                let dx =
                    ship.x -
                    gems[i].x;

                let dy =
                    ship.y -
                    gems[i].y;

                let distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (
                    distance <
                    ship.width / 2 +
                    gems[i].radius
                ) {

                    score += 5;

                    document.getElementById(
                        "current-score"
                    ).innerText =
                        score;

                    gems.splice(i, 1);

                    continue;

                }


                if (
                    gems[i].y >
                    canvas.height + 30
                ) {

                    gems.splice(i, 1);

                }

            }


            frameCount++;

        }


        /* =========================
           Diamond Reward
        ========================= */

        async function awardMeteorDiamond() {

            /*
               امنع تضاعف المكافأة
               لو حدثت عدة مرات
            */

            if (!userData) return;


            roundDiamonds++;


            const success =
                await changeDiamonds(
                    1,
                    "مكافأة 10 نيازك في لعبة Space Dodge"
                );


            if (success) {

                tg.showAlert(
                    "☄️ ممتاز!\n\n" +
                    "عدّيت 10 نيازك!\n" +
                    "تمت إضافة +1 💎 لرصيدك."
                );

            }

        }


        /* =========================
           Draw
        ========================= */

        function draw() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /* Stars */

            ctx.fillStyle = "#ffffff";

            stars.forEach(s => {

                ctx.beginPath();

                ctx.arc(
                    s.x,
                    s.y,
                    s.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            });


            /* Gems */

            gems.forEach(g => {

                ctx.save();

                ctx.shadowBlur = 15;

                ctx.shadowColor =
                    "#00d26a";

                ctx.beginPath();

                ctx.arc(
                    g.x,
                    g.y,
                    g.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    "#00d26a";

                ctx.fill();

                ctx.restore();

            });


            /* Meteors */

            meteors.forEach(m => {

                ctx.save();

                ctx.shadowBlur = 12;

                ctx.shadowColor =
                    "#ff3b30";

                ctx.beginPath();

                ctx.arc(
                    m.x,
                    m.y,
                    m.radius,
                    0,
                    Math.PI * 2
                );


                let grad =
                    ctx.createRadialGradient(
                        m.x,
                        m.y,
                        2,
                        m.x,
                        m.y,
                        m.radius
                    );


                grad.addColorStop(
                    0,
                    "#ffaa00"
                );

                grad.addColorStop(
                    1,
                    "#ff3b30"
                );


                ctx.fillStyle = grad;

                ctx.fill();

                ctx.restore();

            });


            /* Ship */

            ctx.save();

            ctx.shadowBlur = 20;

            ctx.shadowColor =
                "#00d26a";

            ctx.beginPath();

            ctx.moveTo(
                ship.x,
                ship.y -
                ship.height / 2
            );

            ctx.lineTo(
                ship.x -
                ship.width / 2,
                ship.y +
                ship.height / 2
            );

            ctx.lineTo(
                ship.x,
                ship.y +
                ship.height / 3
            );

            ctx.lineTo(
                ship.x +
                ship.width / 2,
                ship.y +
                ship.height / 2
            );

            ctx.closePath();

            ctx.fillStyle =
                "#ffffff";

            ctx.fill();

            ctx.lineWidth = 2;

            ctx.strokeStyle =
                "#00d26a";

            ctx.stroke();

            ctx.restore();

        }


        /* =========================
           Game Loop
        ========================= */

        function loop() {

            if (!gameRunning) return;

            update();

            draw();

            requestAnimationFrame(loop);

        }


        /* =========================
           Game Over
        ========================= */

        async function gameOver() {

            if (!gameRunning) return;

            gameRunning = false;


            document.getElementById(
                "final-score-text"
            ).innerText =
                `النقاط المحققة: ${score} نقطة`;


            document.getElementById(
                "round-reward-text"
            ).innerText =
                `💎 مكافأة هذه الجولة: ${roundDiamonds} ألماسة`;


            document.getElementById(
                "gameover-screen"
            ).style.display =
                "flex";


            try {

                /* Save high score */

                const {
                    data: oldData
                } =
                    await client
                        .from("game_scores")
                        .select("high_score")
                        .eq(
                            "user_id",
                            userId
                        )
                        .maybeSingle();


                let currentHighest =
                    oldData
                        ? oldData.high_score
                        : 0;


                if (
                    score >
                    currentHighest
                ) {

                    await client
                        .from("game_scores")
                        .upsert(
                            {
                                user_id:
                                    userId,

                                high_score:
                                    score

                            },
                            {
                                onConflict:
                                    "user_id"
                            }
                        );

                }


                /*
                   الجولة اكتملت
                */

                completedRounds++;


                localStorage.setItem(
                    "space_dodge_completed_rounds",
                    String(completedRounds)
                );


                /*
                   تحديث زر المحاولة
                   حسب الجولة الثالثة
                */

                if (
                    completedRounds > 0 &&
                    completedRounds % 3 === 0
                ) {

                    document.getElementById(
                        "retry-btn"
                    ).innerText =
                        "📺 شاهد الإعلان ثم العب";

                }


            } catch (e) {

                console.error(
                    "Score save error:",
                    e
                );

            }

        }


        /* =========================
           Exit
        ========================= */

        function exitGame() {

            window.location.href =
                `../games.html?id=${userId}`;

        }


        /* =========================
           Initial Load
        ========================= */

        async function init() {

            initStars();

            await initUser();

            await loadLeaderboard();

        }


        init();

    </script>
