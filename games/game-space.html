/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://smukfrwnguvmxvfwqwrv.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdWtmcnduZ3V2bXh2Zndxd3J2IiwiaWF0IjoxNzY5NTA4NTY4LCJleHAiOjIwODUwODQ1Njh9.NUr7X5V7K-jarVLNm7Ft0dHo6QkIhhGYrkteRRb9wCM";

/* =========================================================
   USER
========================================================= */

let telegramId = null;
let userRow = null;
let diamondField = null;
let diamonds = 0;


/* =========================================================
   GET TELEGRAM ID
========================================================= */

function getTelegramId(){

    const params = new URLSearchParams(location.search);

    const urlId =
        params.get("id") ||
        params.get("telegram_id") ||
        params.get("user_id");

    if(urlId){
        return String(urlId);
    }

    if(
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user &&
        tg.initDataUnsafe.user.id
    ){
        return String(tg.initDataUnsafe.user.id);
    }

    const local =
        localStorage.getItem("telegram_id");

    if(local){
        return String(local);
    }

    return null;
}


/* =========================================================
   SUPABASE REQUEST
========================================================= */

async function supabaseFetch(url, options = {}){

    const response = await fetch(url,{
        ...options,
        headers:{
            ...headers,
            ...(options.headers || {})
        }
    });

    const text = await response.text();

    let data = null;

    try{
        data = text ? JSON.parse(text) : null;
    }catch(e){
        data = text;
    }

    if(!response.ok){
        throw new Error(
            typeof data === "string"
                ? data
                : JSON.stringify(data)
        );
    }

    return data;
}


/* =========================================================
   FIND USER
   نفس طريقة Lucky Chests
========================================================= */

async function loadUser(){

    telegramId = getTelegramId();

    if(!telegramId){
        throw new Error("لم يتم العثور على Telegram ID");
    }

    localStorage.setItem(
        "telegram_id",
        String(telegramId)
    );

    let data = null;

    /* ---------- STRING ---------- */

    try{

        data = await supabaseFetch(
            SUPABASE_URL +
            "/rest/v1/users?telegram_id=eq." +
            encodeURIComponent(String(telegramId)) +
            "&limit=1"
        );

    }catch(e){}


    /* ---------- NUMBER ---------- */

    if(!data || !data.length){

        try{

            data = await supabaseFetch(
                SUPABASE_URL +
                "/rest/v1/users?telegram_id=eq." +
                encodeURIComponent(Number(telegramId)) +
                "&limit=1"
            );

        }catch(e){}

    }


    /* ---------- FALLBACK ---------- */

    if(!data || !data.length){

        try{

            data = await supabaseFetch(
                SUPABASE_URL +
                "/rest/v1/users?select=*&order=created_at.desc&limit=1"
            );

        }catch(e){}

    }


    if(!data || !data.length){

        throw new Error("الحساب غير موجود في قاعدة البيانات");
    }


    userRow = data[0];


    /* ---------- DETECT DIAMOND FIELD ---------- */

    if(
        Object.prototype.hasOwnProperty.call(
            userRow,
            "gamepoints"
        )
    ){

        diamondField = "gamepoints";

    }else if(
        Object.prototype.hasOwnProperty.call(
            userRow,
            "diamonds"
        )
    ){

        diamondField = "diamonds";

    }else{

        throw new Error(
            "لم يتم العثور على خانة الألماسات"
        );
    }


    diamonds =
        Number(userRow[diamondField]) || 0;

    updateDiamondUI();
}


/* =========================================================
   UPDATE UI
========================================================= */

function updateDiamondUI(){

    diamondHud.textContent =
        diamonds + " 💎";
}


/* =========================================================
   CHANGE DIAMONDS
========================================================= */

async function changeDiamonds(amount){

    if(!userRow || !diamondField){
        throw new Error("الحساب غير جاهز");
    }

    const oldValue = diamonds;

    const newValue =
        Math.max(
            0,
            oldValue + Number(amount)
        );


    let updated = false;


    /* ---------- BY STRING ID ---------- */

    try{

        const result =
            await supabaseFetch(
                SUPABASE_URL +
                "/rest/v1/users?telegram_id=eq." +
                encodeURIComponent(String(telegramId)),

                {
                    method:"PATCH",
                    headers:{
                        "Prefer":"return=representation"
                    },
                    body:JSON.stringify({
                        [diamondField]:newValue
                    })
                }
            );

        if(result && result.length){
            updated = true;
        }

    }catch(e){}


    /* ---------- BY NUMBER ID ---------- */

    if(!updated){

        try{

            const result =
                await supabaseFetch(
                    SUPABASE_URL +
                    "/rest/v1/users?telegram_id=eq." +
                    encodeURIComponent(Number(telegramId)),

                    {
                        method:"PATCH",
                        headers:{
                            "Prefer":"return=representation"
                        },
                        body:JSON.stringify({
                            [diamondField]:newValue
                        })
                    }
                );

            if(result && result.length){
                updated = true;
            }

        }catch(e){}

    }


    if(!updated){

        throw new Error(
            "فشل تحديث الألماسات"
        );
    }


    diamonds = newValue;

    userRow[diamondField] = newValue;

    updateDiamondUI();


    /* ---------- TRANSACTION ---------- */

    try{

        await supabaseFetch(
            SUPABASE_URL +
            "/rest/v1/transactions",

            {
                method:"POST",

                body:JSON.stringify({

                    telegram_id:telegramId,

                    type:"game",

                    title:
                        amount < 0
                            ? "بدء جولة حصان البحر"
                            : "مكافأة لعبة حصان البحر",

                    amount:amount

                })
            }
        );

    }catch(e){
        /* transaction optional */
    }
}


/* =========================================================
   LOAD ACCOUNT
========================================================= */

async function prepareAccount(){

    startBtn.disabled = true;

    loading.style.display = "block";

    try{

        await loadUser();

        startBtn.disabled = false;

        loading.style.display = "none";

        if(diamonds < 1){

            startBtn.disabled = true;

            showMessage(

            );

            return false;
        }

        return true;

    }catch(error){

async function showAd(){

/* =========================================================
   GAME VARIABLES
========================================================= */

let W = 0;
let H = 0;

let animationId = null;

let running = false;
let gameStarted = false;

let score = 0;

let passed = 0;

let frame = 0;

let speed = 3.2;

let gravity = 0.38;

let jumpPower = -7.5;

let pipeGap = 195;

let pipeWidth = 62;

let spawnDistance = 280;

let nextPipe = 0;

let seahorse = null;

let pipes = [];

let bubbles = [];


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener("resize",resize);

resize();


/* =========================================================
   START GAME
========================================================= */

async function startGameRequest(){

    if(running){
        return;
    }

    startBtn.disabled = true;

    loading.style.display = "block";

    try{

        /* تأكيد الحساب مرة أخرى بنفس طريقة الألعاب */

        if(!userRow){
            await loadUser();
        }

        if(diamonds < 1){

            throw new Error(
                "لا يوجد لديك ألماسات كافية"
            );
        }


        /* إعلان */

        await showAd();


        /* خصم دخول الجولة */

        startGame();


    }catch(error){

        showMessage(

        );

}


/* =========================================================
   START
========================================================= */

function startGame(){

    cancelAnimationFrame(animationId);

    running = true;
    gameStarted = true;

    score = 0;
    passed = 0;
    frame = 0;

    speed = 3.2;

    pipes = [];
    bubbles = [];

    nextPipe = 30;

    seahorse = {

        x:W * .24,

        y:H * .48,

        r:18,

        vy:0,

        rotation:0

    };


    overlay.style.display = "none";

    canvas.style.display = "block";

    document.getElementById("hud").style.display =
        "flex";

    touchHint.style.display =
        "block";

    scoreHud.textContent = "0";

    updateDiamondUI();

    createBubbles();

    animationId =
        requestAnimationFrame(loop);
}


/* =========================================================
   RESET
========================================================= */

function resetGame(){

    running = false;

    cancelAnimationFrame(animationId);

    canvas.style.display = "none";

    document.getElementById("hud").style.display =
        "none";

    touchHint.style.display =
        "none";

    overlay.style.display =
        "flex";

    startPanel.style.display =

}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(!running || !seahorse){
        return;
    }

    seahorse.vy =
        jumpPower;
}


/* =========================================================
   INPUT
========================================================= */

canvas.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        jump();

    },
    {passive:false}
);

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            jump();
        }

    }
);


/* =========================================================
   PIPES
========================================================= */

function createPipe(){

    const minTop = 95;

    const maxTop =
        Math.max(
            minTop + 30,
            H - pipeGap - 120
        );

    const top =
        minTop +
        Math.random() *
        Math.max(30,maxTop-minTop);

    pipes.push({

        x:W + 40,

        top:top,

        bottom:
            top + pipeGap,

        width:pipeWidth,

        passed:false

    });
}


/* =========================================================
   BUBBLES
========================================================= */

function createBubbles(){

    bubbles = [];

    for(let i=0;i<45;i++){

        bubbles.push({

            x:Math.random()*W,

            y:Math.random()*H,

            r:1+Math.random()*3,

            speed:.3+Math.random()*1.2,

            alpha:.2+Math.random()*.5

        });
    }
}


/* =========================================================
   UPDATE BUBBLES
========================================================= */

function updateBubbles(){

    for(const b of bubbles){

        b.y -= b.speed;

        if(b.y < -10){

            b.y = H + 10;

            b.x = Math.random()*W;
        }
    }
}


/* =========================================================
   GAME UPDATE
========================================================= */

function update(){

    frame++;

    updateBubbles();


    /* زيادة السرعة تدريجياً */

    speed =
        3.2 +
        Math.min(
            3.8,
            score * 0.035
        );


    /* Seahorse physics */

    seahorse.vy += gravity;

    seahorse.y += seahorse.vy;

    seahorse.rotation =
        Math.max(
            -.5,
            Math.min(
                .9,
                seahorse.vy * .045
            )
        );


    /* Pipes */

    for(const p of pipes){

        p.x -= speed;


        if(
            !p.passed &&
            p.x + p.width < seahorse.x
        ){

            p.passed = true;

            passed++;

            score++;

            scoreHud.textContent =
                score;


            /* كل 3 عقبات = 1 ألماسة */

            if(passed % 3 === 0){

                changeDiamonds(1)
                    .then(()=>{

                        showMessage(
                            "+1 💎 مكافأة"
                        );

                    })
                    .catch(()=>{});

            }
        }
    }


    pipes =
        pipes.filter(
            p => p.x + p.width > -50
        );


    nextPipe -= speed;

    if(nextPipe <= 0){

        createPipe();

        nextPipe =
            spawnDistance -
            Math.min(
                80,
                score * 2
            );
    }


    /* Collision */

    if(checkCollision()){

        endGame();

        return;
    }
}


/* =========================================================
   COLLISION
========================================================= */

function checkCollision(){

    const s = seahorse;

    if(
        s.y - s.r < 0 ||
        s.y + s.r > H
    ){

        return true;
    }


    for(const p of pipes){

        const horizontal =
            s.x + s.r > p.x &&
            s.x - s.r < p.x + p.width;

        if(!horizontal){
            continue;
        }


        const hitTop =
            s.y - s.r < p.top;

        const hitBottom =
            s.y + s.r > p.bottom;

        if(hitTop || hitBottom){

            return true;
        }
    }

    return false;
}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#062b42"
    );

    gradient.addColorStop(
        .5,
        "#073452"
    );

    gradient.addColorStop(
        1,
        "#020c16"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* light rays */

    ctx.save();

    ctx.globalAlpha = .07;

    for(let i=0;i<6;i++){

        ctx.beginPath();

        ctx.moveTo(
            W*.5,
            0
        );

        ctx.lineTo(
            i*(W/5),
            H
        );

        ctx.lineTo(
            i*(W/5)+100,
            H
        );

        ctx.closePath();

        ctx.fillStyle="#7ee8ff";

        ctx.fill();
    }

    ctx.restore();


    /* bubbles */

    for(const b of bubbles){

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            `rgba(170,235,255,${b.alpha})`;

        ctx.fill();
    }
}


/* =========================================================
   DRAW PIPE
========================================================= */

function drawPipe(p){

    const pipeGradient =
        ctx.createLinearGradient(
            p.x,
            0,
            p.x+p.width,
            0
        );

    pipeGradient.addColorStop(
        0,
        "#164e68"
    );

    pipeGradient.addColorStop(
        .5,
        "#2e89a2"
    );

    pipeGradient.addColorStop(
        1,
        "#0e3b52"
    );

    ctx.fillStyle =
        pipeGradient;


    /* top */

    ctx.fillRect(
        p.x,
        0,
        p.width,
        p.top
    );


    /* bottom */

    ctx.fillRect(
        p.x,
        p.bottom,
        p.width,
        H-p.bottom
    );


    /* caps */

    ctx.fillStyle="#42a9bd";

    ctx.fillRect(
        p.x-5,
        p.top-15,
        p.width+10,
        15
    );

    ctx.fillRect(
        p.x-5,
        p.bottom,
        p.width+10,
        15
    );


    /* highlights */

    ctx.fillStyle =
        "rgba(255,255,255,.12)";

    ctx.fillRect(
        p.x+8,
        0,
        7,
        p.top-15
    );

    ctx.fillRect(
        p.x+8,
        p.bottom+15,
        7,
        H-p.bottom-15
    );
}


/* =========================================================
   DRAW SEAHORSE
========================================================= */

function drawSeahorse(){

    const s = seahorse;

    ctx.save();

    ctx.translate(
        s.x,
        s.y
    );

    ctx.rotate(
        s.rotation
    );


    /* glow */

    ctx.shadowColor =
        "#5de7ff";

    ctx.shadowBlur =
        20;


    /* body */

    const body =
        ctx.createLinearGradient(
            -15,
            -25,
            15,
            25
        );

    body.addColorStop(
        0,
        "#79ecff"
    );

    body.addColorStop(
        .5,
        "#2fb8d8"
    );

    body.addColorStop(
        1,
        "#12617c"
    );

    ctx.fillStyle =
        body;

    ctx.beginPath();

    ctx.ellipse(
        0,
        2,
        15,
        25,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* head */

    ctx.beginPath();

    ctx.arc(
        7,
        -20,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* snout */

    ctx.beginPath();

    ctx.moveTo(
        15,
        -21
    );

    ctx.quadraticCurveTo(
        28,
        -18,
        25,
        -11
    );

    ctx.quadraticCurveTo(
        19,
        -12,
        14,
        -14
    );

    ctx.closePath();

    ctx.fill();


    /* crest */

    ctx.fillStyle =
        "#9af4ff";

    ctx.beginPath();

    ctx.moveTo(
        0,
        -29
    );

    ctx.lineTo(
        -4,
        -42
    );

    ctx.lineTo(
        4,
        -35
    );

    ctx.lineTo(
        8,
        -45
    );

    ctx.lineTo(
        12,
        -31
    );

    ctx.closePath();

    ctx.fill();


    /* belly */

    ctx.fillStyle =
        "rgba(207,250,255,.38)";

    ctx.beginPath();

    ctx.ellipse(
        3,
        6,
        6,
        17,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* eye */

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "#021018";

    ctx.beginPath();

    ctx.arc(
        12,
        -24,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle =
        "#fff";

    ctx.beginPath();

    ctx.arc(
        13,
        -25,
        1,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* tail */

    ctx.strokeStyle =
        "#54dff5";

    ctx.lineWidth = 6;

    ctx.lineCap =
        "round";

    ctx.beginPath();

    ctx.moveTo(
        -9,
        20
    );

    ctx.bezierCurveTo(
        -27,
        24,
        -20,
        42,
        -5,
        38
    );

    ctx.bezierCurveTo(
        8,
        35,
        4,
        28,
        -4,
        31
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    for(const p of pipes){
        drawPipe(p);
    }

    if(seahorse){
        drawSeahorse();
    }
}


/* =========================================================
   LOOP
========================================================= */

function loop(){

    if(!running){
        return;
    }

    update();

    draw();

    animationId =
        requestAnimationFrame(loop);
}


/* =========================================================
   END GAME
========================================================= */

function endGame(){

    if(!running){
        return;
    }

    running = false;

    cancelAnimationFrame(
        animationId
    );

    document.getElementById("app")
        .classList.add("shake");

    setTimeout(()=>{

        document.getElementById("app")
            .classList.remove("shake");

    },220);

    resetGame();
}


/* =========================================================
   RETRY
========================================================= */

async function retryGame(){

    if(running){
        return;
    }

    retryBtn.disabled = true;

    retryLoading.style.display =
        "block";


    try{

        if(!userRow){

            await loadUser();
        }


        if(diamonds < 1){

            throw new Error(
                "لا يوجد لديك ألماسات كافية 💎"
            );
        }


        await showAd();


        await changeDiamonds(-1);


        retryLoading.style.display =
            "none";

        startGame();

    }catch(error){

        console.error(error);

        retryLoading.style.display =
            "none";

        retryBtn.disabled = false;

        showMessage(
            error.message ||
            "تعذر بدء الجولة"
        );
    }
}


/* =========================================================
   EXIT
========================================================= */

function exitGame(){

    const id =
        telegramId ||
        getTelegramId();

    location.href =
        "../games.html?id=" +
        encodeURIComponent(
            id || ""
        );
}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = null;

function showMessage(text){

    messageBox.textContent =
        text;

    messageBox.classList.add(
        "show"
    );

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(()=>{

            messageBox.classList.remove(
                "show"
            );

        },2200);
}


/* =========================================================
   BUTTONS
========================================================= */

startBtn.addEventListener(
    "click",
    startGameRequest
);

retryBtn.addEventListener(
    "click",
    retryGame
);

exitBtn.addEventListener(
    "click",
    exitGame
);


/* =========================================================
   INITIALIZE
   نفس فكرة الألعاب التانية:
   تجهيز الحساب أولاً بدون إيقاف الصفحة
========================================================= */

(async function(){

    try{

        await loadUser();

        loading.style.display =
            "none";

        if(diamonds < 1){

            startBtn.disabled = true;

            showMessage(
                "رصيدك أقل من 1 💎"
            );

        }else{

            startBtn.disabled = false;
        }

    }catch(error){

        console.error(
            "Account initialization:",
            error
        );

        startBtn.disabled = false;

        loading.style.display =
            "none";
    }

})();
</script>
